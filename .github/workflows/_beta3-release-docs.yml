name: Temporary beta3 release docs updater

on:
  push:
    branches: [0.14-beta3-release]

permissions:
  contents: write

jobs:
  update-release-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.14-beta3-release
      - name: Update README and CHANGELOG for beta3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = [
              (
                  "**Версия:** `0.14.0-beta.2`  \n**Актуально на:** 15 сентября 2026  \n**Статус:** beta.2 / WebSocket deployment hotfix; следующая основная цель — `1.0.0` stable",
                  "**Версия:** `0.14.0-beta.3`  \n**Актуально на:** 15 сентября 2026  \n**Статус:** beta.3 / managed registration and user provisioning; следующая основная цель — `1.0.0` stable",
              ),
              (
                  "Версия `0.14.0-beta.2` сохраняет beta hardening baseline и исправляет deployment-контракт realtime Messenger: браузер использует same-origin `ws(s)://<site>[/base]/ws`, фронтовый Apache/Nginx/Caddy завершает TLS/WebSocket Upgrade, а Workerman безопасно остаётся внутренним listener на `127.0.0.1:27800`. Добавлены Open Server 6+ bridge/диагностика и regression coverage на PHP 8.1/8.3. Дальнейшая работа в `master` по-прежнему направлена на `1.0.0` stable: module isolation, updater/recovery, licensing, observability и остальные stable blockers.",
                  "Версия `0.14.0-beta.3` добавляет управляемую регистрацию и provisioning пользователей: администратор выбирает закрытый, свободный или invite-only режим, создаёт обычных пользователей из админки и управляет ограниченными инвайтами без хранения plaintext-кодов. Публичная регистрация и admin mutations защищены rate limit / CSRF / RBAC contract. Сохраняются WebSocket deployment fixes beta.2 и совместимость PHP 8.1+. Дальнейшая работа в `master` направлена на `1.0.0` stable: module isolation, updater/recovery, licensing, observability и остальные stable blockers.",
              ),
              (
                  "- **Admin panel** — управление пользователями, custom profile fields, системным лимитом File Manager и персональными storage quota overrides без physical delete связанных данных; список пользователей поддерживает server-side поиск/пагинацию.",
                  "- **Admin panel** — создание и lifecycle пользователей, управляемые режимы регистрации `disabled/open/invite`, ограниченные/revocable инвайты, custom profile fields, системный лимит File Manager и персональные storage quota overrides без physical delete связанных данных; список пользователей поддерживает server-side поиск/пагинацию.",
              ),
              (
                  "- web-registration закрыта без `REGISTRATION_INVITE_CODE`;",
                  "- публичная регистрация по умолчанию закрыта; режимы `disabled/open/invite` управляются администратором, а managed invite-коды хранятся только как SHA-256 hash;",
              ),
              (
                  "### Registration\n\nПо умолчанию web-registration закрыта. Для invite registration задайте:\n\n```env\nREGISTRATION_INVITE_CODE=<long-random-invite-secret>\n```\n\nПосле этого используется URL:\n\n```text\n/auth/registration/<REGISTRATION_INVITE_CODE>\n```\n\nНеверный или незаданный invite возвращает `404`.",
                  "### Registration\n\nПо умолчанию публичная регистрация закрыта. Администратор управляет политикой в `/admin/registration` и может выбрать один из трёх режимов:\n\n- `disabled` — самостоятельная регистрация запрещена;\n- `open` — свободная регистрация;\n- `invite` — регистрация только по действующему управляемому инвайту.\n\nВ invite-only режиме администратор создаёт приглашения с названием, сроком действия и лимитом использований. Полный код показывается один раз; в `system_settings` сохраняется только SHA-256 hash и служебные метаданные. Инвайт можно отозвать, а исчерпанный или просроченный код автоматически перестаёт действовать. Создание аккаунта и расход инвайта выполняются одной транзакцией.\n\nАдминистратор также может создавать обычных пользователей напрямую из `/admin/` независимо от публичного режима регистрации. Такое создание не выдаёт admin/superadmin права: новый аккаунт получает каноническую RBAC-роль `user`.\n\n`REGISTRATION_INVITE_CODE` из `.env` сохранён только как compatibility fallback для старых установок, пока администратор ни разу не сохранил новую явную политику в БД. После сохранения режима env-код больше не является отдельным authorization path.",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'README marker not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = "Основная цель после первого beta — `1.0.0` stable. Крупный пользовательский feature scope остаётся заморожен; приоритеты: полная runtime-изоляция модулей, package compositions, signed updater/recovery, licensing, observability, upgrade/load/soak/cross-browser evidence, key re-encryption и CSP hardening.\n\n"
          beta3 = """## 0.14.0-beta.3 — 2026-09-15

### Registration / user provisioning
- Добавлены управляемые режимы публичной регистрации: `disabled`, `open` и `invite`; безопасный default остаётся закрытым.
- Администратор может создавать обычных пользователей непосредственно из основной админ-панели независимо от публичного registration mode.
- Self-registration и admin provisioning назначают каноническую RBAC-роль `user`; выдача административных прав не смешивается с созданием аккаунта.
- Login page показывает registration entry только когда текущая policy это разрешает.

### Managed invites / security
- Добавлены управляемые инвайты с label, expiry, usage limit и revoke.
- Invite code генерируется из криптографически случайных байтов, показывается один раз и хранится в `system_settings` только как SHA-256 hash с метаданными.
- Создание аккаунта и расход managed invite выполняются в одной транзакции; singleton JSON-row блокируется через `SELECT ... FOR UPDATE`, чтобы concurrent writers не теряли изменения.
- Публичный POST регистрации защищён `AuthRateLimit` + CSRF; admin provisioning и registration/invite mutations требуют соответствующих RBAC permissions + CSRF.
- Legacy `REGISTRATION_INVITE_CODE` сохранён только как compatibility fallback до первого явного сохранения registration policy в БД.

### Deployment / verification
- Добавлен `docs/DEPLOYMENT_COMPATIBILITY.md` с отдельными рекомендациями для Open Server 6+, Open Server 5.4.x с PHP 8.1+, Linux VPS/VDS и shared hosting.
- Для shared hosting явно зафиксировано, что realtime Messenger требует long-running PHP process и WebSocket reverse proxy; cron не заменяет process manager.
- Добавлены PHP 8.1 + MySQL 8.4 registration/provisioning contract и настоящий Chromium registration lifecycle.
- Перед merge пройдены все 38 PR workflows; после merge функционального PR повторно зелёные master release/installer/module/core-security gates.

"""
          if marker not in text:
              raise SystemExit('CHANGELOG Unreleased marker not found')
          if '## 0.14.0-beta.3' in text:
              raise SystemExit('CHANGELOG beta3 section already exists')
          text = text.replace(marker, marker + beta3, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -Fq '**Версия:** `0.14.0-beta.3`' README.md
          grep -Fq '## 0.14.0-beta.3 — 2026-09-15' CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          git commit -m 'Document 0.14.0-beta.3 release'
          git push origin HEAD:0.14-beta3-release
