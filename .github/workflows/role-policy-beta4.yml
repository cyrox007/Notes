name: 0.14 Beta 4 role policies

on:
  pull_request:
    branches: [master, '1.0']
  push:
    branches: [master, 0.14-beta4-role-policies-collaboration]

permissions:
  contents: read

jobs:
  role-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo, gd
          coverage: none

      - name: Lint Beta 4 role policy runtime
        run: |
          php -l app/services/RolePolicyService.php
          php -l modules/admin/services/RoleManagementService.php
          php -l modules/admin/controllers/RoleManagementController.php
          php -l modules/admin/controllers/AdminController.php
          php -l modules/admin/middlewares/RequireAdminRolesManage.php
          php -l modules/notes/middlewares/RequireNotesUse.php
          php -l modules/tasks/middlewares/RequireTasksUse.php
          php -l modules/files/middlewares/RequireFilesUse.php
          php -l modules/messenger/middlewares/RequireMessengerUse.php
          php -l modules/profile/middlewares/RequireProfileUse.php
          php -l modules/files/middlewares/EnforceFileUploadPolicy.php
          php -l modules/files/middlewares/EnforceFileFolderPolicy.php
          php -l core/routerConfig.php
          php -l bin/migrate.php
          php -l tests/integration/role_policy_runtime.php

      - name: Verify schema, migration and runtime composition
        run: bash tests/integration/role_policy_mysql.sh

      - name: Verify admin UI and module access contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "route('admin_roles')" modules/admin/views/index.php
          grep -Fq '$canManageRoles' modules/admin/views/index.php
          grep -Fq "hasPermission(\$actorId, 'admin.roles.manage')" modules/admin/controllers/AdminController.php
          grep -Fq "route('admin_roles_policies')" modules/admin/views/roles.php
          grep -Fq "['permission_items']" modules/admin/views/roles.php
          grep -Fq "['policy_sections']" modules/admin/views/roles.php
          grep -Fq "['role_choices']" modules/admin/views/roles.php
          grep -Fq "permission_codes[]" modules/admin/views/roles.php
          grep -Fq "policies[" modules/admin/views/roles.php
          grep -Fq "role_ids[]" modules/admin/views/roles.php
          grep -Fq "RequireNotesUse::class" modules/notes/NotesRuntimeProvider.php
          grep -Fq "RequireTasksUse::class" modules/tasks/TasksRuntimeProvider.php
          grep -Fq "RequireFilesUse::class" modules/files/FilesRuntimeProvider.php
          grep -Fq "RequireMessengerUse::class" modules/messenger/MessengerRuntimeProvider.php
          grep -Fq "RequireProfileUse::class" modules/profile/ProfileRuntimeProvider.php
          grep -Fq "EnforceFileUploadPolicy::class" modules/files/FilesRuntimeProvider.php
          grep -Fq "EnforceFileFolderPolicy::class" modules/files/FilesRuntimeProvider.php
