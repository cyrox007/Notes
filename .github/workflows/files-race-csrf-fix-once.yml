name: One-shot Files race CSRF fix

on:
  push:
    branches: ['1.0-module-files-isolation']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0-module-files-isolation
      - name: Refresh CSRF after login session rotation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/integration/file_manager_admin_quota_race.sh')
          text = path.read_text(encoding='utf-8')
          old = '''  local html="${jar}.login.html"
  local headers="${jar}.login.headers"
  rm -f "$jar" "$html" "$headers"
  curl -sS -c "$jar" -b "$jar" "${BASE_URL}/auth/login/" > "$html"
  local token
  token="$(extract_csrf "$html")"
  [[ -n "$token" ]]
  local status
  status="$(curl -sS -o /tmp/file-race-login.body -D "$headers" -w '%{http_code}' \\
    -c "$jar" -b "$jar" \\
    --data-urlencode "login=${username}" \\
    --data-urlencode "password=${password}" \\
    --data-urlencode "csrf_token=${token}" \\
    "${BASE_URL}/auth/login/")"
  [[ "$status" = '302' ]]
  printf '%s' "$token" > "$token_file"
'''
          new = '''  local html="${jar}.login.html"
  local headers="${jar}.login.headers"
  local authenticated_html="${jar}.authenticated.html"
  rm -f "$jar" "$html" "$headers" "$authenticated_html"
  curl -sS -c "$jar" -b "$jar" "${BASE_URL}/auth/login/" > "$html"
  local anonymous_token
  anonymous_token="$(extract_csrf "$html")"
  [[ -n "$anonymous_token" ]]
  local status
  status="$(curl -sS -o /tmp/file-race-login.body -D "$headers" -w '%{http_code}' \\
    -c "$jar" -b "$jar" \\
    --data-urlencode "login=${username}" \\
    --data-urlencode "password=${password}" \\
    --data-urlencode "csrf_token=${anonymous_token}" \\
    "${BASE_URL}/auth/login/")"
  [[ "$status" = '302' ]]

  local authenticated_status
  authenticated_status="$(curl -sS -o "$authenticated_html" -w '%{http_code}' -c "$jar" -b "$jar" "${BASE_URL}/files/")"
  [[ "$authenticated_status" = '200' ]]
  local authenticated_token
  authenticated_token="$(extract_csrf "$authenticated_html")"
  [[ -n "$authenticated_token" ]]
  [[ "$authenticated_token" != "$anonymous_token" ]]
  printf '%s' "$authenticated_token" > "$token_file"
'''
          if old not in text:
              raise SystemExit('login_session block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n tests/integration/file_manager_admin_quota_race.sh
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/file_manager_admin_quota_race.sh
          git commit -m 'test: refresh CSRF in Files quota race sessions'
          git push origin HEAD:1.0-module-files-isolation
