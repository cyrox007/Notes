name: 1.0.12/1.0.13 → 1.0.14 сквозной updater

on:
  pull_request:
    branches: [dev, '1.0', master, 'release/1.0.*-rc']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-update-e2e:
    name: exact-upgrade (${{ matrix.source_version }} → 1.0.14, PHP ${{ matrix.php }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_version: '1.0.12'
            source_code: '10012'
            php: '8.1'
            mode: web-only
            disable_functions: 'proc_open,proc_get_status,proc_terminate,proc_close,exec,system,passthru,shell_exec,popen'
          - source_version: '1.0.13'
            source_code: '10013'
            php: '8.1'
            mode: web-only
            disable_functions: 'proc_open,proc_get_status,proc_terminate,proc_close,exec,system,passthru,shell_exec,popen'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admin_update_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Подготовить PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, mbstring, sodium, openssl, fileinfo, gd, zlib
          coverage: none

      - name: Установить PHP-зависимости
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Установить Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Проверить синтаксис E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/support/admin_update_https_fixture.py
          node --check tests/e2e/admin-update-rollback.mjs
          node --check tests/e2e/admin-update-apply.mjs
          node --check tests/e2e/admin-update-interrupt.mjs
          node --check tests/e2e/admin-update-reject.mjs
          node --check tests/e2e/admin-update-post-smoke.mjs
          php -l modules/admin/services/AdminUpdateService.php
          php -l bin/update_run.php
          php -l tests/support/admin_update_preservation_probe.php
          printf 'Режим updater E2E: %s; отключённые функции: %s\n' \
            '${{ matrix.mode }}' '${{ matrix.disable_functions }}'

      - name: Подготовить тестовую базу ${{ matrix.source_version }} и суперадминистратора
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: admin_update_e2e
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          SOURCE="$DRILL/source-v${{ matrix.source_version }}"
          rm -rf "$DRILL"
          mkdir -p "$SOURCE"

          git rev-parse --verify 'refs/tags/v${{ matrix.source_version }}'
          git archive --format=tar 'v${{ matrix.source_version }}' | tar -xf - -C "$SOURCE"

          test "$(php -r "require '$SOURCE/core/Version.php'; echo Core\\Version::VERSION;")" = '${{ matrix.source_version }}'
          test "$(php -r "require '$SOURCE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '${{ matrix.source_code }}'

          # Стенд моделирует хостинг, где приложение действительно может
          # самостоятельно создать свои триггеры без административного DB-пользователя.
          # SUPER приложению не выдаётся.
          mysql -h 127.0.0.1 -uroot -proot \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

          mysql -h 127.0.0.1 -uroot -proot <<'SQL'
          CREATE USER 'workspace_app'@'%' IDENTIFIED BY 'workspace-ci-limited-db';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP,
                REFERENCES, TRIGGER, CREATE VIEW, SHOW VIEW, LOCK TABLES
            ON admin_update_e2e.* TO 'workspace_app'@'%';
          FLUSH PRIVILEGES;
          SQL

          mapfile -t SCHEMAS < <(
            cd "$SOURCE"
            php -r '
              require "core/ModuleManifest.php";
              require "core/DatabaseOwnership.php";
              foreach (Core\DatabaseOwnership::fromPackageRoot(getcwd())->schemaFiles() as $path) {
                  echo getcwd(), DIRECTORY_SEPARATOR, $path, PHP_EOL;
              }
            '
          )
          test "${#SCHEMAS[@]}" -gt 0
          for schema in "${SCHEMAS[@]}"; do
            echo "Импорт схемы тестовой ${{ matrix.source_version }}: $schema"
            mysql -h 127.0.0.1 -uworkspace_app -pworkspace-ci-limited-db admin_update_e2e < "$schema"
          done

          DBHOST=127.0.0.1 DBPORT=3306 DBUSER=workspace_app DBPASS=workspace-ci-limited-db DBNAME=admin_update_e2e EXPECT_READY=1 \
            php "$SOURCE/tests/integration/schema_readiness_runtime.php"

          TEST_PASSWORD="$(php -r 'echo bin2hex(random_bytes(18));')"
          echo "::add-mask::$TEST_PASSWORD"
          export TEST_PASSWORD

          php <<'PHP'
          <?php
          declare(strict_types=1);

          $pdo = new PDO(
              'mysql:host=127.0.0.1;port=3306;dbname=admin_update_e2e;charset=utf8mb4',
              'root',
              'root',
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $hash = password_hash((string) getenv('TEST_PASSWORD'), PASSWORD_ARGON2ID);
          $stmt = $pdo->prepare(
              'INSERT INTO users (uid,username,email,password_hash,firstname,lastname,role,is_active,created_at,updated_at) '
              . 'VALUES (:uid,:username,:email,:password_hash,:firstname,:lastname,1,1,NOW(),NOW())'
          );
          $stmt->execute([
              ':uid' => 'ba5e0000-0000-4000-8000-000000000103',
              ':username' => 'admin-update-e2e',
              ':email' => 'admin-update-e2e@example.test',
              ':password_hash' => $hash,
              ':firstname' => 'Admin',
              ':lastname' => 'Update E2E',
          ]);
          PHP

          APP_GRANTS="$(mysql -N -B -h 127.0.0.1 -uworkspace_app -pworkspace-ci-limited-db \
            -e 'SHOW GRANTS FOR CURRENT_USER')"
          FOREIGN_TRIGGER_DEFINERS="$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e \
            -e "SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA=DATABASE() AND DEFINER <> 'workspace_app@%';")"
          if [[ "$FOREIGN_TRIGGER_DEFINERS" != '0' ]]; then
            echo 'Исходная E2E-установка содержит триггеры чужого DB-пользователя и не соответствует штатному installer contract' >&2
            exit 1
          fi
          if grep -Eq 'CREATE ROUTINE|ALTER ROUTINE' <<<"$APP_GRANTS"; then
            echo 'Тестовый пользователь БД неожиданно получил права на хранимые процедуры' >&2
            exit 1
          fi

          printf 'E2E_DB_USER=%s\n' 'workspace_app' >> "$GITHUB_ENV"
          printf 'E2E_DB_PASSWORD=%s\n' 'workspace-ci-limited-db' >> "$GITHUB_ENV"

          printf 'E2E_USER=%s\n' 'admin-update-e2e' >> "$GITHUB_ENV"
          printf 'E2E_PASSWORD=%s\n' "$TEST_PASSWORD" >> "$GITHUB_ENV"
          printf 'E2E_ORIGIN=%s\n' 'http://127.0.0.1:18094' >> "$GITHUB_ENV"
          printf 'E2E_BASE_PATH=%s\n' '/workspace' >> "$GITHUB_ENV"
          printf 'E2E_SOURCE_VERSION=%s\n' '${{ matrix.source_version }}' >> "$GITHUB_ENV"
          printf 'E2E_SOURCE_VERSION_CODE=%s\n' '${{ matrix.source_code }}' >> "$GITHUB_ENV"
          printf 'E2E_TARGET_VERSION=%s\n' '1.0.14-admin-e2e' >> "$GITHUB_ENV"
          printf 'E2E_TARGET_VERSION_CODE=%s\n' '10014' >> "$GITHUB_ENV"
          printf 'E2E_BROKEN_TARGET_VERSION=%s\n' '1.0.14-broken-e2e' >> "$GITHUB_ENV"
          printf 'E2E_HEALTH_BROKEN_TARGET_VERSION=%s\n' '1.0.14-health-broken-e2e' >> "$GITHUB_ENV"

      - name: Подготовить отдельную живую установку ${{ matrix.source_version }}
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          SOURCE="$DRILL/source-v${{ matrix.source_version }}"
          PRIVATE="$DRILL/private"
          rm -rf "$LIVE" "$PRIVATE"
          mkdir -p \
            "$LIVE" \
            "$PRIVATE/logs" \
            "$PRIVATE/file_manager" \
            "$PRIVATE/messenger" \
            "$PRIVATE/notes" \
            "$PRIVATE/users" \
            "$PRIVATE/rate-limit" \
            "$PRIVATE/legacy" \
            "$PRIVATE/staging" \
            "$PRIVATE/state" \
            "$PRIVATE/backups" \
            "$PRIVATE/releases"
          chmod 700 \
            "$PRIVATE" \
            "$PRIVATE/logs" \
            "$PRIVATE/file_manager" \
            "$PRIVATE/messenger" \
            "$PRIVATE/notes" \
            "$PRIVATE/users" \
            "$PRIVATE/rate-limit" \
            "$PRIVATE/legacy" \
            "$PRIVATE/staging" \
            "$PRIVATE/state" \
            "$PRIVATE/backups" \
            "$PRIVATE/releases"

          rsync -a "$SOURCE/" "$LIVE/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'cache/*' \
            --exclude 'compile/*'

          APP_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          MESSAGE_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          TICKET_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          PHP_CLI="$(command -v php)"
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$MESSAGE_KEY"
          echo "::add-mask::$TICKET_KEY"

          cat > "$LIVE/.env" <<ENV
          DBDRIVER=mysql
          DBHOST=127.0.0.1
          DBPORT=3306
          DBUSER=${E2E_DB_USER}
          DBPASS=${E2E_DB_PASSWORD}
          DBNAME=admin_update_e2e
          UNIQUE_KEY=${APP_KEY}
          MSG_SECRET_KEY=${MESSAGE_KEY}
          WS_TICKET_SECRET=${TICKET_KEY}
          PRIVATE_STORAGE_PATH=${PRIVATE}
          RATE_LIMIT_STORAGE_PATH=${PRIVATE}/rate-limit
          SITEURL=http://127.0.0.1:18094
          BASE_PATH=/workspace/
          WS_HOST=127.0.0.1
          WS_PORT=27807
          WS_PUBLIC_URL=ws://127.0.0.1:27807/workspace/ws
          WS_ALLOWED_ORIGINS=http://127.0.0.1:18094
          MAX_LOGIN_ATTEMPTS=50
          AUTH_RATE_LIMIT_WINDOW_SECONDS=60
          UPLOAD_RATE_LIMIT_ATTEMPTS=100
          UPLOAD_RATE_LIMIT_WINDOW_SECONDS=60
          LOG_LEVEL=INFO
          LOG_FILE=${PRIVATE}/logs/app.log
          CSRF_ENABLED=true
          UPDATE_FEED_URL=https://updates.e2e.test/stable/feed.json
          UPDATE_CHANNEL=stable
          UPDATE_ACCESS_MODE=offline
          UPDATE_STAGING_PATH=${PRIVATE}/staging
          UPDATE_STATE_PATH=${PRIVATE}/state
          UPDATE_BACKUP_PATH=${PRIVATE}/backups
          UPDATE_RELEASE_PATH=${PRIVATE}/releases
          UPDATE_PHP_BINARY=${PHP_CLI}
          ENV
          chmod 600 "$LIVE/.env"

          mkdir -p "$LIVE/cache" "$LIVE/compile"
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION;")" = '${{ matrix.source_version }}'
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '${{ matrix.source_code }}'

      - name: Подготовить безопасный updater-мост ${{ matrix.source_version }} → 1.0.14
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/tmp/workspace-admin-update-e2e/live

          php tools/release/bootstrap-1.0.12-updater.php --yes --root="$LIVE"

          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION;")" = '${{ matrix.source_version }}'
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '${{ matrix.source_code }}'
          ! grep -Fq 'if ($replace && file_exists($path) && !@unlink($path))' "$LIVE/core/UpdateWebContinuation.php"
          grep -Fq 'leaseStatus' "$LIVE/core/UpdateWebContinuation.php"
          grep -Fq 'webRecoveryGuard' "$LIVE/core/UpdateAutomaticRecovery.php"

      - name: Создать контрольные пользовательские данные ${{ matrix.source_version }}
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: admin_update_e2e
          PRIVATE_STORAGE_PATH: /tmp/workspace-admin-update-e2e/private
        run: |
          set -euo pipefail
          php tests/support/admin_update_preservation_probe.php --seed

      - name: Активировать временную CI-лицензию
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/tmp/workspace-admin-update-e2e/live

          # Опубликованная исходная версия уже документирует workspace.* как production feature,
          # но его CI-fixture ещё использовал исторические короткие имена.
          # Для upgrade-drill выдаём тестовую лицензию по опубликованному
          # production-контракту исходной версии, не добавляя legacy aliases в runtime.
          cp tests/support/ci_license_fixture.php "$LIVE/tests/support/ci_license_fixture.php"
          (cd "$LIVE" && php tests/support/ci_license_fixture.php)
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT COUNT(*) FROM user_roles ur JOIN roles r ON r.id=ur.role_id JOIN users u ON u.id=ur.user_id WHERE u.username='admin-update-e2e' AND r.code='superadmin'")" = '1'
          test -n "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT setting_value FROM system_settings WHERE setting_key='workspace_license_token'")"

      - name: Подготовить ключ подписи тестовых обновлений
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          KEY_ID=ci-admin-update-e2e
          PRIVATE_KEY="$DRILL/$KEY_ID.update-secret"

          php "$LIVE/tools/vendor-update/keygen.php" \
            --key-id="$KEY_ID" \
            --private-out="$PRIVATE_KEY" | tee "$DRILL/keygen.txt"
          PUBLIC_KEY="$(sed -n 's/^Public key: //p' "$DRILL/keygen.txt" | head -n1)"
          test -n "$PUBLIC_KEY"
          test -s "$PRIVATE_KEY"

          TEST_UPDATE_PUBLIC_KEY="$PUBLIC_KEY" php -r '
            $path=$argv[1];
            $keys=require $path;
            $keys["ci-admin-update-e2e"]=getenv("TEST_UPDATE_PUBLIC_KEY");
            $bytes="<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export($keys,true).";\n";
            if (file_put_contents($path,$bytes,LOCK_EX)===false) exit(1);
          ' "$LIVE/config/update_trusted_keys.php"
          php -l "$LIVE/config/update_trusted_keys.php"

          printf '%s\n' "$PUBLIC_KEY" > "$DRILL/update-public-key.txt"
          chmod 600 "$DRILL/update-public-key.txt"

      - name: Подготовить подписанный 1.0.14 для проверки автоматического уведомления
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          FEED_ROOT="$DRILL/feed-root"
          FUTURE="$DRILL/workspace-organizer-v1.0.14-admin-e2e"
          KEY_ID=ci-admin-update-e2e
          PRIVATE_KEY="$DRILL/$KEY_ID.update-secret"
          PUBLIC_KEY="$(cat "$DRILL/update-public-key.txt")"

          test -s "$PRIVATE_KEY"
          test -n "$PUBLIC_KEY"
          mkdir -p "$FEED_ROOT/stable"
          rm -rf "$FUTURE"
          mkdir -p "$FUTURE"
          rsync -a "$GITHUB_WORKSPACE/" "$FUTURE/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'cache/*' \
            --exclude 'compile/*' \
            --exclude '*.license-secret' \
            --exclude '*.update-secret' \
            --exclude '*.log'
          mkdir -p "$FUTURE/cache" "$FUTURE/compile"

          # Сохраняем тот же тестовый публичный корень и в следующем пакете,
          # чтобы результат обновления из Admin UI проверялся с валидной лицензией.
          cp "$LIVE/config/license_trusted_keys.php" "$FUTURE/config/license_trusted_keys.php"
          php -l "$FUTURE/config/license_trusted_keys.php"

          perl -0pi -e "s/public const VERSION = '[^']+';/public const VERSION = '1.0.14-admin-e2e';/" "$FUTURE/core/Version.php"
          perl -0pi -e "s/public const VERSION_CODE = [0-9]+;/public const VERSION_CODE = 10014;/" "$FUTURE/core/Version.php"

          TEST_UPDATE_PUBLIC_KEY="$PUBLIC_KEY" php -r '
            $path=$argv[1];
            $keys=require $path;
            $keys["ci-admin-update-e2e"]=getenv("TEST_UPDATE_PUBLIC_KEY");
            $bytes="<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export($keys,true).";\n";
            if (file_put_contents($path,$bytes,LOCK_EX)===false) exit(1);
          ' "$FUTURE/config/update_trusted_keys.php"

          test "$(php -r "require '$FUTURE/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.14-admin-e2e'
          test "$(php -r "require '$FUTURE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10014'

          BROKEN="$DRILL/workspace-organizer-v1.0.14-broken-e2e"
          rm -rf "$BROKEN"
          rsync -a "$FUTURE/" "$BROKEN/"
          perl -0pi -e "s/public const VERSION = '[^']+';/public const VERSION = '1.0.14-broken-e2e';/" "$BROKEN/core/Version.php"

          # Современный updater не запускает bin/migrate.php: миграции выполняет
          # UpdateDatabaseMigrator внутри destructive-фазы. Поэтому fault-injection
          # должен быть настоящей pending SQL-миграцией кандидата, которая проходит
          # read-only preflight, но гарантированно падает уже после переключения кода.
          cat > "$BROKEN/database/migrations/20991231_ci_forced_failure.sql" <<'SQL'
          SIGNAL SQLSTATE '45000'
              SET MESSAGE_TEXT = 'CI: намеренный отказ миграции для проверки автоматического отката';
          SQL

          php -r '
            $path=$argv[1];
            $data=json_decode((string) file_get_contents($path), true, 32, JSON_THROW_ON_ERROR);
            $data["migrations"][]="20991231_ci_forced_failure.sql";
            file_put_contents(
                $path,
                json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL,
                LOCK_EX
            );
          ' "$BROKEN/database/migrations/manifest.json"

          php -r '
            $path=$argv[1];
            $data=json_decode((string) file_get_contents($path), true, 32, JSON_THROW_ON_ERROR);
            $data["database"]["migrations"][]="database/migrations/20991231_ci_forced_failure.sql";
            file_put_contents(
                $path,
                json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL,
                LOCK_EX
            );
          ' "$BROKEN/modules/files/module.json"

          grep -Fq '"20991231_ci_forced_failure.sql"' "$BROKEN/database/migrations/manifest.json"
          grep -Fq 'database/migrations/20991231_ci_forced_failure.sql' "$BROKEN/modules/files/module.json"
          test -s "$BROKEN/database/migrations/20991231_ci_forced_failure.sql"
          test "$(php -r "require '$BROKEN/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.14-broken-e2e'
          test "$(php -r "require '$BROKEN/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10014'

          HEALTH_BROKEN="$DRILL/workspace-organizer-v1.0.14-health-broken-e2e"
          rm -rf "$HEALTH_BROKEN"
          rsync -a "$FUTURE/" "$HEALTH_BROKEN/"
          perl -0pi -e "s/public const VERSION = '[^']+';/public const VERSION = '1.0.14-health-broken-e2e';/" "$HEALTH_BROKEN/core/Version.php"
          # Второй аварийный кандидат должен успешно применить миграцию,
          # сохранить корректный контракт БД, а затем упасть именно на post-health.
          # Нельзя ломать обязательную таблицу в SQL: такой дефект мигратор обязан
          # поймать раньше post-health, и тест проверял бы не ту границу.
          cat > "$HEALTH_BROKEN/database/migrations/20991231_ci_post_health_failure.sql" <<'SQL'
          CREATE TABLE IF NOT EXISTS ci_post_health_marker (
              id INT NOT NULL PRIMARY KEY,
              created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          SQL

          python3 - "$HEALTH_BROKEN/core/UpdateWebHealthProbe.php" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          old = "'status' => $failed ? 'fail' : 'ok'"
          new = "'status' => 'fail'"
          if old not in source:
              raise SystemExit('Не найден ожидаемый health-status контракт кандидата')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq "'status' => 'fail'" "$HEALTH_BROKEN/core/UpdateWebHealthProbe.php"

          php -r '
            $path=$argv[1];
            $data=json_decode((string) file_get_contents($path), true, 32, JSON_THROW_ON_ERROR);
            $data["migrations"][]="20991231_ci_post_health_failure.sql";
            file_put_contents(
                $path,
                json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL,
                LOCK_EX
            );
          ' "$HEALTH_BROKEN/database/migrations/manifest.json"

          php -r '
            $path=$argv[1];
            $data=json_decode((string) file_get_contents($path), true, 32, JSON_THROW_ON_ERROR);
            $data["database"]["migrations"][]="database/migrations/20991231_ci_post_health_failure.sql";
            file_put_contents(
                $path,
                json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL,
                LOCK_EX
            );
          ' "$HEALTH_BROKEN/modules/files/module.json"

