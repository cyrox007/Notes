name: 1.0.3 сквозное обновление из админ-панели

on:
  pull_request:
    branches: [dev, '1.0', master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-update-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admin_update_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, openssl, fileinfo, gd, zlib
          coverage: none

      - name: Установить PHP-зависимости
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Установить Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Проверить синтаксис E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/support/admin_update_https_fixture.py
          node --check tests/e2e/admin-update-apply.mjs
          php -l modules/admin/services/AdminUpdateService.php
          php -l bin/update_run.php
          php -l tools/release/bootstrap-1.0.2-updater.php

      - name: Подготовить каноническую БД и суперадминистратора
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: admin_update_e2e
        run: |
          set -euo pipefail
          mapfile -t SCHEMAS < <(
            php -r '
              require "core/ModuleManifest.php";
              require "core/DatabaseOwnership.php";
              foreach (Core\DatabaseOwnership::fromPackageRoot(getcwd())->schemaFiles() as $path) {
                  echo $path, PHP_EOL;
              }
            '
          )
          test "${#SCHEMAS[@]}" -gt 0
          for schema in "${SCHEMAS[@]}"; do
            echo "Импорт канонической схемы: $schema"
            mysql -h 127.0.0.1 -uroot -proot admin_update_e2e < "$schema"
          done

          DBHOST=127.0.0.1 DBPORT=3306 DBUSER=root DBPASS=root DBNAME=admin_update_e2e EXPECT_READY=1 \
            php tests/integration/schema_readiness_runtime.php

          TEST_PASSWORD="$(php -r 'echo bin2hex(random_bytes(18));')"
          echo "::add-mask::$TEST_PASSWORD"
          export TEST_PASSWORD

          php <<'PHP'
          <?php
          declare(strict_types=1);

          $pdo = new PDO(
              'mysql:host=127.0.0.1;port=3306;dbname=admin_update_e2e;charset=utf8mb4',
              'root',
              'root',
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $hash = password_hash((string) getenv('TEST_PASSWORD'), PASSWORD_ARGON2ID);
          $stmt = $pdo->prepare(
              'INSERT INTO users (uid,username,email,password_hash,firstname,lastname,role,is_active,created_at,updated_at) '
              . 'VALUES (:uid,:username,:email,:password_hash,:firstname,:lastname,1,1,NOW(),NOW())'
          );
          $stmt->execute([
              ':uid' => 'ba5e0000-0000-4000-8000-000000000103',
              ':username' => 'admin-update-e2e',
              ':email' => 'admin-update-e2e@example.test',
              ':password_hash' => $hash,
              ':firstname' => 'Admin',
              ':lastname' => 'Update E2E',
          ]);
          PHP

          printf 'E2E_USER=%s\n' 'admin-update-e2e' >> "$GITHUB_ENV"
          printf 'E2E_PASSWORD=%s\n' "$TEST_PASSWORD" >> "$GITHUB_ENV"
          printf 'E2E_ORIGIN=%s\n' 'http://127.0.0.1:18094' >> "$GITHUB_ENV"
          printf 'E2E_BASE_PATH=%s\n' '/workspace' >> "$GITHUB_ENV"
          printf 'E2E_SOURCE_VERSION=%s\n' '1.0.3' >> "$GITHUB_ENV"
          printf 'E2E_SOURCE_VERSION_CODE=%s\n' '10003' >> "$GITHUB_ENV"
          printf 'E2E_TARGET_VERSION=%s\n' '1.0.4-admin-e2e' >> "$GITHUB_ENV"
          printf 'E2E_TARGET_VERSION_CODE=%s\n' '10004' >> "$GITHUB_ENV"

      - name: Подготовить отдельную живую установку 1.0.2
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          SOURCE="$DRILL/source-v1.0.2"
          PRIVATE="$DRILL/private"
          rm -rf "$DRILL"
          mkdir -p \
            "$LIVE" \
            "$PRIVATE/logs" \
            "$PRIVATE/file_manager" \
            "$PRIVATE/messenger" \
            "$PRIVATE/notes" \
            "$PRIVATE/users" \
            "$PRIVATE/rate-limit" \
            "$PRIVATE/legacy" \
            "$PRIVATE/staging" \
            "$PRIVATE/state" \
            "$PRIVATE/backups" \
            "$PRIVATE/releases"
          chmod 700 \
            "$PRIVATE" \
            "$PRIVATE/logs" \
            "$PRIVATE/file_manager" \
            "$PRIVATE/messenger" \
            "$PRIVATE/notes" \
            "$PRIVATE/users" \
            "$PRIVATE/rate-limit" \
            "$PRIVATE/legacy" \
            "$PRIVATE/staging" \
            "$PRIVATE/state" \
            "$PRIVATE/backups" \
            "$PRIVATE/releases"

          git worktree add --detach "$SOURCE" v1.0.2
          rsync -a "$SOURCE/" "$LIVE/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'cache/*' \
            --exclude 'compile/*'

          APP_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          MESSAGE_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          TICKET_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          PHP_CLI="$(command -v php)"
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$MESSAGE_KEY"
          echo "::add-mask::$TICKET_KEY"

          cat > "$LIVE/.env" <<ENV
          DBDRIVER=mysql
          DBHOST=127.0.0.1
          DBPORT=3306
          DBUSER=root
          DBPASS=root
          DBNAME=admin_update_e2e
          UNIQUE_KEY=${APP_KEY}
          MSG_SECRET_KEY=${MESSAGE_KEY}
          WS_TICKET_SECRET=${TICKET_KEY}
          PRIVATE_STORAGE_PATH=${PRIVATE}
          RATE_LIMIT_STORAGE_PATH=${PRIVATE}/rate-limit
          SITEURL=http://127.0.0.1:18094
          BASE_PATH=/workspace/
          WS_HOST=127.0.0.1
          WS_PORT=27807
          WS_PUBLIC_URL=ws://127.0.0.1:27807/workspace/ws
          WS_ALLOWED_ORIGINS=http://127.0.0.1:18094
          AUTH_RATE_LIMIT_ATTEMPTS=50
          AUTH_RATE_LIMIT_WINDOW_SECONDS=60
          UPLOAD_RATE_LIMIT_ATTEMPTS=100
          UPLOAD_RATE_LIMIT_WINDOW_SECONDS=60
          LOG_LEVEL=INFO
          LOG_FILE=${PRIVATE}/logs/app.log
          CSRF_ENABLED=true
          UPDATE_FEED_URL=https://updates.e2e.test/stable/feed.json
          UPDATE_CHANNEL=stable
          UPDATE_ACCESS_MODE=offline
          UPDATE_STAGING_PATH=${PRIVATE}/staging
          UPDATE_STATE_PATH=${PRIVATE}/state
          UPDATE_BACKUP_PATH=${PRIVATE}/backups
          UPDATE_RELEASE_PATH=${PRIVATE}/releases
          UPDATE_PHP_BINARY=${PHP_CLI}
          ENV
          chmod 600 "$LIVE/.env"

          mkdir -p "$LIVE/cache" "$LIVE/compile"
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.2'
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10002'

      - name: Активировать временную CI-лицензию
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/tmp/workspace-admin-update-e2e/live
          (cd "$LIVE" && php tests/support/ci_license_fixture.php)
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT COUNT(*) FROM user_roles ur JOIN roles r ON r.id=ur.role_id JOIN users u ON u.id=ur.user_id WHERE u.username='admin-update-e2e' AND r.code='superadmin'")" = '1'
          test -n "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT setting_value FROM system_settings WHERE setting_key='workspace_license_token'")"

      - name: Собрать и подписать тестовое обновление 1.0.3
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          FEED_ROOT="$DRILL/feed-root"
          TARGET="$DRILL/workspace-organizer-v1.0.3"
          KEY_ID=ci-admin-update-e2e
          PRIVATE_KEY="$DRILL/$KEY_ID.update-secret"

          php "$LIVE/tools/vendor-update/keygen.php" \
            --key-id="$KEY_ID" \
            --private-out="$PRIVATE_KEY" | tee "$DRILL/keygen.txt"
          PUBLIC_KEY="$(sed -n 's/^Public key: //p' "$DRILL/keygen.txt" | head -n1)"
          test -n "$PUBLIC_KEY"
          test -s "$PRIVATE_KEY"

          TEST_UPDATE_PUBLIC_KEY="$PUBLIC_KEY" php -r '
            $path=$argv[1];
            $keys=require $path;
            $keys["ci-admin-update-e2e"]=getenv("TEST_UPDATE_PUBLIC_KEY");
            $bytes="<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export($keys,true).";\n";
            if (file_put_contents($path,$bytes,LOCK_EX)===false) exit(1);
          ' "$LIVE/config/update_trusted_keys.php"
          php -l "$LIVE/config/update_trusted_keys.php"

          rm -rf "$TARGET" "$FEED_ROOT"
          mkdir -p "$TARGET" "$FEED_ROOT/stable"
          rsync -a "$GITHUB_WORKSPACE/" "$TARGET/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'cache/*' \
            --exclude 'compile/*' \
            --exclude '*.license-secret' \
            --exclude '*.update-secret' \
            --exclude '*.log'
          mkdir -p "$TARGET/cache" "$TARGET/compile"

          TEST_UPDATE_PUBLIC_KEY="$PUBLIC_KEY" php -r '
            $path=$argv[1];
            $keys=require $path;
            $keys["ci-admin-update-e2e"]=getenv("TEST_UPDATE_PUBLIC_KEY");
            $bytes="<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export($keys,true).";\n";
            if (file_put_contents($path,$bytes,LOCK_EX)===false) exit(1);
          ' "$TARGET/config/update_trusted_keys.php"
          php -l "$TARGET/config/update_trusted_keys.php"

          test "$(php -r "require '$TARGET/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.3'
          test "$(php -r "require '$TARGET/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10003'
          grep -Fq "public const RELEASE_DATE = '2026-09-24';" "$TARGET/core/Version.php"
          test ! -e "$TARGET/.env"
          test ! -e "$TARGET/tools/vendor-update"

          cd "$DRILL"
          zip -qr "$DRILL/workspace-organizer-v1.0.3.zip" "$(basename "$TARGET")"
          cd "$GITHUB_WORKSPACE"

          php "$LIVE/tools/vendor-update/build-manifest.php" \
            --package="$DRILL/workspace-organizer-v1.0.3.zip" \
            --version=1.0.3 \
            --version-code=10003 \
            --channel=stable \
            --source-commit="$GITHUB_SHA" \
            --min-source-version-code=10002 \
            --requires-php=8.1.0 \
            --notes='CI: реальная установка из Admin UI' \
            --out="$DRILL/release-10003.json"

          php "$LIVE/tools/vendor-update/sign-manifest.php" \
            --private-key="$PRIVATE_KEY" \
            --key-id="$KEY_ID" \
            --manifest="$DRILL/release-10003.json" \
            --signature-out="$DRILL/release-10003.sig"

          cp "$DRILL/release-10003.json" "$FEED_ROOT/stable/release-10003.json"
          cp "$DRILL/release-10003.sig" "$FEED_ROOT/stable/release-10003.sig"
          cp "$DRILL/workspace-organizer-v1.0.3.zip" "$FEED_ROOT/stable/workspace-organizer-v1.0.3.zip"
          cat > "$FEED_ROOT/stable/feed.json" <<'JSON'
          {"schema":1,"product":"workspace-organizer","channel":"stable","manifest":"release-10003.json","signature":"release-10003.sig"}
          JSON

          printf '%s\n' "$PUBLIC_KEY" > "$DRILL/update-public-key.txt"
          chmod 600 "$DRILL/update-public-key.txt"

      - name: Поднять проверяемый HTTPS-канал обновлений
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$DRILL/ca.key" -out "$DRILL/ca.crt" -days 1 \
            -subj '/CN=Notes Admin Update E2E CA' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$DRILL/server.key" -out "$DRILL/server.csr" \
            -subj '/CN=updates.e2e.test' >/dev/null 2>&1
          cat > "$DRILL/server.ext" <<'EOF'
          subjectAltName=DNS:updates.e2e.test
          extendedKeyUsage=serverAuth
          EOF
          openssl x509 -req -in "$DRILL/server.csr" \
            -CA "$DRILL/ca.crt" -CAkey "$DRILL/ca.key" -CAcreateserial \
            -out "$DRILL/server.crt" -days 1 -sha256 -extfile "$DRILL/server.ext" >/dev/null 2>&1

          sudo ip addr add 8.8.8.8/32 dev lo
          sudo cp /etc/resolv.conf "$DRILL/resolv.conf.bak"
          sudo sh -c "python3 '$GITHUB_WORKSPACE/tests/support/admin_update_https_fixture.py' \
            --root '$DRILL/feed-root' \
            --cert '$DRILL/server.crt' \
            --key '$DRILL/server.key' \
            --host updates.e2e.test \
            --ip 8.8.8.8 >'$DRILL/fixture.log' 2>&1 & echo \$! >'$DRILL/fixture.pid'"
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1\n' | sudo tee /etc/resolv.conf >/dev/null

          READY=0
          for i in {1..40}; do
            if SSL_CERT_FILE="$DRILL/ca.crt" curl --noproxy '*' --cacert "$DRILL/ca.crt" -fsS \
              https://updates.e2e.test/stable/feed.json >"$DRILL/feed-probe.json" 2>/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [[ "$READY" != '1' ]]; then
            cat "$DRILL/fixture.log" >&2
            exit 1
          fi

          grep -Fq '"version_code"' "$DRILL/release-10003.json"
          SSL_CERT_FILE="$DRILL/ca.crt" UPDATE_FEED_URL='https://updates.e2e.test/stable/feed.json' \
            php -r '
              require "/tmp/workspace-admin-update-e2e/live/core/UpdateRemoteTransport.php";
              $t=new Core\UpdateHttpsTransport(3,5);
              $v=$t->fetchText(getenv("UPDATE_FEED_URL"),32768);
              if (!str_contains($v,"release-10003.json")) exit(1);
            '

      - name: Выполнить одноразовый штатный переход 1.0.2 → 1.0.3 через CLI
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"

          (
            cd "$LIVE"
            SSL_CERT_FILE="$DRILL/ca.crt" \
              php -d "openssl.cafile=$DRILL/ca.crt" \
              "$GITHUB_WORKSPACE/tools/release/bootstrap-1.0.2-updater.php" \
              --yes \
              --root="$LIVE"
          ) | tee "$DRILL/bootstrap-1.0.2-to-1.0.3.json"

          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.3'
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10003'
          grep -Fq '"status": "ok"' "$DRILL/bootstrap-1.0.2-to-1.0.3.json"
          test ! -e "$DRILL/private/state/workspace-maintenance.json"

      - name: Подготовить следующее подписанное обновление для проверки Admin UI
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          FEED_ROOT="$DRILL/feed-root"
          FUTURE="$DRILL/workspace-organizer-v1.0.4-admin-e2e"
          KEY_ID=ci-admin-update-e2e
          PRIVATE_KEY="$DRILL/$KEY_ID.update-secret"
          PUBLIC_KEY="$(cat "$DRILL/update-public-key.txt")"

          test -s "$PRIVATE_KEY"
          test -n "$PUBLIC_KEY"
          rm -rf "$FUTURE"
          mkdir -p "$FUTURE"
          rsync -a "$GITHUB_WORKSPACE/" "$FUTURE/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'cache/*' \
            --exclude 'compile/*' \
            --exclude '*.license-secret' \
            --exclude '*.update-secret' \
            --exclude '*.log'
          mkdir -p "$FUTURE/cache" "$FUTURE/compile"

          perl -0pi -e "s/public const VERSION = '[^']+';/public const VERSION = '1.0.4-admin-e2e';/" "$FUTURE/core/Version.php"
          perl -0pi -e "s/public const VERSION_CODE = [0-9]+;/public const VERSION_CODE = 10004;/" "$FUTURE/core/Version.php"

          TEST_UPDATE_PUBLIC_KEY="$PUBLIC_KEY" php -r '
            $path=$argv[1];
            $keys=require $path;
            $keys["ci-admin-update-e2e"]=getenv("TEST_UPDATE_PUBLIC_KEY");
            $bytes="<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export($keys,true).";\n";
            if (file_put_contents($path,$bytes,LOCK_EX)===false) exit(1);
          ' "$FUTURE/config/update_trusted_keys.php"

          test "$(php -r "require '$FUTURE/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.4-admin-e2e'
          test "$(php -r "require '$FUTURE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10004'

          cd "$DRILL"
          zip -qr "$DRILL/workspace-organizer-v1.0.4-admin-e2e.zip" "$(basename "$FUTURE")"
          cd "$GITHUB_WORKSPACE"

          php tools/vendor-update/build-manifest.php \
            --package="$DRILL/workspace-organizer-v1.0.4-admin-e2e.zip" \
            --version=1.0.4-admin-e2e \
            --version-code=10004 \
            --channel=stable \
            --source-commit="$GITHUB_SHA" \
            --min-source-version-code=10003 \
            --requires-php=8.1.0 \
            --notes='CI: установка следующего подписанного обновления из Admin UI' \
            --out="$DRILL/release-10004.json"

          php tools/vendor-update/sign-manifest.php \
            --private-key="$PRIVATE_KEY" \
            --key-id="$KEY_ID" \
            --manifest="$DRILL/release-10004.json" \
            --signature-out="$DRILL/release-10004.sig"

          cp "$DRILL/release-10004.json" "$FEED_ROOT/stable/release-10004.json"
          cp "$DRILL/release-10004.sig" "$FEED_ROOT/stable/release-10004.sig"
          cp "$DRILL/workspace-organizer-v1.0.4-admin-e2e.zip" "$FEED_ROOT/stable/workspace-organizer-v1.0.4-admin-e2e.zip"
          cat > "$FEED_ROOT/stable/feed.json" <<'JSON'
          {"schema":1,"product":"workspace-organizer","channel":"stable","manifest":"release-10004.json","signature":"release-10004.sig"}
          JSON

          rm -f "$PRIVATE_KEY" "$DRILL/update-public-key.txt"
          test ! -e "$PRIVATE_KEY"

      - name: Запустить живую установку
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          : > "$DRILL/app-http.log"
          : > /tmp/workspace-organizer-startup.log

          (
            cd "$LIVE"
            SSL_CERT_FILE="$DRILL/ca.crt" PHP_CLI_SERVER_WORKERS=4 \
              php -d "openssl.cafile=$DRILL/ca.crt" -S 127.0.0.1:18094 tests/e2e/router.php \
              >"$DRILL/app-http.log" 2>&1 &
            echo $! >"$DRILL/app-http.pid"
          )

          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18094/workspace/auth/login/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [[ "$READY" != '1' ]]; then
            echo '--- HTTP-ответ readiness ---' >&2
            curl -sS -D "$DRILL/readiness.headers" \
              http://127.0.0.1:18094/workspace/auth/login/ \
              -o "$DRILL/readiness.body" || true
            cat "$DRILL/readiness.headers" >&2 || true
            cat "$DRILL/readiness.body" >&2 || true
            echo '--- PHP server ---' >&2
            cat "$DRILL/app-http.log" >&2
            exit 1
          fi

      - name: Установить обновление кнопкой в Admin UI
        shell: bash
        env:
          SSL_CERT_FILE: /tmp/workspace-admin-update-e2e/ca.crt
        run: node tests/e2e/admin-update-apply.mjs

      - name: Доказать фактическое изменение версии и сохранность установки
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          PRIVATE="$DRILL/private"

          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.4-admin-e2e'
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10004'

          mapfile -t JOURNALS < <(find "$PRIVATE/state/transactions" -maxdepth 1 -type f -name 'update-*.json' -print)
          test "${#JOURNALS[@]}" -eq 2
          for journal in "${JOURNALS[@]}"; do
            test "$(jq -r '.state' "$journal")" = 'committed'
            test "$(jq -r '.live_mutation_started' "$journal")" = 'true'
          done
          test ! -e "$PRIVATE/state/workspace-maintenance.json"

          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT COUNT(*) FROM users WHERE username='admin-update-e2e'")" = '1'
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT COUNT(*) FROM user_roles ur JOIN roles r ON r.id=ur.role_id JOIN users u ON u.id=ur.user_id WHERE u.username='admin-update-e2e' AND r.code='superadmin'")" = '1'
          test -n "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT setting_value FROM system_settings WHERE setting_key='installation_id'")"

          (cd "$LIVE" && SSL_CERT_FILE="$DRILL/ca.crt" php bin/healthcheck.php --json) | tee "$DRILL/post-update-health.json"
          grep -Fq '"status": "ok"' "$DRILL/post-update-health.json"

      - name: Проверить отсутствие PHP-ошибок
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          if grep -E 'PHP (Warning|Fatal error|Parse error)|Uncaught ' \
            "$DRILL/app-http.log" /tmp/workspace-organizer-startup.log 2>/dev/null; then
            echo 'Обнаружена PHP-ошибка во время сквозного обновления из админ-панели' >&2
            exit 1
          fi

      - name: Диагностика при ошибке
        if: failure()
        shell: bash
        run: |
          DRILL=/tmp/workspace-admin-update-e2e
          echo '--- приложение ---'
          cat "$DRILL/app-http.log" 2>/dev/null || true
          echo '--- HTTPS fixture ---'
          cat "$DRILL/fixture.log" 2>/dev/null || true
          echo '--- startup ---'
          cat /tmp/workspace-organizer-startup.log 2>/dev/null || true
          echo '--- журналы updater ---'
          find "$DRILL/private" -maxdepth 4 -type f -name '*.json' -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true

      - name: Остановить тестовые процессы и восстановить DNS
        if: always()
        shell: bash
        run: |
          DRILL=/tmp/workspace-admin-update-e2e
          if [[ -f "$DRILL/app-http.pid" ]]; then
            PID="$(cat "$DRILL/app-http.pid")"
            pkill -TERM -P "$PID" >/dev/null 2>&1 || true
            kill "$PID" >/dev/null 2>&1 || true
          fi
          if [[ -f "$DRILL/fixture.pid" ]]; then
            sudo kill "$(cat "$DRILL/fixture.pid")" >/dev/null 2>&1 || true
          fi
          if [[ -f "$DRILL/resolv.conf.bak" ]]; then
            sudo cp "$DRILL/resolv.conf.bak" /etc/resolv.conf || true
          fi
          sudo ip addr del 8.8.8.8/32 dev lo >/dev/null 2>&1 || true
