name: 1.0.6 → 1.0.7 сквозной updater

on:
  pull_request:
    branches: [dev, '1.0', master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-update-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admin_update_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, openssl, fileinfo, gd, zlib
          coverage: none

      - name: Установить PHP-зависимости
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Установить Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Проверить синтаксис E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/support/admin_update_https_fixture.py
          node --check tests/e2e/admin-update-rollback.mjs
          node --check tests/e2e/admin-update-apply.mjs
          php -l modules/admin/services/AdminUpdateService.php
          php -l bin/update_run.php

      - name: Подготовить тестовую базу 1.0.6 и суперадминистратора
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: admin_update_e2e
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          SOURCE="$DRILL/source-v1.0.6"
          rm -rf "$DRILL"
          mkdir -p "$SOURCE"

          rsync -a "$GITHUB_WORKSPACE/" "$SOURCE/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'cache/*' \
            --exclude 'compile/*'

          perl -0pi -e "s/public const VERSION = '[^']+';/public const VERSION = '1.0.6';/" "$SOURCE/core/Version.php"
          perl -0pi -e "s/public const VERSION_CODE = [0-9]+;/public const VERSION_CODE = 10006;/" "$SOURCE/core/Version.php"
          test "$(php -r "require '$SOURCE/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.6'
          test "$(php -r "require '$SOURCE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10006'

          mapfile -t SCHEMAS < <(
            cd "$SOURCE"
            php -r '
              require "core/ModuleManifest.php";
              require "core/DatabaseOwnership.php";
              foreach (Core\DatabaseOwnership::fromPackageRoot(getcwd())->schemaFiles() as $path) {
                  echo getcwd(), DIRECTORY_SEPARATOR, $path, PHP_EOL;
              }
            '
          )
          test "${#SCHEMAS[@]}" -gt 0
          for schema in "${SCHEMAS[@]}"; do
            echo "Импорт схемы тестовой 1.0.6: $schema"
            mysql -h 127.0.0.1 -uroot -proot admin_update_e2e < "$schema"
          done

          DBHOST=127.0.0.1 DBPORT=3306 DBUSER=root DBPASS=root DBNAME=admin_update_e2e EXPECT_READY=1 \
            php "$SOURCE/tests/integration/schema_readiness_runtime.php"

          TEST_PASSWORD="$(php -r 'echo bin2hex(random_bytes(18));')"
          echo "::add-mask::$TEST_PASSWORD"
          export TEST_PASSWORD

          php <<'PHP'
          <?php
          declare(strict_types=1);

          $pdo = new PDO(
              'mysql:host=127.0.0.1;port=3306;dbname=admin_update_e2e;charset=utf8mb4',
              'root',
              'root',
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $hash = password_hash((string) getenv('TEST_PASSWORD'), PASSWORD_ARGON2ID);
          $stmt = $pdo->prepare(
              'INSERT INTO users (uid,username,email,password_hash,firstname,lastname,role,is_active,created_at,updated_at) '
              . 'VALUES (:uid,:username,:email,:password_hash,:firstname,:lastname,1,1,NOW(),NOW())'
          );
          $stmt->execute([
              ':uid' => 'ba5e0000-0000-4000-8000-000000000103',
              ':username' => 'admin-update-e2e',
              ':email' => 'admin-update-e2e@example.test',
              ':password_hash' => $hash,
              ':firstname' => 'Admin',
              ':lastname' => 'Update E2E',
          ]);
          PHP

          printf 'E2E_USER=%s\n' 'admin-update-e2e' >> "$GITHUB_ENV"
          printf 'E2E_PASSWORD=%s\n' "$TEST_PASSWORD" >> "$GITHUB_ENV"
          printf 'E2E_ORIGIN=%s\n' 'http://127.0.0.1:18094' >> "$GITHUB_ENV"
          printf 'E2E_BASE_PATH=%s\n' '/workspace' >> "$GITHUB_ENV"
          printf 'E2E_SOURCE_VERSION=%s\n' '1.0.6' >> "$GITHUB_ENV"
          printf 'E2E_SOURCE_VERSION_CODE=%s\n' '10006' >> "$GITHUB_ENV"
          printf 'E2E_TARGET_VERSION=%s\n' '1.0.7-admin-e2e' >> "$GITHUB_ENV"
          printf 'E2E_TARGET_VERSION_CODE=%s\n' '10007' >> "$GITHUB_ENV"
          printf 'E2E_BROKEN_TARGET_VERSION=%s\n' '1.0.7-broken-e2e' >> "$GITHUB_ENV"
          printf 'E2E_HEALTH_BROKEN_TARGET_VERSION=%s\n' '1.0.7-health-broken-e2e' >> "$GITHUB_ENV"

      - name: Подготовить отдельную живую установку 1.0.6
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          SOURCE="$DRILL/source-v1.0.6"
          PRIVATE="$DRILL/private"
          rm -rf "$LIVE" "$PRIVATE"
          mkdir -p \
            "$LIVE" \
            "$PRIVATE/logs" \
            "$PRIVATE/file_manager" \
            "$PRIVATE/messenger" \
            "$PRIVATE/notes" \
            "$PRIVATE/users" \
            "$PRIVATE/rate-limit" \
            "$PRIVATE/legacy" \
            "$PRIVATE/staging" \
            "$PRIVATE/state" \
            "$PRIVATE/backups" \
            "$PRIVATE/releases"
          chmod 700 \
            "$PRIVATE" \
            "$PRIVATE/logs" \
            "$PRIVATE/file_manager" \
            "$PRIVATE/messenger" \
            "$PRIVATE/notes" \
            "$PRIVATE/users" \
            "$PRIVATE/rate-limit" \
            "$PRIVATE/legacy" \
            "$PRIVATE/staging" \
            "$PRIVATE/state" \
            "$PRIVATE/backups" \
            "$PRIVATE/releases"

          rsync -a "$SOURCE/" "$LIVE/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'cache/*' \
            --exclude 'compile/*'

          APP_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          MESSAGE_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          TICKET_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          PHP_CLI="$(command -v php)"
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$MESSAGE_KEY"
          echo "::add-mask::$TICKET_KEY"

          cat > "$LIVE/.env" <<ENV
          DBDRIVER=mysql
          DBHOST=127.0.0.1
          DBPORT=3306
          DBUSER=root
          DBPASS=root
          DBNAME=admin_update_e2e
          UNIQUE_KEY=${APP_KEY}
          MSG_SECRET_KEY=${MESSAGE_KEY}
          WS_TICKET_SECRET=${TICKET_KEY}
          PRIVATE_STORAGE_PATH=${PRIVATE}
          RATE_LIMIT_STORAGE_PATH=${PRIVATE}/rate-limit
          SITEURL=http://127.0.0.1:18094
          BASE_PATH=/workspace/
          WS_HOST=127.0.0.1
          WS_PORT=27807
          WS_PUBLIC_URL=ws://127.0.0.1:27807/workspace/ws
          WS_ALLOWED_ORIGINS=http://127.0.0.1:18094
          AUTH_RATE_LIMIT_ATTEMPTS=50
          AUTH_RATE_LIMIT_WINDOW_SECONDS=60
          UPLOAD_RATE_LIMIT_ATTEMPTS=100
          UPLOAD_RATE_LIMIT_WINDOW_SECONDS=60
          LOG_LEVEL=INFO
          LOG_FILE=${PRIVATE}/logs/app.log
          CSRF_ENABLED=true
          UPDATE_FEED_URL=https://updates.e2e.test/stable/feed.json
          UPDATE_CHANNEL=stable
          UPDATE_ACCESS_MODE=offline
          UPDATE_STAGING_PATH=${PRIVATE}/staging
          UPDATE_STATE_PATH=${PRIVATE}/state
          UPDATE_BACKUP_PATH=${PRIVATE}/backups
          UPDATE_RELEASE_PATH=${PRIVATE}/releases
          UPDATE_PHP_BINARY=${PHP_CLI}
          ENV
          chmod 600 "$LIVE/.env"

          mkdir -p "$LIVE/cache" "$LIVE/compile"
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.6'
          test "$(php -r "require '$LIVE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10006'

      - name: Активировать временную CI-лицензию
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/tmp/workspace-admin-update-e2e/live
          (cd "$LIVE" && php tests/support/ci_license_fixture.php)
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT COUNT(*) FROM user_roles ur JOIN roles r ON r.id=ur.role_id JOIN users u ON u.id=ur.user_id WHERE u.username='admin-update-e2e' AND r.code='superadmin'")" = '1'
          test -n "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_update_e2e -e "SELECT setting_value FROM system_settings WHERE setting_key='workspace_license_token'")"

      - name: Подготовить ключ подписи тестовых обновлений
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          KEY_ID=ci-admin-update-e2e
          PRIVATE_KEY="$DRILL/$KEY_ID.update-secret"

          php "$LIVE/tools/vendor-update/keygen.php" \
            --key-id="$KEY_ID" \
            --private-out="$PRIVATE_KEY" | tee "$DRILL/keygen.txt"
          PUBLIC_KEY="$(sed -n 's/^Public key: //p' "$DRILL/keygen.txt" | head -n1)"
          test -n "$PUBLIC_KEY"
          test -s "$PRIVATE_KEY"

          TEST_UPDATE_PUBLIC_KEY="$PUBLIC_KEY" php -r '
            $path=$argv[1];
            $keys=require $path;
            $keys["ci-admin-update-e2e"]=getenv("TEST_UPDATE_PUBLIC_KEY");
            $bytes="<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export($keys,true).";\n";
            if (file_put_contents($path,$bytes,LOCK_EX)===false) exit(1);
          ' "$LIVE/config/update_trusted_keys.php"
          php -l "$LIVE/config/update_trusted_keys.php"

          printf '%s\n' "$PUBLIC_KEY" > "$DRILL/update-public-key.txt"
          chmod 600 "$DRILL/update-public-key.txt"

      - name: Подготовить подписанный 1.0.7 для проверки автоматического уведомления
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          FEED_ROOT="$DRILL/feed-root"
          FUTURE="$DRILL/workspace-organizer-v1.0.7-admin-e2e"
          KEY_ID=ci-admin-update-e2e
          PRIVATE_KEY="$DRILL/$KEY_ID.update-secret"
          PUBLIC_KEY="$(cat "$DRILL/update-public-key.txt")"

          test -s "$PRIVATE_KEY"
          test -n "$PUBLIC_KEY"
          rm -rf "$FUTURE"
          mkdir -p "$FUTURE"
          rsync -a "$GITHUB_WORKSPACE/" "$FUTURE/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'cache/*' \
            --exclude 'compile/*' \
            --exclude '*.license-secret' \
            --exclude '*.update-secret' \
            --exclude '*.log'
          mkdir -p "$FUTURE/cache" "$FUTURE/compile"

          # Сохраняем тот же тестовый публичный корень и в следующем пакете,
          # чтобы результат обновления из Admin UI проверялся с валидной лицензией.
          cp "$LIVE/config/license_trusted_keys.php" "$FUTURE/config/license_trusted_keys.php"
          php -l "$FUTURE/config/license_trusted_keys.php"

          perl -0pi -e "s/public const VERSION = '[^']+';/public const VERSION = '1.0.7-admin-e2e';/" "$FUTURE/core/Version.php"
          perl -0pi -e "s/public const VERSION_CODE = [0-9]+;/public const VERSION_CODE = 10007;/" "$FUTURE/core/Version.php"

          TEST_UPDATE_PUBLIC_KEY="$PUBLIC_KEY" php -r '
            $path=$argv[1];
            $keys=require $path;
            $keys["ci-admin-update-e2e"]=getenv("TEST_UPDATE_PUBLIC_KEY");
            $bytes="<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export($keys,true).";\n";
            if (file_put_contents($path,$bytes,LOCK_EX)===false) exit(1);
          ' "$FUTURE/config/update_trusted_keys.php"

          test "$(php -r "require '$FUTURE/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.7-admin-e2e'
          test "$(php -r "require '$FUTURE/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10007'

          BROKEN="$DRILL/workspace-organizer-v1.0.7-broken-e2e"
          rm -rf "$BROKEN"
          rsync -a "$FUTURE/" "$BROKEN/"
          perl -0pi -e "s/public const VERSION = '[^']+';/public const VERSION = '1.0.7-broken-e2e';/" "$BROKEN/core/Version.php"
          cat > "$BROKEN/bin/migrate.php" <<'PHP'
          <?php
          declare(strict_types=1);

          fwrite(STDERR, "CI: намеренный отказ миграции для проверки автоматического отката\n");
          exit(91);
          PHP
          php -l "$BROKEN/bin/migrate.php"
          test "$(php -r "require '$BROKEN/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.7-broken-e2e'
          test "$(php -r "require '$BROKEN/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10007'

          HEALTH_BROKEN="$DRILL/workspace-organizer-v1.0.7-health-broken-e2e"
          rm -rf "$HEALTH_BROKEN"
          rsync -a "$FUTURE/" "$HEALTH_BROKEN/"
          perl -0pi -e "s/public const VERSION = '[^']+';/public const VERSION = '1.0.7-health-broken-e2e';/" "$HEALTH_BROKEN/core/Version.php"
          cat > "$HEALTH_BROKEN/bin/healthcheck.php" <<'PHP'
          <?php
          declare(strict_types=1);

          if (in_array('--json', $argv, true)) {
              echo json_encode([
                  'status' => 'fail',
                  'message' => 'CI: намеренный отказ post-health для проверки автоматического отката',
              ], JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES), PHP_EOL;
          } else {
              fwrite(STDERR, "CI: намеренный отказ post-health для проверки автоматического отката\n");
          }
          exit(92);
          PHP
          php -l "$HEALTH_BROKEN/bin/healthcheck.php"
          test "$(php -r "require '$HEALTH_BROKEN/core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.7-health-broken-e2e'
          test "$(php -r "require '$HEALTH_BROKEN/core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10007'

          cd "$DRILL"
          zip -qr "$DRILL/workspace-organizer-v1.0.7-broken-e2e.zip" "$(basename "$BROKEN")"
          zip -qr "$DRILL/workspace-organizer-v1.0.7-health-broken-e2e.zip" "$(basename "$HEALTH_BROKEN")"
          cd "$GITHUB_WORKSPACE"

          php tools/vendor-update/build-manifest.php \
            --package="$DRILL/workspace-organizer-v1.0.7-broken-e2e.zip" \
            --version=1.0.7-broken-e2e \
            --version-code=10007 \
            --channel=stable \
            --source-commit="$GITHUB_SHA" \
            --min-source-version-code=10006 \
            --requires-php=8.1.0 \
            --notes='CI: намеренный отказ миграции для проверки автоматического отката' \
            --out="$DRILL/release-10007-broken.json"

          php tools/vendor-update/sign-manifest.php \
            --private-key="$PRIVATE_KEY" \
            --key-id="$KEY_ID" \
            --manifest="$DRILL/release-10007-broken.json" \
            --signature-out="$DRILL/release-10007-broken.sig"

          php tools/vendor-update/build-manifest.php \
            --package="$DRILL/workspace-organizer-v1.0.7-health-broken-e2e.zip" \
            --version=1.0.7-health-broken-e2e \
            --version-code=10007 \
            --channel=stable \
            --source-commit="$GITHUB_SHA" \
            --min-source-version-code=10006 \
            --requires-php=8.1.0 \
            --notes='CI: намеренный отказ post-health после успешных миграций' \
            --out="$DRILL/release-10007-health-broken.json"

          php tools/vendor-update/sign-manifest.php \
            --private-key="$PRIVATE_KEY" \
            --key-id="$KEY_ID" \
            --manifest="$DRILL/release-10007-health-broken.json" \
            --signature-out="$DRILL/release-10007-health-broken.sig"

          cd "$DRILL"
          zip -qr "$DRILL/workspace-organizer-v1.0.7-admin-e2e.zip" "$(basename "$FUTURE")"
          cd "$GITHUB_WORKSPACE"

          php tools/vendor-update/build-manifest.php \
            --package="$DRILL/workspace-organizer-v1.0.7-admin-e2e.zip" \
            --version=1.0.7-admin-e2e \
            --version-code=10007 \
            --channel=stable \
            --source-commit="$GITHUB_SHA" \
            --min-source-version-code=10006 \
            --requires-php=8.1.0 \
            --notes='CI: одношаговая установка из автоматического уведомления' \
            --out="$DRILL/release-10007.json"

          php tools/vendor-update/sign-manifest.php \
            --private-key="$PRIVATE_KEY" \
            --key-id="$KEY_ID" \
            --manifest="$DRILL/release-10007.json" \
            --signature-out="$DRILL/release-10007.sig"

          cp "$DRILL/release-10007.json" "$FEED_ROOT/stable/release-10007.json"
          cp "$DRILL/release-10007.sig" "$FEED_ROOT/stable/release-10007.sig"
          cp "$DRILL/workspace-organizer-v1.0.7-admin-e2e.zip" "$FEED_ROOT/stable/workspace-organizer-v1.0.7-admin-e2e.zip"
          cp "$DRILL/release-10007-broken.json" "$FEED_ROOT/stable/release-10007-broken.json"
          cp "$DRILL/release-10007-broken.sig" "$FEED_ROOT/stable/release-10007-broken.sig"
          cp "$DRILL/workspace-organizer-v1.0.7-broken-e2e.zip" "$FEED_ROOT/stable/workspace-organizer-v1.0.7-broken-e2e.zip"
          cp "$DRILL/release-10007-health-broken.json" "$FEED_ROOT/stable/release-10007-health-broken.json"
          cp "$DRILL/release-10007-health-broken.sig" "$FEED_ROOT/stable/release-10007-health-broken.sig"
          cp "$DRILL/workspace-organizer-v1.0.7-health-broken-e2e.zip" "$FEED_ROOT/stable/workspace-organizer-v1.0.7-health-broken-e2e.zip"
          cat > "$FEED_ROOT/stable/feed.json" <<'JSON'
          {"schema":1,"product":"workspace-organizer","channel":"stable","manifest":"release-10007-broken.json","signature":"release-10007-broken.sig"}
          JSON

          rm -f "$PRIVATE_KEY" "$DRILL/update-public-key.txt"
          test ! -e "$PRIVATE_KEY"

      - name: Поднять проверяемый HTTPS-канал обновлений
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$DRILL/ca.key" -out "$DRILL/ca.crt" -days 1 \
            -subj '/CN=Notes Admin Update E2E CA' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$DRILL/server.key" -out "$DRILL/server.csr" \
            -subj '/CN=updates.e2e.test' >/dev/null 2>&1
          cat > "$DRILL/server.ext" <<'EOF'
          subjectAltName=DNS:updates.e2e.test
          extendedKeyUsage=serverAuth
          EOF
          openssl x509 -req -in "$DRILL/server.csr" \
            -CA "$DRILL/ca.crt" -CAkey "$DRILL/ca.key" -CAcreateserial \
            -out "$DRILL/server.crt" -days 1 -sha256 -extfile "$DRILL/server.ext" >/dev/null 2>&1

          sudo ip addr add 8.8.8.8/32 dev lo
          sudo cp /etc/resolv.conf "$DRILL/resolv.conf.bak"
          sudo sh -c "python3 '$GITHUB_WORKSPACE/tests/support/admin_update_https_fixture.py' \
            --root '$DRILL/feed-root' \
            --cert '$DRILL/server.crt' \
            --key '$DRILL/server.key' \
            --host updates.e2e.test \
            --ip 8.8.8.8 >'$DRILL/fixture.log' 2>&1 & echo \$! >'$DRILL/fixture.pid'"
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1\n' | sudo tee /etc/resolv.conf >/dev/null

          READY=0
          for i in {1..40}; do
            if SSL_CERT_FILE="$DRILL/ca.crt" curl --noproxy '*' --cacert "$DRILL/ca.crt" -fsS \
              https://updates.e2e.test/stable/feed.json >"$DRILL/feed-probe.json" 2>/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [[ "$READY" != '1' ]]; then
            cat "$DRILL/fixture.log" >&2
            exit 1
          fi

          grep -Fq '"version_code"' "$DRILL/release-10007-broken.json"
          SSL_CERT_FILE="$DRILL/ca.crt" UPDATE_FEED_URL='https://updates.e2e.test/stable/feed.json' \
            php -r '
              require "/tmp/workspace-admin-update-e2e/live/core/UpdateRemoteTransport.php";
              $t=new Core\UpdateHttpsTransport(3,5);
              $v=$t->fetchText(getenv("UPDATE_FEED_URL"),32768);
              if (!str_contains($v,"release-10007-broken.json")) exit(1);
            '

      - name: Запустить живую установку
        shell: bash
        run: |
          set -euo pipefail
          DRILL=/tmp/workspace-admin-update-e2e
          LIVE="$DRILL/live"
          : > "$DRILL/app-http.log"
          : > /tmp/workspace-organizer-startup.log

          (
            cd "$LIVE"
            SSL_CERT_FILE="$DRILL/ca.crt" \
              E2E_APP_ROOT="$LIVE" \
              E2E_SUPPORT_ROOT="$GITHUB_WORKSPACE" \
              PHP_CLI_SERVER_WORKERS=4 \
              php -d "openssl.cafile=$DRILL/ca.crt" \
              -S 127.0.0.1:18094 "$GITHUB_WORKSPACE/tests/e2e/router.php" \
              >"$DRILL/app-http.log" 2>&1 &
            echo $! >"$DRILL/app-http.pid"
          )

          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18094/workspace/auth/login/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [[ "$READY" != '1' ]]; then
            echo '--- HTTP-ответ readiness ---' >&2
            curl -sS -D "$DRILL/readiness.headers" \
              http://127.0.0.1:18094/workspace/auth/login/ \
              -o "$DRILL/readiness.body" || true
            cat "$DRILL/readiness.headers" >&2 || true
            cat "$DRILL/readiness.body" >&2 || true
            echo '--- PHP server ---' >&2
            cat "$DRILL/app-http.log" >&2
            exit 1
          fi

      - name: Проверить автоматический откат намеренно сломанного 1.0.7
        shell: bash
