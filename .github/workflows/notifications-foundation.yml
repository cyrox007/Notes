name: Уведомления 1.1 — MySQL

on:
  push:
    branches: ['1.1', 'fix/1.1-notification-http-fallback-*', 'codex/1.1-notifications-acceptance']
    paths:
      - 'app/services/notifications/**'
      - 'app/controllers/NotificationController.php'
      - 'app/middlewares/ApiLoginRequired.php'
      - 'app/views/core/base.php'
      - 'assets/css/notification-center.css'
      - 'assets/js/notification-center.js'
      - 'assets/js/update-notifications.js'
      - 'bin/notifications_worker.php'
      - 'bin/calendar_reminders.php'
      - 'core/ApplicationEntryPoint.php'
      - 'core/DatabaseOwnership.php'
      - 'core/routerConfig.php'
      - 'modules/calendar/CalendarCapability.php'
      - 'modules/calendar/CalendarRuntimeProvider.php'
      - 'modules/calendar/module.json'
      - 'modules/calendar/services/CalendarReminder*.php'
      - 'database/core_identity_schema.sql'
      - 'database/migrations/manifest.json'
      - 'database/migrations/*notifications*.sql'
      - 'database/migrations/*calendar*.sql'
      - 'tests/integration/notification_*contract.php'
      - 'tests/integration/calendar_reminders_*contract.php'
      - 'tests/integration/smtp_socket_transport_contract.php'
      - '.github/workflows/notifications-foundation.yml'
  pull_request:
    branches: ['1.1']
    paths:
      - 'app/services/notifications/**'
      - 'app/controllers/NotificationController.php'
      - 'app/middlewares/ApiLoginRequired.php'
      - 'app/views/core/base.php'
      - 'assets/css/notification-center.css'
      - 'assets/js/notification-center.js'
      - 'assets/js/update-notifications.js'
      - 'bin/notifications_worker.php'
      - 'bin/calendar_reminders.php'
      - 'core/ApplicationEntryPoint.php'
      - 'core/DatabaseOwnership.php'
      - 'core/routerConfig.php'
      - 'modules/calendar/CalendarCapability.php'
      - 'modules/calendar/CalendarRuntimeProvider.php'
      - 'modules/calendar/module.json'
      - 'modules/calendar/services/CalendarReminder*.php'
      - 'database/core_identity_schema.sql'
      - 'database/migrations/manifest.json'
      - 'database/migrations/*notifications*.sql'
      - 'database/migrations/*calendar*.sql'
      - 'tests/integration/notification_*contract.php'
      - 'tests/integration/calendar_reminders_*contract.php'
      - 'tests/integration/smtp_socket_transport_contract.php'
      - '.github/workflows/notifications-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-mysql:
    name: notification-mysql
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: workspace_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, mbstring, openssl
          coverage: none

      - name: Проверить фундамент и отказоустойчивость доставки
        run: |
          set -euo pipefail
          php tests/integration/notification_foundation_contract.php
          php tests/integration/notification_delivery_contract.php

      - name: Проверить реальную схему и очередь уведомлений
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: workspace_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          set -euo pipefail
          php tests/integration/notification_mysql_contract.php
          php tests/integration/notification_smtp_mysql_contract.php
          php tests/integration/notification_http_fallback_mysql_contract.php

      - name: Проверить API центра уведомлений на MySQL
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: workspace_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          set -euo pipefail
          php tests/integration/notification_center_mysql_contract.php
          php tests/integration/notification_center_delivery_mysql_contract.php

      - name: Проверить пользовательские подписки на MySQL
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: workspace_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          set -euo pipefail
          php tests/integration/notification_preferences_mysql_contract.php

      - name: Проверить напоминания Calendar через общий слой уведомлений
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: workspace_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          set -euo pipefail
          php tests/integration/calendar_reminders_contract.php
          php tests/integration/calendar_reminders_mysql_contract.php

      - name: Проверить SMTP, API, UI, CLI worker и HTTP fallback без внешней сети
        run: |
          set -euo pipefail
          php tests/integration/notification_smtp_contract.php
          php tests/integration/smtp_socket_transport_contract.php
          php tests/integration/notification_worker_cli_contract.php
          php tests/integration/notification_http_fallback_contract.php
          php tests/integration/notification_center_contract.php
          php tests/integration/notification_preferences_contract.php
          php tests/integration/notification_center_ui_contract.php
          php -l app/services/notifications/NotificationDeliveryRuntime.php
          php -l core/ApplicationEntryPoint.php
          php -l core/DatabaseOwnership.php
          php -l bin/notifications_worker.php
          php -l bin/calendar_reminders.php
          node --check assets/js/notification-center.js
          node --check assets/js/update-notifications.js
