name: Уведомления 1.1 — MySQL

on:
  push:
    branches: ['1.1']
    paths:
      - 'app/services/notifications/**'
      - 'database/core_identity_schema.sql'
      - 'database/migrations/20261010_notifications_foundation.sql'
      - 'tests/integration/notification_mysql_contract.php'
      - '.github/workflows/notifications-foundation.yml'
  pull_request:
    branches: ['1.1']
    paths:
      - 'app/services/notifications/**'
      - 'database/core_identity_schema.sql'
      - 'database/migrations/20261010_notifications_foundation.sql'
      - 'tests/integration/notification_mysql_contract.php'
      - '.github/workflows/notifications-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-mysql:
    name: notification-mysql
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: workspace_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none

      - name: Проверить реальную схему и очередь уведомлений
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: workspace_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: php tests/integration/notification_mysql_contract.php
