name: 1.0 native view foundation

on:
  push:
    branches: ['1.0']
    paths:
      - 'core/ViewRenderer.php'
      - 'core/ViewContext.php'
      - 'core/NativeViewRenderer.php'
      - 'core/ModuleRuntimeLoader.php'
      - 'core/ModuleAssetController.php'
      - 'core/controller.php'
      - 'core.php'
      - 'app/views/**'
      - 'modules/notes/**'
      - 'modules/tasks/**'
      - 'assets/js/**'
      - 'tests/integration/native_*_contract.php'
      - '.github/workflows/native-view-foundation.yml'
  pull_request:
    branches: ['1.0']
    paths:
      - 'core/ViewRenderer.php'
      - 'core/ViewContext.php'
      - 'core/NativeViewRenderer.php'
      - 'core/ModuleRuntimeLoader.php'
      - 'core/ModuleAssetController.php'
      - 'core/controller.php'
      - 'core.php'
      - 'app/views/**'
      - 'modules/notes/**'
      - 'modules/tasks/**'
      - 'assets/js/**'
      - 'tests/integration/native_*_contract.php'
      - '.github/workflows/native-view-foundation.yml'

permissions:
  contents: read

jobs:
  native-view:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint native renderer and PHP views
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            core/ViewRenderer.php \
            core/ViewContext.php \
            core/NativeViewRenderer.php \
            core/ModuleRuntimeLoader.php \
            core/ModuleAssetController.php \
            core/controller.php \
            core.php; do
            php -l "$file"
          done
          find app/views modules/notes modules/tasks \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          find tests/integration -maxdepth 1 -type f -name 'native_*_contract.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Verify substantive native renderer contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            native_view_renderer_contract.php \
            native_view_layout_context_contract.php \
            native_workspace_shell_contract.php \
            native_file_manager_contract.php \
            native_profile_contract.php \
            native_admin_contract.php \
            native_notes_contract.php \
            native_tasks_contract.php \
            native_messenger_contract.php; do
            php "tests/integration/${test}"
          done

      - name: Verify native-only and isolated-view boundary
        shell: bash
        run: |
          set -euo pipefail
          ! test -f core/LegacySmartyRenderer.php
          ! test -f core/HybridViewRenderer.php
          ! grep -Fq 'LegacySmartyRenderer' core/controller.php core.php
          ! grep -Fq 'HybridViewRenderer' core/controller.php core.php
          grep -Fq 'new NativeViewRenderer(' core/controller.php
          grep -Fq 'ModuleRuntimeLoader::getInstance()->viewRoots()' core/controller.php

          ! grep -R -Fq -- '->view->render_template(' app/controllers modules/notes/controllers modules/tasks/controllers
          ! grep -R -Fq 'new View(' app/controllers modules/notes/controllers modules/tasks/controllers

          test -f modules/notes/views/index.php
          test -f modules/notes/assets/notes-list.js
          test -f modules/tasks/views/index.php
          test -f modules/tasks/views/boards.php
          test -f modules/tasks/views/elements/task_item/index.php
          test -f modules/tasks/assets/tasks-page.js
          test -f modules/tasks/assets/task-boards.js

          ! test -e app/views/notes_page/index.php
          ! test -e app/views/tasks_page/index.php
          ! test -e app/views/tasks_page/index.tpl
          ! test -e app/views/tasks_page/boards.php
          ! test -e app/views/tasks_page/boards.tpl
          ! test -e 'app/views/^elements/task_item/index.php'
          ! test -e 'app/views/^elements/task_item/index.tpl'
          ! test -e assets/js/tasks-page.js
          ! test -e assets/js/tasks-kanban.js
          ! test -e assets/js/task-boards.js
          ! test -e assets/js/task-boards-nav.js

          ! grep -R -Fq '{literal}' modules/notes/assets modules/tasks/assets
