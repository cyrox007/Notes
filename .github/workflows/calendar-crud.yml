name: Calendar 1.1 — CRUD и интерфейс

on:
  push:
    branches:
      - '1.1'
      - 'feature/1.1-calendar-crud-ui-*'
    paths:
      - 'modules/calendar/**'
      - 'core/Controller.php'
      - 'app/views/^shared/header/index.php'
      - 'app/views/^shared/sidebar/index.php'
      - 'bin/calendar_reminders.php'
      - 'database/calendar_schema.sql'
      - 'database/migrations/20261011_calendar_crud.sql'
      - 'database/migrations/manifest.json'
      - 'tests/integration/calendar_crud_*.php'
      - '.github/workflows/calendar-crud.yml'
  pull_request:
    branches: ['1.1']
    paths:
      - 'modules/calendar/**'
      - 'core/Controller.php'
      - 'app/views/^shared/header/index.php'
      - 'app/views/^shared/sidebar/index.php'
      - 'bin/calendar_reminders.php'
      - 'database/calendar_schema.sql'
      - 'database/migrations/20261011_calendar_crud.sql'
      - 'database/migrations/manifest.json'
      - 'tests/integration/calendar_crud_*.php'
      - '.github/workflows/calendar-crud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-crud:
    name: calendar-crud
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: workspace_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none

      - name: Проверить Calendar CRUD и интерфейс
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/calendar_crud_contract.php
          php -l modules/calendar/services/CalendarRecurrence.php
          php -l modules/calendar/services/CalendarReminderPlanner.php
          php -l modules/calendar/services/CalendarEventService.php
          php -l modules/calendar/controllers/CalendarController.php
          php -l modules/calendar/controllers/CalendarApiController.php
          php -l modules/calendar/CalendarRuntimeProvider.php
          php -l modules/calendar/runtime.php
          node --check modules/calendar/assets/calendar.js

      - name: Проверить Calendar CRUD на MySQL
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: workspace_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
          TEST_DB_ROOT_PASS: root
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/calendar_crud_mysql_contract.php
