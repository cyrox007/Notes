name: Shared task boards contract

on:
  pull_request:
    branches: ['1.0']
    paths:
      - 'modules/tasks/**'
      - 'modules/notes/**'
      - 'modules/messenger/**'
      - 'app/services/PermissionService.php'
      - 'app/services/RolePolicyService.php'
      - 'database/task_boards_schema.sql'
      - 'database/access_control_schema.sql'
      - 'database/migrations/20260915_role_module_policies.sql'
      - 'tests/integration/task_board_beta4_mysql.sh'
      - '.github/workflows/shared-task-boards-beta4.yml'
  push:
    branches: ['1.0']
    paths:
      - 'modules/tasks/**'
      - 'modules/notes/**'
      - 'modules/messenger/**'
      - 'tests/integration/task_board_beta4_mysql.sh'

permissions:
  contents: read

jobs:
  shared-task-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: notes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli
          coverage: none

      - name: Lint collaboration boundaries
        shell: bash
        run: |
          set -euo pipefail
          php -l modules/tasks/services/TaskBoardService.php
          php -l modules/tasks/controllers/TaskBoardController.php
          php -l modules/tasks/middlewares/EnforceTaskCreatePolicy.php
          php -l modules/tasks/TasksRuntimeProvider.php
          php -l modules/notes/middlewares/EnforceNoteCreatePolicy.php
          php -l modules/notes/middlewares/EnforceNoteAttachmentPolicy.php
          php -l modules/notes/middlewares/EnforceNoteSharePolicy.php
          php -l modules/messenger/middlewares/EnforceMessengerUploadPolicy.php
          php -l modules/messenger/socket/MessangerSocket.php
          php -l modules/messenger/socket/GroupSocket.php
          php -l core/routerConfig.php

      - name: Run shared board ACL and role-policy contract
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: notes_test
        run: bash tests/integration/task_board_beta4_mysql.sh

      - name: Verify module-owned board wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'TaskBoardController' modules/tasks/TasksRuntimeProvider.php
          grep -Fq "'task_board_create'" modules/tasks/TasksRuntimeProvider.php
          grep -Fq "'task_board_task_update'" modules/tasks/TasksRuntimeProvider.php
          grep -Fq 'CSRFMiddleware::class' modules/tasks/TasksRuntimeProvider.php
          grep -Fq "moduleAsset('tasks', 'task-boards.js')" modules/tasks/views/boards.php
          grep -Fq "moduleAsset('tasks', 'task-boards-nav.js')" modules/tasks/views/index.php
          grep -Fq 'const card = dragged' modules/tasks/assets/task-boards.js
          ! grep -Fq 'TaskBoardController' core/routerConfig.php
          ! test -e app/views/tasks_page/boards.tpl
