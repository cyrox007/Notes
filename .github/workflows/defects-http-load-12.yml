name: Дефекты 1.2 — HTTP-нагрузка через PHP-FPM

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'tests/integration/defects_http_seed_12.php'
      - 'tests/integration/defects_http_load_12.py'
      - 'tests/integration/notes_staged_http_capacity_12.py'
      - 'tests/integration/defects_http_sql_profile_12.py'
      - '.github/workflows/defects-http-load-12.yml'
      - 'modules/defects/**'
      - 'core/ModuleLifecycleStore.php'
      - 'core/SchemaReadiness.php'
      - 'app/services/LicenseService.php'
      - 'database/defects_schema.sql'
      - 'tests/support/ci_license_fixture.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-load:
    name: Ограниченная нагрузка через Nginx и PHP-FPM
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: defects_http_load
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DBHOST: 127.0.0.1
      DBPORT: '3306'
      DBUSER: root
      DBPASS: root
      DBNAME: defects_http_load
      DBPREFIX: ''
      PRIVATE_STORAGE_PATH: /tmp/defects-http-private
      MYSQL_PWD: root
      E2E_ENABLE_DEFECTS: '1'

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить сервер Nginx и PHP-FPM 8.3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php8.3-fpm php8.3-mysql php8.3-mbstring php8.3-xml \
            php8.3-curl php8.3-gd php8.3-intl
          php -v
          php -m | grep -E 'mysqli|PDO|sodium|mbstring'

      - name: Подготовить одноразовую конфигурацию и схему Дефектов
        shell: bash
        run: |
          set -euo pipefail
          DEFECTS_HTTP_PASSWORD="$(openssl rand -hex 24)"
          UNIQUE_KEY="$(openssl rand -hex 32)"
          MSG_SECRET_KEY="$(openssl rand -hex 32)"
          WS_TICKET_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$DEFECTS_HTTP_PASSWORD"
          echo "::add-mask::$UNIQUE_KEY"
          echo "::add-mask::$MSG_SECRET_KEY"
          echo "::add-mask::$WS_TICKET_SECRET"
          echo "DEFECTS_HTTP_PASSWORD=$DEFECTS_HTTP_PASSWORD" >> "$GITHUB_ENV"
          export DEFECTS_HTTP_PASSWORD
          mkdir -p "$PRIVATE_STORAGE_PATH" compile cache
          chmod 700 "$PRIVATE_STORAGE_PATH"
          cat > .env <<ENV
          DBDRIVER=mysql
          DBHOST=127.0.0.1
          DBPORT=3306
          DBUSER=root
          DBPASS=root
          DBNAME=defects_http_load
          DBPREFIX=
          UNIQUE_KEY=$UNIQUE_KEY
          MSG_SECRET_KEY=$MSG_SECRET_KEY
          WS_TICKET_SECRET=$WS_TICKET_SECRET
          SITEURL=http://127.0.0.1:18097
          BASE_PATH=/
          PRIVATE_STORAGE_PATH=$PRIVATE_STORAGE_PATH
          RATE_LIMIT_STORAGE_PATH=$PRIVATE_STORAGE_PATH/rate-limit
          # Лимит входа включён; восемь отдельных HTTP-сеансов входят через один loopback.
          MAX_LOGIN_ATTEMPTS=25
          AUTH_RATE_LIMIT_WINDOW_SECONDS=60
          UPLOAD_RATE_LIMIT_ATTEMPTS=500
          UPLOAD_RATE_LIMIT_WINDOW_SECONDS=60
          MAX_UPLOAD_SIZE=10485760
          CSRF_ENABLED=true
          ENV
          chmod 600 .env
          php -l tests/integration/defects_http_seed_12.php
          python3 -m py_compile tests/integration/defects_http_load_12.py \
            tests/integration/defects_http_sql_profile_12.py \
            tests/integration/notes_staged_http_capacity_12.py
          php tests/integration/defects_http_seed_12.php > /tmp/defects-http-fixture.json
          mysql -h 127.0.0.1 -uroot defects_http_load < database/migrations/20261019_defects_foundation.sql
          php tests/support/ci_license_fixture.php
          # В тестовом runner сервер работает только на loopback от владельца рабочей копии.
          chmod 600 .env
          chmod 700 "$PRIVATE_STORAGE_PATH"

      - name: Запустить локальные Nginx и PHP-FPM
        shell: bash
        run: |
          set -euo pipefail
          # Только CI: исполнять оба процесса от владельца временной рабочей копии.
          RUNNER_USER="$(id -un)"
          RUNNER_GROUP="$(id -gn)"
          sudo sed -i "s/^user www-data;/user $RUNNER_USER;/" /etc/nginx/nginx.conf
          sudo sed -i "s/^user = www-data/user = $RUNNER_USER/;s/^group = www-data/group = $RUNNER_GROUP/;s/^listen.owner = www-data/listen.owner = $RUNNER_USER/;s/^listen.group = www-data/listen.group = $RUNNER_GROUP/" /etc/php/8.3/fpm/pool.d/www.conf
          sudo sed -i 's/^pm.max_children = .*/pm.max_children = 12/' /etc/php/8.3/fpm/pool.d/www.conf
          echo 'pm.status_path = /__fpm_status' | sudo tee -a /etc/php/8.3/fpm/pool.d/www.conf
          sudo service php8.3-fpm restart
          cat > /tmp/defects-http-nginx.conf <<'NGINX'
          server {
              listen 127.0.0.1:18097;
              server_name localhost;
              root __REPOSITORY_ROOT__;
              index index.php;
              client_max_body_size 2m;
              access_log /tmp/defects-http-nginx-access.log;
              error_log /tmp/defects-http-nginx-error.log warn;

              location ~ ^/(app|bin|config|core|database|docs|modules|tests|tools|ws_server)(/|$) {
                  return 404;
              }
              location ~ /\. { return 404; }
              location = /default.env { return 404; }
              location = /__fpm_status {
                  allow 127.0.0.1;
                  deny all;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root/index.php;
                  fastcgi_param SCRIPT_NAME /__fpm_status;
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
              }
              location = /index.php {
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root/index.php;
                  fastcgi_param SCRIPT_NAME /index.php;
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
              }
              location ~ \.php$ { return 404; }
              location / {
                  try_files $uri /index.php$is_args$args;
              }
          }
          NGINX
          sed -i "s|__REPOSITORY_ROOT__|$GITHUB_WORKSPACE|g" /tmp/defects-http-nginx.conf
          sudo cp /tmp/defects-http-nginx.conf /etc/nginx/sites-available/default
          sudo nginx -t
          sudo service nginx restart
          for i in {1..40}; do
            if curl -fsS 'http://127.0.0.1:18097/__fpm_status?json' | grep -q 'active processes'; then
              break
            fi
            sleep 0.25
          done
          curl -fsS 'http://127.0.0.1:18097/__fpm_status?json'
          curl -fsS 'http://127.0.0.1:18097/auth/login/' >/dev/null

      - name: Измерить SQL каждого HTTP-маршрута отдельно
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/integration/defects_http_sql_profile_12.py \
            --origin http://127.0.0.1:18097 \
            --fixture /tmp/defects-http-fixture.json \
            --out /tmp/defects-http-sql-profile.json
          test -s /tmp/defects-http-sql-profile.json

      - name: Испытать реальные HTTP-маршруты и собрать показатели
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/integration/defects_http_load_12.py \
            --origin http://127.0.0.1:18097 \
            --fixture /tmp/defects-http-fixture.json \
            --out /tmp/defects-http-load-report.json \
            --concurrency 8 --seconds 12
          test -s /tmp/defects-http-load-report.json
          if grep -E 'PHP (Warning|Fatal error|Parse error)|Uncaught' \
            /var/log/php8.3-fpm.log /tmp/workspace-organizer-startup.log 2>/dev/null; then
            echo 'Обнаружены ошибки PHP во время нагрузочной проверки' >&2
            exit 1
          fi

      - name: Проверить целостность истории и данных после конкурирующих команд
        shell: bash
        run: |
          set -euo pipefail
          TOTAL="$(mysql -h 127.0.0.1 -uroot -N -B defects_http_load \
            -e "SELECT COUNT(*) FROM defects WHERE description LIKE 'HTTP нагрузка Дефекты %'")"
          test "$TOTAL" -ge 9
          BROKEN="$(mysql -h 127.0.0.1 -uroot -N -B defects_http_load -e "
            SELECT COUNT(*) FROM defects d
            WHERE d.description LIKE 'HTTP нагрузка Дефекты %'
              AND (d.status <> 'closed' OR d.version <> 2
                OR (SELECT COUNT(*) FROM defect_history h
                    WHERE h.entity_type='defect' AND h.entity_id=d.id
                      AND h.event_type='created') <> 1
                OR (SELECT COUNT(*) FROM defect_history h
                    WHERE h.entity_type='defect' AND h.entity_id=d.id
                      AND h.event_type='closed') <> 1
                OR (SELECT COUNT(*) FROM defect_responsible_services r
                    WHERE r.defect_id=d.id) < 1)
          ")"
          test "$BROKEN" = 0
          echo "Проверено $TOTAL новых карточек: закрыты, версии и история согласованы."

      - name: Ступенчатая нагрузка 4–8–12 и контроль целостности после каждой ступени
        shell: bash
        run: |
          set -euo pipefail
          # Обычный CI-профиль выше использует 12 процессов. Для ступени
          # в 12 клиентов оставляем четыре дополнительных процесса для
          # штатных и измерительных запросов, иначе замер очереди искажается.
          sudo sed -i 's/^pm.max_children = .*/pm.max_children = 16/' \
            /etc/php/8.3/fpm/pool.d/www.conf
          sudo service php8.3-fpm restart
          python3 tests/integration/notes_staged_http_capacity_12.py \
            --origin http://127.0.0.1:18097 \
            --fixture /tmp/defects-http-fixture.json \
            --out /tmp/notes-staged-http-capacity-12.json \
            --stages 4,8,12 --seconds 8 \
            --max-p99-ms 3000 \
            --max-php-memory-mib 1536 \
            --max-fpm-queue 8
          test -s /tmp/notes-staged-http-capacity-12.json
          if grep -E 'PHP (Warning|Fatal error|Parse error)|Uncaught' \
            /var/log/php8.3-fpm.log /tmp/workspace-organizer-startup.log 2>/dev/null; then
            echo 'Обнаружены ошибки PHP во время ступенчатой нагрузки' >&2
            exit 1
          fi

      - name: Сохранить обезличенные результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defects-http-load-metrics
          path: |
            /tmp/defects-http-load-report.json
            /tmp/defects-http-sql-profile.json
            /tmp/notes-staged-http-capacity-12.json
          if-no-files-found: warn
          retention-days: 7

      - name: Показать ошибки стенда при отказе
        if: failure()
        shell: bash
        run: |
          sudo tail -n 80 /var/log/php8.3-fpm.log || true
          sudo tail -n 80 /tmp/defects-http-nginx-error.log || true
          tail -n 80 /tmp/workspace-organizer-startup.log || true

      - name: Завершить тестовый стенд
        if: always()
        run: |
          sudo service nginx stop || true
          sudo service php8.3-fpm stop || true
          rm -f .env /tmp/defects-http-fixture.json
