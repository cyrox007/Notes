name: Сквозная приёмка уведомлений Tasks 1.2

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'tests/integration/tasks_notification_e2e_mysql_12.php'
      - '.github/workflows/tasks-notification-e2e-12.yml'
      - 'modules/tasks/services/TaskReminderCycle.php'
      - 'modules/tasks/services/TaskOverdueReminderPublisher.php'
      - 'app/services/notifications/**'
  push:
    branches: ['1.2']
    paths:
      - 'tests/integration/tasks_notification_e2e_mysql_12.php'
      - '.github/workflows/tasks-notification-e2e-12.yml'
      - 'modules/tasks/services/TaskReminderCycle.php'
      - 'modules/tasks/services/TaskOverdueReminderPublisher.php'
      - 'app/services/notifications/**'

permissions:
  contents: read

jobs:
  acceptance:
    name: Полный цикл и восстановление (${{ matrix.db.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db:
          - {name: MySQL-8.4, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'}
          - {name: MariaDB-11.4, image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_DATABASE: workspace_notifications_e2e_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring
          coverage: none
      - name: Выполнить сквозной сценарий на отдельной базе
        env:
          TEST_DB_NAME: workspace_notifications_e2e_test
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          php -l tests/integration/tasks_notification_e2e_mysql_12.php
          php tests/integration/tasks_notification_e2e_mysql_12.php
