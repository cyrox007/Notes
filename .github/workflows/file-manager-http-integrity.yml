name: File Manager HTTP integrity

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  file-manager-http-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: file_manager_http_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Static integrity contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/integration/queued_write_callers.sh
          bash -n tests/integration/file_manager_http_quota.sh
          bash -n tests/integration/file_manager_admin_quota_race.sh
          bash -n tests/integration/file_manager_quota_endpoint.sh
          bash tests/integration/queued_write_callers.sh
          php -l bin/migrate.php
          php -l app/controllers/FileController.php
          php -l app/controllers/FileQuotaController.php
          php -l app/middlewares/StorageQuotaLimit.php
          php -l app/middlewares/StorageMutationLock.php
          php -l app/services/StorageQuotaService.php
          grep -Fq "[LoginRequared::class, UploadRateLimit::class, StorageQuotaLimit::class]" core/routerConfig.php
          grep -Fq "'files_quota'" core/routerConfig.php

      - name: Reject incompatible legacy storage settings schema
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: storage_legacy_contract_test
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot -e 'DROP DATABASE IF EXISTS storage_legacy_contract_test; CREATE DATABASE storage_legacy_contract_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          mysql -h 127.0.0.1 -uroot -proot storage_legacy_contract_test <<'SQL'
          CREATE TABLE system_settings (
            id INT AUTO_INCREMENT PRIMARY KEY,
            setting_key VARCHAR(100) NOT NULL,
            setting_value TEXT NOT NULL,
            UNIQUE KEY uq_system_settings_key (setting_key)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          SQL
          set +e
          php bin/migrate.php --dry-run >/tmp/storage-legacy-contract.out 2>/tmp/storage-legacy-contract.err
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -Fq 'Incompatible storage settings schema: missing system_settings.setting_type' /tmp/storage-legacy-contract.err
          test "$(mysql -N -h 127.0.0.1 -uroot -proot storage_legacy_contract_test -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='schema_migrations'")" = '0'

      - name: Prepare HTTP integration schema
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/messenger_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/file_manager_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/settings_schema.sql

      - name: Real HTTP multipart auth CSRF quota and failure flow
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: file_manager_http_test
          PRIVATE_STORAGE_PATH: /tmp/workspace-file-http-private
        run: |
          set -euo pipefail
          bash tests/integration/file_manager_http_quota.sh
          php -r '
          $d=json_decode(file_get_contents("/tmp/file-http-ok.body"), true, 512, JSON_THROW_ON_ERROR);
          $file=$d["file"] ?? [];
          if (array_key_exists("path", $file)) { fwrite(STDERR, "Upload response exposed storage path\n"); exit(1); }
          if (str_contains(file_get_contents("/tmp/file-http-ok.body"), "/tmp/workspace-file-http-private")) { fwrite(STDERR, "Upload response exposed private root\n"); exit(2); }
          '

      - name: Real HTTP quota endpoint
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: file_manager_http_test
          PRIVATE_STORAGE_PATH: /tmp/workspace-file-quota-private
        run: |
          set -euo pipefail
          bash tests/integration/file_manager_quota_endpoint.sh

      - name: Real HTTP upload versus admin quota update race
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: file_manager_http_test
          PRIVATE_STORAGE_PATH: /tmp/workspace-file-admin-race-private
        run: |
          set -euo pipefail
          bash tests/integration/file_manager_admin_quota_race.sh
