name: File Manager HTTP integrity

on:
  pull_request:
    branches: ['1.0']
  push:
    branches: ['1.0']
    paths:
      - 'modules/files/**'
      - 'app/services/StorageQuotaService.php'
      - 'app/middlewares/StorageQuotaLimit.php'
      - 'app/middlewares/StorageMutationLock.php'
      - 'bin/migrate.php'
      - 'database/migrations/**'
      - 'tests/integration/file_manager_*.sh'
      - 'tests/integration/storage_quota_legacy_migration.sh'
      - '.github/workflows/file-manager-http-integrity.yml'

permissions:
  contents: read

jobs:
  file-manager-http-integrity:
    runs-on: [self-hosted, Linux, X64, notes-ci]
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: file_manager_http_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo
          coverage: none

      - name: Static integrity contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor
          test ! -e vendor
          bash -n tests/integration/queued_write_callers.sh
          bash -n tests/integration/file_manager_http_quota.sh
          bash -n tests/integration/file_manager_admin_quota_race.sh
          bash -n tests/integration/file_manager_quota_endpoint.sh
          bash -n tests/integration/storage_quota_legacy_migration.sh
          bash tests/integration/queued_write_callers.sh
          php -l bin/migrate.php
          php -l modules/files/controllers/FileController.php
          php -l modules/files/controllers/FileQuotaController.php
          php -l modules/files/middlewares/EnforceFileUploadPolicy.php
          php -l app/middlewares/StorageQuotaLimit.php
          php -l app/middlewares/StorageMutationLock.php
          php -l app/services/PermissionService.php
          php -l app/services/StorageQuotaService.php
          grep -Fq "StorageQuotaLimit::class" modules/files/FilesRuntimeProvider.php
          grep -Fq "'files_quota'" modules/files/FilesRuntimeProvider.php
          grep -Fq "admin.settings.manage" app/services/StorageQuotaService.php
          test ! -e app/controllers/FileController.php
          test ! -e app/views/file_manager/index.tpl

      - name: Reconcile supported legacy storage schema and reject ambiguity
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          LEGACY_STORAGE_POSITIVE_DB: storage_legacy_reconcile_test
          LEGACY_STORAGE_NEGATIVE_DB: storage_legacy_reject_test
        run: |
          set -euo pipefail
          bash tests/integration/storage_quota_legacy_migration.sh

      - name: Prepare HTTP integration schema
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/core_identity_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/file_manager_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/access_control_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/settings_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/file_storage_quota_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_http_test < database/module_lifecycle_schema.sql

      - name: Real HTTP multipart auth CSRF quota and failure flow
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: file_manager_http_test
          PRIVATE_STORAGE_PATH: /tmp/workspace-file-http-private
        run: |
          set -euo pipefail
          bash tests/integration/file_manager_http_quota.sh
          php -r '
          $d=json_decode(file_get_contents("/tmp/file-http-ok.body"), true, 512, JSON_THROW_ON_ERROR);
          $file=$d["file"] ?? [];
          if (array_key_exists("path", $file)) { fwrite(STDERR, "Upload response exposed storage path\n"); exit(1); }
          if (str_contains(file_get_contents("/tmp/file-http-ok.body"), "/tmp/workspace-file-http-private")) { fwrite(STDERR, "Upload response exposed private root\n"); exit(2); }
          '

      - name: Real HTTP quota endpoint
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: file_manager_http_test
          PRIVATE_STORAGE_PATH: /tmp/workspace-file-quota-private
        run: |
          set -euo pipefail
          bash tests/integration/file_manager_quota_endpoint.sh

      - name: Real HTTP upload versus admin quota update race
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: file_manager_http_test
          PRIVATE_STORAGE_PATH: /tmp/workspace-file-admin-race-private
        run: |
          set -euo pipefail
          bash tests/integration/file_manager_admin_quota_race.sh
