name: One-time 0.14 beta.1 release prep

on:
  push:
    branches: [0.14-beta1-release-prep]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic release prep
        run: python3 .github/scripts/beta1_release_prep.py

      - name: Commit prepared beta release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare 0.14.0-beta.1 release identity and publishing'
          git push origin HEAD:${GITHUB_REF_NAME}
