name: One-shot Tasks isolation CI sync

on:
  push:
    branches: ['1.0-module-tasks-isolation']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0-module-tasks-isolation
          fetch-depth: 0
      - name: Synchronize Tasks isolation contracts
        shell: bash
        run: |
          echo '' | base64 -d | python3
          php -l tests/integration/module_registry_contract.php
          php -l tests/integration/native_tasks_contract.php
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/integration/module_registry_contract.php .github/workflows/module-isolation-release-gate.yml .github/workflows/native-view-foundation.yml .github/workflows/tasks-browser-lifecycle.yml .github/workflows/tasks-contract.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ci: align Tasks isolation contracts'
          git push origin HEAD:1.0-module-tasks-isolation
