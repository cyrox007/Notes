name: PHP runtime compatibility

on:
  pull_request:
    branches: [master]
  push:
    branches: [0.14-system-requirements-php81]

permissions:
  contents: read

jobs:
  php-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo, gd
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Verify Composer platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Lint application PHP on supported runtime
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          php -l install.php
          php -l core.php
          find app bin core tests ws_server -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log

      - name: Verify minimum-runtime contract
        run: php tests/integration/php_minimum_runtime_contract.php

      - name: Verify module platform contract
        run: php tests/integration/module_registry_contract.php

      - name: Verify router/session security contract
        run: php tests/integration/router_session_security_contract.php
