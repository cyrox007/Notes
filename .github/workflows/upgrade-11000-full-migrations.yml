name: 1.2 — полное применение миграций с опубликованной 1.1

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'core/UpdateDatabaseMigrator.php'
      - 'core/DatabaseOwnership.php'
      - 'database/migrations/**'
      - 'tests/integration/upgrade_11000_full_migrations.php'
      - 'tests/integration/upgrade_11000_prepare_published_schema.php'
      - 'tests/integration/upgrade_11000_seed_published_ledger.php'
      - '.github/workflows/upgrade-11000-full-migrations.yml'
  push:
    branches: ['1.2']
    paths:
      - 'core/UpdateDatabaseMigrator.php'
      - 'database/migrations/**'
      - 'tests/integration/upgrade_11000_full_migrations.php'
      - 'tests/integration/upgrade_11000_prepare_published_schema.php'
      - 'tests/integration/upgrade_11000_seed_published_ledger.php'
      - '.github/workflows/upgrade-11000-full-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        prefix: ['', 'nt12_']
        ledger: ['без журнала', 'с журналом']
        database:
          - {name: 'MySQL 8.4', image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'}
          - {name: 'MariaDB 11.4', image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      mysql:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_DATABASE: workspace_full_upgrade_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Получить версию 1.2
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Получить опубликованный тег 1.1
        uses: actions/checkout@v4
        with:
          path: published
          ref: v1.1.0
          persist-credentials: false
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql
          coverage: none
      - name: Подготовить клиент базы данных
        run: sudo apt-get update -qq && sudo apt-get install -y default-mysql-client
      - name: Разрешить функции SQL только в одноразовой тестовой БД
        env:
          MYSQL_PWD: root
        run: mysql --protocol=tcp -h127.0.0.1 -uroot -e 'SET GLOBAL log_bin_trust_function_creators = 1'
      - name: Собрать опубликованную схему и выполнить миграции 1.2
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: '3306'
          DBNAME: workspace_full_upgrade_test
          DBUSER: workspace
          DBPASS: workspace
          DBPREFIX: ${{ matrix.prefix }}
          LEDGER_MODE: ${{ matrix.ledger }}
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DBPASS"
          # Только опубликованные схемы составленного пакета 1.1.0.
          php -r 'require "published/core/ModuleManifest.php"; require "published/core/DatabaseOwnership.php"; foreach (\Core\DatabaseOwnership::fromPackageRoot("published")->schemaFiles() as $file) echo $file, "\n";' > /tmp/notes-published-schemas.txt
          # При DBPREFIX проверяем изоляцию от посторонней таблицы в общей БД.
          if [[ -n "$DBPREFIX" ]]; then
            mysql --protocol=tcp -h127.0.0.1 -u"$DBUSER" "$DBNAME" <<'SQL'
          CREATE TABLE users (id INT PRIMARY KEY, marker VARCHAR(40) NOT NULL);
          INSERT INTO users VALUES (1, 'Чужая таблица');
          SQL
          fi
          while IFS= read -r schema; do
            php -l candidate/tests/integration/upgrade_11000_prepare_published_schema.php
            php candidate/tests/integration/upgrade_11000_prepare_published_schema.php "published/$schema" > /tmp/notes-prefixed-schema.sql
            mysql --protocol=tcp -h127.0.0.1 -u"$DBUSER" "$DBNAME" < /tmp/notes-prefixed-schema.sql
          done < /tmp/notes-published-schemas.txt
          # Одна и та же тестовая запись вставляется в логическую таблицу users.
          php -r 'require "candidate/core/DatabasePrefix.php"; echo (new \Core\DatabasePrefix())->sql("INSERT INTO users(uid,username,email,password_hash,firstname,lastname) VALUES (\x2700000000-0000-4000-8000-000000000211\x27,\x27upgrade_11000_fixture\x27,\x27upgrade-11000@example.test\x27,\x27hash-test\x27,\x27Проверка\x27,\x27Сохранено\x27);",true);' > /tmp/notes-upgrade-fixture.sql
          mysql --protocol=tcp -h127.0.0.1 -u"$DBUSER" "$DBNAME" < /tmp/notes-upgrade-fixture.sql
          if [[ "$LEDGER_MODE" == 'с журналом' ]]; then
            php -l candidate/tests/integration/upgrade_11000_seed_published_ledger.php
            php candidate/tests/integration/upgrade_11000_seed_published_ledger.php
          fi
          php -l candidate/tests/integration/upgrade_11000_full_migrations.php
          php candidate/tests/integration/upgrade_11000_full_migrations.php
