name: Предварительный просмотр подтверждения уведомлений

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'modules/admin/controllers/NotificationSettingsController.php'
      - 'modules/admin/views/notifications.php'
      - 'tests/integration/notification_receipt_inspection_12.php'
      - '.github/workflows/notification-receipt-inspection-12.yml'
  push:
    branches: ['1.2']
    paths:
      - 'modules/admin/controllers/NotificationSettingsController.php'
      - 'modules/admin/views/notifications.php'
      - 'tests/integration/notification_receipt_inspection_12.php'

permissions:
  contents: read

jobs:
  inspection:
    name: Безопасный просмотр доставки
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Проверить синтаксис и контракт
        run: |
          php -l modules/admin/controllers/NotificationSettingsController.php
          php -l modules/admin/views/notifications.php
          php tests/integration/notification_receipt_inspection_12.php
