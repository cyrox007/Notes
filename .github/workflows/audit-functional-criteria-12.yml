name: 1.2 — требования аудита дефектов и нарядов

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'modules/defects/**'
      - 'modules/work-permits/**'
      - 'tests/integration/defects_registration_12.php'
      - 'tests/integration/defects_reporting_12.php'
      - 'tests/integration/work_permits_draft_mysql_12.php'
      - '.github/workflows/audit-functional-criteria-12.yml'
  push:
    branches: ['1.2']
    paths:
      - 'modules/defects/**'
      - 'modules/work-permits/**'
      - 'tests/integration/defects_registration_12.php'
      - 'tests/integration/defects_reporting_12.php'
      - 'tests/integration/work_permits_draft_mysql_12.php'
      - '.github/workflows/audit-functional-criteria-12.yml'

permissions:
  contents: read

jobs:
  defects:
    name: Дефекты — периоды, сроки, просрочка и история
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Проверить договорённости реестра
        run: |
          set -euo pipefail
          php -l modules/defects/services/DefectReportService.php
          php -l modules/defects/services/DefectRegistrationService.php
          php -l modules/defects/services/DefectRegistryService.php
          php -l modules/defects/controllers/DefectsApiController.php
          php -l modules/defects/views/index.php
          node --check modules/defects/assets/defects.js
          php tests/integration/defects_registration_12.php
          php tests/integration/defects_reporting_12.php

  work-permits:
    name: Наряды — закрытые отдельно от действующих
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: workspace_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none
      - name: Проверить журналы и права
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_NAME: workspace_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          set -euo pipefail
          php -l modules/work-permits/services/WorkPermitDraftService.php
          php -l modules/work-permits/controllers/WorkPermitController.php
          node --check modules/work-permits/assets/work-permits.js
          php tests/integration/work_permits_draft_mysql_12.php
