name: Temporary beta2 release copy sync

on:
  push:
    branches: [0.14-beta2-release-prep]

permissions:
  contents: write

jobs:
  sync-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.14-beta2-release-prep
          fetch-depth: 0

      - name: Update README and CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          replacements = {
              '**Версия:** `0.14.0-beta.1`': '**Версия:** `0.14.0-beta.2`',
              '**Статус:** beta.1 / modular security-hardening baseline; следующая основная цель — `1.0.0` stable': '**Статус:** beta.2 / WebSocket deployment hotfix; следующая основная цель — `1.0.0` stable',
              'Версия `0.14.0-beta.1` переводит проект из alpha в beta: поверх product-complete 0.13 зафиксированы hardening Router/session/redirect boundary, формальные module manifests и registry, persisted module lifecycle, compatibility/dependency contracts и полный regression baseline, включая HTTPS/WSS. Beta.1 — это первая стабилизационная точка, а не финальная 1.0: дальнейшая работа в `master` направлена на завершение изоляции модулей, signed updates/recovery, licensing, observability и остальные stable blockers.': 'Версия `0.14.0-beta.2` сохраняет beta hardening baseline и исправляет deployment-контракт realtime Messenger: браузер использует same-origin `ws(s)://<site>[/base]/ws`, фронтовый Apache/Nginx/Caddy завершает TLS/WebSocket Upgrade, а Workerman безопасно остаётся внутренним listener на `127.0.0.1:27800`. Добавлены Open Server 6+ bridge/диагностика и regression coverage на PHP 8.1/8.3. Дальнейшая работа в `master` по-прежнему направлена на `1.0.0` stable: module isolation, updater/recovery, licensing, observability и остальные stable blockers.'
          }
          for old, new in replacements.items():
              if old not in readme:
                  raise SystemExit(f'README marker missing: {old}')
              readme = readme.replace(old, new, 1)
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## 0.14.0-beta.1 — 2026-09-15\n'
          if marker not in changelog:
              raise SystemExit('CHANGELOG beta.1 marker missing')
          beta2 = (
              '## 0.14.0-beta.2 — 2026-09-15\n\n'
              '### WebSocket deployment hotfix\n'
              '- Исправлен deployment gap, при котором Workerman мог успешно слушать `127.0.0.1:27800`, а браузер не мог подключиться к `wss://<site>/ws` без настроенного reverse proxy.\n'
              '- Добавлен единый `Core\\\\WebSocketEndpoint`: same-origin public endpoint выводится из `SITEURL`/`BASE_PATH`, а HTTPS-сайт больше не получает ошибочный direct `wss://host:27800` fallback для plain listener.\n'
              '- Workerman по умолчанию остаётся loopback-only (`127.0.0.1`); публичный TLS/WSS завершается на Apache/Nginx/Caddy.\n'
              '- Для Apache добавлен guarded `.htaccess` bridge `/ws -> ws://127.0.0.1:27800` при доступных proxy modules; для Open Server 6+ документированы project-local `.osp` Apache/Nginx fallbacks.\n'
              '- Добавлен `php bin/ws_doctor.php`, различающий внутренний listener и публичный proxy endpoint; production healthcheck показывает canonical WebSocket proxy contract.\n'
              '- Новый WebSocket deployment contract проходит на PHP 8.1 и 8.3 и превращает PHP warnings в hard failure.\n'
              '- Перед hotfix-релизом повторно пройдены полный HTTPS/WSS Chromium E2E, installer, security, production operations и release gates.\n\n'
              '### Release direction\n'
              '- `0.14.0-beta.2` остаётся hotfix в beta-линейке; следующий основной milestone — `1.0.0` stable без открытия нового feature cycle.\n\n'
          )
          changelog = changelog.replace(marker, beta2 + marker, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Commit synchronized release copy
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md CHANGELOG.md; then
            echo 'Release copy already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          git commit -m 'Synchronize 0.14.0-beta.2 release copy'
          git push origin HEAD:0.14-beta2-release-prep
