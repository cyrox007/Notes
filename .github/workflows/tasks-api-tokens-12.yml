name: 1.2 — ключи доступа Tasks API

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'modules/tasks/**'
      - 'database/migrations/20261022_tasks_api_tokens.sql'
      - 'database/migrations/manifest.json'
      - 'database/tasks_schema.sql'
      - 'tests/integration/tasks_api_tokens_12.php'
      - '.github/workflows/tasks-api-tokens-12.yml'
  push:
    branches: ['1.2']
    paths:
      - 'modules/tasks/**'
      - 'database/migrations/20261022_tasks_api_tokens.sql'
      - 'database/migrations/manifest.json'
      - 'database/tasks_schema.sql'
      - 'tests/integration/tasks_api_tokens_12.php'
      - '.github/workflows/tasks-api-tokens-12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,mbstring
          coverage: none
      - name: Проверить код, токены и список
        run: |
          php -l modules/tasks/services/TaskApiTokenService.php
          php -l modules/tasks/controllers/TaskApiTokenController.php
          php -l modules/tasks/controllers/TaskReadApiController.php
          php -l modules/tasks/TasksRuntimeProvider.php
          php tests/integration/tasks_api_tokens_12.php
          php tests/integration/tasks_read_api_12.php
