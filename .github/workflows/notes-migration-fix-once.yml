name: One-shot fix Notes migration verification

on:
  push:
    branches: ['1.0-module-notes-isolation']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0-module-notes-isolation
      - name: Fix literal router assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/notes-isolation-migrate-once.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          ! grep -Fq "$router->group('/notes')" core/routerConfig.php'''
          new = '''          ! grep -Fq "\\$router->group('/notes')" core/routerConfig.php'''
          if old not in text:
              raise SystemExit('router assertion marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/notes-migration-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/notes-isolation-migrate-once.yml
          git commit -m 'chore: fix Notes migration assertion'
          git push origin HEAD:1.0-module-notes-isolation
