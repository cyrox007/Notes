name: 1.2 — единая рабочая очередь исполнителя

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'modules/tasks/**'
      - 'tests/integration/tasks_assignee_queue_mysql_12.php'
      - '.github/workflows/tasks-assignee-queue-12.yml'
  push:
    branches: ['1.2']
    paths:
      - 'modules/tasks/**'
      - 'tests/integration/tasks_assignee_queue_mysql_12.php'
      - '.github/workflows/tasks-assignee-queue-12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue:
    name: Очередь (${{ matrix.database.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database:
          - {name: MySQL-8.4, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'}
          - {name: MariaDB-11.4, image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      mysql:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_DATABASE: workspace_assignee_queue_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring
          coverage: none
      - name: Проверить PHP, JavaScript и рабочую очередь
        env:
          TEST_DB_NAME: workspace_assignee_queue_test
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          php -l modules/tasks/services/TaskAssigneeQueueService.php
          php -l modules/tasks/services/TaskUserTimezoneService.php
          php -l modules/tasks/controllers/TaskAssigneeQueueController.php
          php -l modules/tasks/views/index.php
          node --check modules/tasks/assets/assignee-queue.js
          php tests/integration/tasks_assignee_queue_mysql_12.php
