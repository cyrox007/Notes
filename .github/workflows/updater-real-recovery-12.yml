name: 1.2 — настоящее восстановление кода и БД

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'core/UpdateBackupManager.php'
      - 'core/UpdateRollbackCodeRestorer.php'
      - 'core/UpdateDatabaseRestorer.php'
      - 'tests/integration/updater_real_backup_restore_mysql_12.php'
      - '.github/workflows/updater-real-recovery-12.yml'
  push:
    branches: ['1.2']
    paths:
      - 'core/UpdateBackupManager.php'
      - 'core/UpdateRollbackCodeRestorer.php'
      - 'core/UpdateDatabaseRestorer.php'
      - 'tests/integration/updater_real_backup_restore_mysql_12.php'
      - '.github/workflows/updater-real-recovery-12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    name: Восстановление (${{ matrix.database.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database:
          - {name: MySQL-8.4, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'}
          - {name: MariaDB-11.4, image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      mysql:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_DATABASE: workspace_recovery_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,pdo_mysql
          coverage: none
      - name: Выполнить восстановление после обрыва процессов
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_NAME: workspace_recovery_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
          DBPREFIX: ''
        run: |
          php -l tests/integration/updater_real_backup_restore_mysql_12.php
          php tests/integration/updater_real_backup_restore_mysql_12.php
