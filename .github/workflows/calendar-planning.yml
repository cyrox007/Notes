name: Calendar 1.1 — ежедневник и связи

on:
  push:
    branches:
      - '1.1'
      - 'feature/1.1-calendar-planning-*'
    paths:
      - 'core/WorkspaceCalendarLinkTargetProvider.php'
      - 'modules/calendar/**'
      - 'modules/tasks/**CalendarLinkProvider.php'
      - 'modules/tasks/TasksRuntimeProvider.php'
      - 'modules/tasks/runtime.php'
      - 'modules/tasks/module.json'
      - 'modules/notes/**CalendarLinkProvider.php'
      - 'modules/notes/NotesRuntimeProvider.php'
      - 'modules/notes/runtime.php'
      - 'modules/notes/module.json'
      - 'modules/files/**CalendarLinkProvider.php'
      - 'modules/files/FilesRuntimeProvider.php'
      - 'modules/files/runtime.php'
      - 'modules/files/module.json'
      - 'database/calendar_schema.sql'
      - 'database/migrations/20261012_calendar_planning_links.sql'
      - 'database/migrations/manifest.json'
      - 'tests/integration/calendar_planning_*.php'
      - '.github/workflows/calendar-planning.yml'
  pull_request:
    branches: ['1.1']
    paths:
      - 'core/WorkspaceCalendarLinkTargetProvider.php'
      - 'modules/calendar/**'
      - 'modules/tasks/**CalendarLinkProvider.php'
      - 'modules/tasks/TasksRuntimeProvider.php'
      - 'modules/tasks/runtime.php'
      - 'modules/tasks/module.json'
      - 'modules/notes/**CalendarLinkProvider.php'
      - 'modules/notes/NotesRuntimeProvider.php'
      - 'modules/notes/runtime.php'
      - 'modules/notes/module.json'
      - 'modules/files/**CalendarLinkProvider.php'
      - 'modules/files/FilesRuntimeProvider.php'
      - 'modules/files/runtime.php'
      - 'modules/files/module.json'
      - 'database/calendar_schema.sql'
      - 'database/migrations/20261012_calendar_planning_links.sql'
      - 'database/migrations/manifest.json'
      - 'tests/integration/calendar_planning_*.php'
      - '.github/workflows/calendar-planning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-planning:
    name: calendar-planning
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: workspace_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none

      - name: Проверить архитектурный контракт Calendar
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/calendar_planning_contract.php
          php -l core/WorkspaceCalendarLinkTargetProvider.php
          php -l modules/calendar/services/CalendarTimeBlockService.php
          php -l modules/calendar/services/CalendarAgendaService.php
          php -l modules/calendar/services/CalendarLinkService.php
          php -l modules/calendar/controllers/CalendarPlanningApiController.php
          php -l modules/calendar/CalendarRuntimeProvider.php
          php -l modules/tasks/TasksCalendarLinkProvider.php
          php -l modules/notes/NotesCalendarLinkProvider.php
          php -l modules/files/FilesCalendarLinkProvider.php
          php -l modules/calendar/views/index.php
          node --check modules/calendar/assets/calendar-planning.js

      - name: Проверить ежедневник Calendar на MySQL
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: workspace_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
          TEST_DB_ROOT_PASS: root
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/calendar_planning_mysql_contract.php
