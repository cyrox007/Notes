name: Apply RBAC README sync

on:
  push:
    branches: [0.14-phase3-rbac-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rbac-readme-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.14-phase3-rbac-foundation

      - name: Sync README with 0.14 canonical install contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          replacements = [
              (
                  'импортирует 6 canonical schemas и создаёт current contract из 22 обязательных таблиц;',
                  'импортирует 7 canonical schemas и создаёт current contract из 26 обязательных таблиц;',
              ),
              (
                  'database/tasks_schema.sql\ndatabase/settings_schema.sql',
                  'database/tasks_schema.sql\ndatabase/access_control_schema.sql\ndatabase/settings_schema.sql',
              ),
              (
                  'Fresh contract включает 22 обязательные таблицы.',
                  'Fresh contract включает 26 обязательных таблиц.',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'README.md: expected one occurrence, got {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate README contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '7 canonical schemas' README.md
          grep -Fq '26 обязательных таблиц' README.md
          grep -Fq 'database/access_control_schema.sql' README.md
          ! grep -Fq '22 обязательные таблицы' README.md

      - name: Commit README sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m '0.14 RBAC: sync installer documentation [rbac-readme-applied]'
          git push origin HEAD:0.14-phase3-rbac-foundation
