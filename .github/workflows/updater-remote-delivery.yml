name: 1.0 updater remote delivery

on:
  pull_request:
    branches: [master, '1.0']
  push:
    branches: ['1.0-updater-remote-delivery']

permissions:
  contents: read

jobs:
  remote-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, openssl, zlib
          coverage: none

      - name: Lint remote delivery boundary
        shell: bash
        run: |
          set -euo pipefail
          php -l core/UpdateRemoteTransport.php
          php -l core/UpdateRemoteDelivery.php
          php -l bin/update_remote.php
          php -l tests/integration/updater_remote_delivery_contract.php
          php -l tests/integration/updater_remote_address_policy_contract.php

      - name: Verify signed remote delivery contract
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/updater_remote_delivery_contract.php
          php tests/integration/updater_remote_address_policy_contract.php
          HELP_OUTPUT="$(php bin/update_remote.php --help)"
          grep -Fq 'remote signed update delivery' <<<"$HELP_OUTPUT"

      - name: Verify network/live-mutation separation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'verify_peer' core/UpdateRemoteTransport.php
          grep -Fq 'verify_peer_name' core/UpdateRemoteTransport.php
          grep -Fq 'NON_PUBLIC_IPV4_CIDRS' core/UpdateRemoteTransport.php
          grep -Fq 'NON_PUBLIC_IPV6_CIDRS' core/UpdateRemoteTransport.php
          grep -Fq '100.64.0.0/10' core/UpdateRemoteTransport.php
          grep -Fq '2001:db8::/32' core/UpdateRemoteTransport.php
          grep -Fq 'Content-Length' core/UpdateRemoteTransport.php
          grep -Fq 'UpdateManifestVerifier' core/UpdateRemoteDelivery.php
          grep -Fq 'UpdatePackageStager' core/UpdateRemoteDelivery.php
          grep -Fq 'UpdateArchiveInspector' core/UpdateRemoteDelivery.php
          grep -Fq 'package_downloaded' core/UpdateRemoteDelivery.php
          ! grep -Fq 'maintenance' core/UpdateRemoteDelivery.php
          ! grep -Fq 'UpdateLiveApplier' core/UpdateRemoteDelivery.php
          ! grep -Fq 'UpdateApplyCommand' core/UpdateRemoteDelivery.php
          ! grep -Fq 'curl_' core/UpdateRemoteTransport.php
          ! grep -Fq 'file_get_contents($url' core/UpdateRemoteTransport.php
