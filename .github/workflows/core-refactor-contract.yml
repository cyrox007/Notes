name: Core refactor contract

on:
  pull_request:
    branches: [dev, '1.0', master, 'release/1.0.7-rc']
  push:
    branches: [refactor/core-boundaries, 'refactor/1.0.7-core-audit-final']

permissions:
  contents: read

jobs:
  core-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: core_refactor_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mysqli, gd
          coverage: none

      - name: Lint refactored core boundaries
        shell: bash
        run: |
          set -euo pipefail
          php -l core/Config.php
          php -l core/Request.php
          php -l core/Controller.php
          php -l core/Helper.php
          php -l core/Uuid.php
          php -l core/RouteTemplate.php
          php -l core/Router.php
          php -l core/DatabaseSqlInspector.php
          php -l core/DatabaseManager.php
          php -l core/UpdateProcessRunner.php
          php -l core/UpdatePath.php
          php -l core/UpdateCandidateVerifier.php
          php -l core/UpdateCodeSwitcher.php
          php -l core/UpdateDatabaseRestorer.php
          php -l core/UpdateLiveApplier.php
          php -l core/UpdateBackupManager.php
          php -l core/UpdateReleaseCandidate.php
          php -l core/UpdateRollbackCodeRestorer.php
          php -l core/UpdatePackageStager.php
          php -l core/UpdateTransactionJournal.php
          php -l core/UpdateTransactionStateMachine.php
          php -l core/UpdateRemoteDelivery.php
          php -l core/UpdateApplyCommand.php
          php -l core.php
          php -l modules/notes/models/NoteModel.php
          php -l bin/release_acceptance.php
          php -l tests/integration/release_acceptance_contract.php
          php -l tests/integration/core_refactor_contract.php
          php -l tools/release/core_usage_audit.php
          php -l modules/profile/services/AvatarImageProcessor.php
          php -l tests/integration/profile_avatar_image_processor_contract.php

      - name: Проверить отсутствие старых путей bootstrap
        shell: bash
        run: |
          set -euo pipefail
          refs="$(
            grep -RInE 'core/(config|request|controller)\.php' \
              .github app bin core modules tests tools \
              --include='*.php' --include='*.yml' --include='*.yaml' --include='*.sh' \
              || true
          )"
          root_refs="$(grep -InE 'core/(config|request|controller)\.php' ./*.php 2>/dev/null || true)"
          if [[ -n "$root_refs" ]]; then
            if [[ -n "$refs" ]]; then
              refs+=$'\n'
            fi
            refs+="$root_refs"
          fi
          if [[ -n "$refs" ]]; then
            printf '%s\n' 'Найдены обращения к старым путям bootstrap:' "$refs" >&2
            exit 1
          fi

      - name: Проверить выделенные границы ядра
        run: php tests/integration/core_refactor_contract.php

      - name: Построить карту использования ядра на PHP 8.1
        if: matrix.php == '8.1'
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/core_usage_audit.php --json | tee /tmp/core-usage-audit.json
          php -r '$d=json_decode(file_get_contents("/tmp/core-usage-audit.json"),true,64,JSON_THROW_ON_ERROR); if (($d["minimum_supported_php"]??"")!=="8.1") exit(1); if (($d["candidates"]["classes_without_product_references"]??[])!==[]) exit(1); if (($d["candidates"]["functions_without_product_references"]??[])!==[]) exit(1); if (($d["candidates"]["private_methods_with_declaration_only"]??[])!==[]) exit(1);'

      - name: Проверить обработку аватара без legacy Core Images
        run: php tests/integration/profile_avatar_image_processor_contract.php

      - name: Проверить исходный контракт приёмки релиза
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/release_acceptance_contract.php
          php bin/release_acceptance.php --json > /tmp/release-acceptance-source.json
          php -r '$d=json_decode(file_get_contents("/tmp/release-acceptance-source.json"),true,32,JSON_THROW_ON_ERROR); if (($d["status"]??"")==="fail") exit(1);'

      - name: Проверить транзакционную семантику DatabaseManager
        env:
          DBDRIVER: mysql
          DBHOST: 127.0.0.1
          DBPORT: '3306'
          DBUSER: root
          DBPASS: root
          DBNAME: core_refactor_test
          SITEURL: http://localhost
        run: php tests/integration/database_queue_integrity.php

      - name: Проверить контракт безопасности маршрутизатора
        run: php tests/integration/router_session_security_contract.php
