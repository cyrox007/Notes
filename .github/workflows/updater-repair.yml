name: Standalone updater repair

on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - 'tools/release/repair-updater-stage.php'
      - 'tools/release/repair-updater-full.php'
      - 'tools/release/build-updater-repair.py'
      - 'tests/integration/updater_full_repair_contract.php'
      - 'docs/updates/updater-repair-2026-10-10.md'
      - '.github/workflows/updater-repair.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, sodium, openssl, mbstring, fileinfo, zlib
          coverage: none
      - name: Validate and package repair
        run: |
          php -l tools/release/repair-updater-stage.php
          php -l tools/release/repair-updater-full.php
          php tests/integration/updater_full_repair_contract.php
          php tests/integration/database_ownership_contract.php
          php tests/integration/updater_external_web_contract.php
          php tests/integration/environment_loader_contract.php
          php tests/integration/updater_readiness_contract.php
          php tests/integration/updater_attempt_log_contract.php
          php tests/integration/updater_live_apply_contract.php
          python3 tools/release/build-updater-repair.py --output notes-updater-repair-full-1.0.13-1.0.15.zip
      - uses: actions/upload-artifact@v4
        with:
          name: notes-updater-repair-full-1.0.13-1.0.15
          path: notes-updater-repair-full-1.0.13-1.0.15.zip
          retention-days: 90
