name: 1.0 обновление из админ-панели

on:
  pull_request:
    branches: [master, '1.0', dev]
  push:
    branches: ['1.0-admin-update-ui']

permissions:
  contents: read

jobs:
  admin-update-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, sodium, openssl, zlib
          coverage: none

      - name: Проверить синтаксис контура обновления
        shell: bash
        run: |
          set -euo pipefail
          php -l core/UpdatePhpCli.php
          php -l core/UpdateAutomaticRecovery.php
          php -l core/UpdateBootRecoveryGate.php
          php -l core/UpdateReadiness.php
          php -l bin/update_doctor.php
          php -l bin/update_run.php
          php -l modules/admin/services/AdminUpdateService.php
          php -l modules/admin/controllers/UpdateController.php
          php -l modules/admin/views/updates.php
          php -l modules/admin/views/settings.php
          php -l app/middlewares/EnforceMaintenanceMode.php
          php -l core/routerConfig.php
          php -l tests/integration/updater_readiness_contract.php
          php -l tests/integration/updater_operator_flow_contract.php
          php -l tests/integration/admin_update_ui_contract.php
          php -l tests/integration/one_click_update_contract.php
          php -l tests/integration/automatic_update_recovery_contract.php
          php -l tests/integration/updater_preapply_crash_recovery_contract.php
          php -l tests/integration/native_admin_contract.php
          node --check assets/js/update-notifications.js

      - name: Проверить сервис и интерфейс подписанного обновления
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/updater_readiness_contract.php
          php tests/integration/updater_operator_flow_contract.php
          php tests/integration/admin_update_ui_contract.php
          php tests/integration/one_click_update_contract.php
          php tests/integration/automatic_update_recovery_contract.php
          php tests/integration/updater_preapply_crash_recovery_contract.php
          php tests/integration/native_admin_contract.php

      - name: Повторно проверить сетевую границу обновлятора
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/updater_remote_delivery_contract.php
          php tests/integration/updater_remote_address_policy_contract.php

      - name: Проверить границу web-установки
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- "->add('GET', '/updates/status'" modules/admin/AdminRuntimeProvider.php
          grep -Fq -- "->add('GET', '/updates/check'" modules/admin/AdminRuntimeProvider.php
          grep -Fq -- "->add('POST', '/updates/stage'" modules/admin/AdminRuntimeProvider.php
          grep -Fq -- "->add('POST', '/updates/apply-latest'" modules/admin/AdminRuntimeProvider.php
          grep -Fq -- "->add('POST', '/updates/apply'" modules/admin/AdminRuntimeProvider.php
          grep -Fq "RequireAdminSettingsManage::class, CSRFMiddleware::class], 'admin_updates_stage'" modules/admin/AdminRuntimeProvider.php
          grep -Fq "RequireAdminSettingsManage::class, CSRFMiddleware::class], 'admin_updates_apply_latest'" modules/admin/AdminRuntimeProvider.php
          grep -Fq "RequireAdminSettingsManage::class, CSRFMiddleware::class], 'admin_updates_apply'" modules/admin/AdminRuntimeProvider.php
          grep -Fq "hasRole(\$actorId, 'superadmin')" modules/admin/services/AdminUpdateService.php
          grep -Fq 'UpdateRemoteDelivery' modules/admin/services/AdminUpdateService.php
          grep -Fq 'UpdateProcessRunner' modules/admin/services/AdminUpdateService.php
          grep -Fq 'UpdatePhpCli::resolve()' modules/admin/services/AdminUpdateService.php
          grep -Fq -- '--expected-version-code=' modules/admin/services/AdminUpdateService.php
          grep -Fq -- '--expected-package-sha256=' modules/admin/services/AdminUpdateService.php
          ! grep -Fq 'UpdateApplyCommand' modules/admin/services/AdminUpdateService.php
          ! grep -Fq 'UpdateLiveApplier' modules/admin/services/AdminUpdateService.php
          ! grep -Fq 'UpdateBackupManager' modules/admin/services/AdminUpdateService.php
          ! grep -Fq "'stage_dir' =>" modules/admin/controllers/UpdateController.php
          grep -Fq "admin_updates_apply" modules/admin/views/updates.php
          grep -Fq 'UpdateReadiness' modules/admin/services/AdminUpdateService.php
          ! grep -Fq 'bin/update_run.php --recover' modules/admin/views/updates.php
          grep -Fq 'UpdateAutomaticRecovery' app/middlewares/EnforceMaintenanceMode.php
          grep -Fq 'automaticRecovery->attempt' app/middlewares/EnforceMaintenanceMode.php
          grep -Fq 'UpdateBootRecoveryGate::enforce(SITEPATH)' core.php
          grep -Fq "'expected-version-code:'" bin/update_run.php
          grep -Fq "'expected-package-sha256:'" bin/update_run.php
          grep -Fq 'Подписанный канал изменился после подтверждения обновления' bin/update_run.php
