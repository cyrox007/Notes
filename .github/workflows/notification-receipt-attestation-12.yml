name: Ручная приёмка получения уведомлений 1.2

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'app/services/notifications/NotificationReceiptAttestation.php'
      - 'app/services/notifications/NotificationLiveAcceptanceReport.php'
      - 'modules/admin/controllers/NotificationSettingsController.php'
      - 'modules/admin/views/notifications.php'
      - 'modules/admin/AdminRuntimeProvider.php'
      - 'database/migrations/20261023_notification_receipt_attestations.sql'
      - 'database/notifications_schema.sql'
      - 'database/migrations/manifest.json'
      - 'tests/integration/notification_live_acceptance_report_mysql_12.php'
      - '.github/workflows/notification-receipt-attestation-12.yml'
  push:
    branches: ['1.2']
    paths:
      - 'app/services/notifications/NotificationReceiptAttestation.php'
      - 'app/services/notifications/NotificationLiveAcceptanceReport.php'
      - 'tests/integration/notification_live_acceptance_report_mysql_12.php'
      - '.github/workflows/notification-receipt-attestation-12.yml'

permissions:
  contents: read

jobs:
  mysql:
    name: Подтверждение получения (${{ matrix.db.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db:
          - {name: MySQL-8.4, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'}
          - {name: MariaDB-11.4, image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_DATABASE: workspace_receipt_attestation_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Проверить код и статус ручного получения
        env:
          TEST_DB_NAME: workspace_receipt_attestation_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          php -l app/services/notifications/NotificationReceiptAttestation.php
          php -l app/services/notifications/NotificationLiveAcceptanceReport.php
          php -l modules/admin/controllers/NotificationSettingsController.php
          php -l modules/admin/AdminRuntimeProvider.php
          php -l modules/admin/views/notifications.php
          php tests/integration/notification_live_acceptance_report_mysql_12.php
