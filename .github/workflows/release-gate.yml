name: Stable release gate

on:
  pull_request:
    branches: [master, '1.0']
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: workspace_release_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo, gd, zlib, pcntl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify vendor-free runtime contract
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          test "$(php -r '$j=json_decode(file_get_contents("composer.lock"),true,64,JSON_THROW_ON_ERROR); echo count($j["packages"] ?? []);')" = '0'
          test ! -d vendor
          ! grep -Fq 'vendor/autoload.php' core.php
          ! grep -R -F 'Workerman\\' modules/messenger/socket ws_server core.php
          test ! -e app/socket/NativeMessengerServer.php
          php -l core.php
          php -l core/Environment.php
          php -l core/NativeViewRenderer.php
          php -l ws_server/server.php

      - name: Lint all PHP sources
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            node --check "$source"
          done < <(
            find assets/js modules tests/e2e -type f \( -name '*.js' -o -name '*.mjs' \) \
              ! -path 'modules/messenger/views/*' -print0
          )
          shopt -s nullglob
          for source in modules/messenger/views/*.js; do
            target="/tmp/messenger-$(basename "$source")"
            sed '/^{literal}$/d;/^{\/literal}$/d' "$source" > "$target"
            node --check "$target"
          done

      - name: Verify release governance contract
        run: php tests/integration/release_governance_contract.php

      - name: Verify security observability contract
        run: php tests/integration/security_observability_contract.php

      - name: Проверить двухфакторную аутентификацию TOTP
        run: php tests/integration/two_factor_contract.php

      - name: Verify retention and permanent purge contract
        run: php tests/integration/retention_purge_contract.php

      - name: Verify legacy templates are removed
        run: php tests/integration/no_legacy_templates_contract.php

      - name: Verify release evidence contract
        run: php tests/integration/release_evidence_contract.php

      - name: Verify 0.13 compatibility baseline
        run: php tests/integration/usable_alpha_readiness.php

      - name: Verify findability source contract
        run: php tests/integration/findability_source_contract.php

      - name: Verify hosting package source contract
        run: php tests/integration/hosting_package_source_contract.php

      - name: Verify deployment surface contract
        run: php tests/integration/deployment_surface_contract.php

      - name: Verify unified UI system contract
        run: php tests/integration/ui_system_contract.php

      - name: Verify final release acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/release_acceptance_contract.php
          php bin/release_acceptance.php --json > /tmp/release-acceptance-source.json
          php -r '$d=json_decode(file_get_contents("/tmp/release-acceptance-source.json"),true,32,JSON_THROW_ON_ERROR); if (($d["status"]??"")==="fail") exit(1);'

      - name: Verify stable release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(php -r "require 'core/Version.php'; echo Core\\Version::VERSION;")" = '1.0.3'
          test "$(php -r "require 'core/Version.php'; echo Core\\Version::VERSION_CODE;")" = '10003'
          test "$(php -r "require 'core/Version.php'; echo Core\\Version::STATUS;")" = 'stable'
          test "$(php -r "require 'core/Version.php'; echo Core\\Version::RELEASE_DATE;")" = '2026-09-24'
          grep -Fq '**Версия:** `1.0.3`' README.md
          grep -Fq '## 1.0.3 — 2026-09-24' CHANGELOG.md
          test -s docs/releases/v1.0.3.md
          grep -Fq '# Workspace Organizer 1.0.3' docs/releases/v1.0.3.md

      - name: Verify migration manifest contract
        shell: bash
        run: |
          set -euo pipefail
          php -l core/MigrationManifest.php
          php -l core/UpdateMigrationPreflight.php
          php -r '$m=json_decode(file_get_contents("database/migrations/manifest.json"),true,32,JSON_THROW_ON_ERROR); if (($m["schema"]??null)!==1 || ($m["product"]??null)!=="workspace-organizer" || !is_array($m["migrations"]??null) || $m["migrations"]===[]) exit(1);'
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS updater_migration_preflight_test; CREATE DATABASE updater_migration_preflight_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          DBHOST=127.0.0.1 DBPORT=3306 DBUSER=root DBPASS=root MIGRATION_PREFLIGHT_DBNAME=updater_migration_preflight_test php tests/integration/updater_migration_preflight_contract.php

      - name: Import canonical database contract
        shell: bash
        run: |
          set -euo pipefail
          for schema in \
            database/messenger_schema.sql \
            database/notes_schema.sql \
            database/file_manager_schema.sql \
            database/user_fields_schema.sql \
            database/tasks_schema.sql \
            database/access_control_schema.sql \
            database/audit_schema.sql \
            database/settings_schema.sql \
            database/module_lifecycle_schema.sql
          do
            mysql -h 127.0.0.1 -uroot -proot workspace_release_gate < "$schema"
          done
          count="$(mysql -N -h 127.0.0.1 -uroot -proot workspace_release_gate -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE();")"
          test "$count" -eq 34
          test "$(mysql -N -h 127.0.0.1 -uroot -proot workspace_release_gate -e "SELECT setting_value FROM system_settings WHERE setting_key='file_manager_default_quota_bytes'")" = '1073741824'

      - name: Verify user action audit contract
        env:
          DBDRIVER: mysql
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: workspace_release_gate
          PRIVATE_STORAGE_PATH: /tmp/workspace-release-audit-private
          AUDIT_LOG_RETENTION_DAYS: 180
        run: |
          set -euo pipefail
          install -d -m 700 "$PRIVATE_STORAGE_PATH" "$PRIVATE_STORAGE_PATH/logs"
          php tests/integration/user_action_log_contract.php
          php bin/audit_log.php --json > /tmp/workspace-audit-preview.json
          grep -Fq '"status": "ok"' /tmp/workspace-audit-preview.json

      - name: Run data-integrity integration contracts
        env:
          DBDRIVER: mysql
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: workspace_release_gate
          PRIVATE_STORAGE_PATH: /tmp/workspace-release-integrity-private
        run: |
          set -euo pipefail
          rm -rf "$PRIVATE_STORAGE_PATH"
          install -d -m 700 "$PRIVATE_STORAGE_PATH/file_manager"
          php tests/integration/database_queue_integrity.php
          php tests/integration/file_lifecycle_integrity.php
          php bin/reconcile_file_storage.php --cleanup-deleted

      - name: Run production healthcheck
        env:
          DBDRIVER: mysql
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: workspace_release_gate
          SITEURL: https://workspace.example.test
          WS_PUBLIC_URL: wss://workspace.example.test/ws
          WS_ALLOWED_ORIGINS: https://workspace.example.test
          UNIQUE_KEY: release-gate-unique-key-0123456789abcdef0123456789abcdef
          MSG_SECRET_KEY: release-gate-message-key-0123456789abcdef0123456789abcdef
          WS_TICKET_SECRET: release-gate-ticket-key-0123456789abcdef0123456789abcdef
          PRIVATE_STORAGE_PATH: /tmp/workspace-release-private
          DEPLOYMENT_NODE_COUNT: '1'
        run: |
          set -euo pipefail
          rm -rf "$PRIVATE_STORAGE_PATH"
          install -d -m 700 "$PRIVATE_STORAGE_PATH"
          for directory in file_manager messenger notes users rate-limit logs legacy; do
            install -d -m 700 "$PRIVATE_STORAGE_PATH/$directory"
          done
          php bin/healthcheck.php

      - name: Verify signing trust registry hygiene
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration/production_trust_domains_contract.php
          php -r '
          foreach (["license"=>"config/license_trusted_keys.php","update"=>"config/update_trusted_keys.php"] as $domain=>$path) {
              $keys=require $path;
              if (!is_array($keys)) { fwrite(STDERR,"Registry $domain не является массивом\n"); exit(1); }
              foreach ($keys as $id=>$token) {
                  if (!is_string($id) || preg_match("/^[A-Za-z0-9][A-Za-z0-9._-]{2,95}$/",$id)!==1 || !is_string($token)) exit(1);
                  $raw=base64_decode(strtr($token,"-_","+/"),true);
                  if ($raw===false || strlen($raw)!==32) { fwrite(STDERR,"Некорректный публичный ключ $domain: $id\n"); exit(1); }
              }
          }
          '
          if find . -type f \( -name '*.license-secret' -o -name 'workspace-license-*.secret' -o -name '*.update-secret' -o -name 'workspace-update-*.secret' \) -print -quit | grep -q .; then
            echo 'Репозиторий содержит запрещённый приватный signing material' >&2
            exit 1
          fi

      - name: Require production public signing keys for master release
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          php -r '
          $license=require "config/license_trusted_keys.php";
          $update=require "config/update_trusted_keys.php";
          if (!is_array($license) || $license===[]) { fwrite(STDERR,"Production registry публичных license keys пуст\n"); exit(1); }
          if (!is_array($update) || $update===[]) { fwrite(STDERR,"Production registry публичных update keys пуст\n"); exit(1); }
          if (array_intersect_key($license,$update)!==[]) { fwrite(STDERR,"License/update key ID должны быть независимыми\n"); exit(1); }
          if (array_intersect(array_values($license),array_values($update))!==[]) { fwrite(STDERR,"Публичные license/update keys должны использовать независимый key material\n"); exit(1); }
          '

      - name: Verify upload-ready vendor-free hosting bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/workspace-hosting-bundle
          rm -rf "$bundle"
          mkdir -p "$bundle"
          rsync -a ./ "$bundle/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='tests/' \
            --exclude='tools/' \
            --exclude='vendor/' \
            --exclude='cache/*' \
            --exclude='compile/*' \
            --exclude='*.license-secret' \
            --exclude='workspace-license-*.secret' \
            --exclude='*.update-secret' \
            --exclude='workspace-update-*.secret'
          mkdir -p "$bundle/cache" "$bundle/compile"
          test ! -e "$bundle/vendor"
          test ! -e "$bundle/.env"
          test ! -e "$bundle/tests"
          test ! -e "$bundle/tools"
          test -f "$bundle/install.php"
          test -f "$bundle/core/NativeViewRenderer.php"
          test -f "$bundle/modules/messenger/socket/NativeMessengerServer.php"
          test ! -e "$bundle/app/socket/NativeMessengerServer.php"
          test -f "$bundle/config/license_trusted_keys.php"
          test -f "$bundle/config/update_trusted_keys.php"
          test -f "$bundle/bin/update_bootstrap.php"
          test -f "$bundle/bin/update_apply.php"
          test -f "$bundle/core/MigrationManifest.php"
          test -f "$bundle/core/UpdateMigrationPreflight.php"
          test -f "$bundle/database/migrations/manifest.json"
          test -f "$bundle/docs/releases/v1.0.3.md"
