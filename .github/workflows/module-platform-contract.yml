name: Module platform contract

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  module-platform-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint module platform
        run: |
          php -l core/ModuleManifest.php
          php -l core/ModuleRegistry.php
          php -l tests/integration/module_registry_contract.php

      - name: Verify module registry contract
        run: php tests/integration/module_registry_contract.php
