name: Module platform contract

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  module-platform-contract:
    runs-on: [self-hosted, Linux, X64, wb-ci]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint module platform
        run: |
          php -l core/ModuleManifest.php
          php -l core/ModuleRegistry.php
          php -l core/ModuleRuntimeProvider.php
          php -l core/ModuleCapabilityRegistry.php
          php -l core/ModuleRuntimeLoader.php
          php -l core/DatabaseOwnership.php
          php -l core.php
          php -l index.php
          php -l tests/integration/module_registry_contract.php
          php -l tests/integration/database_ownership_contract.php
          php -l tests/e2e/router.php

      - name: Verify module registry, isolated runtime and capability contracts
        run: php tests/integration/module_registry_contract.php

      - name: Verify database ownership compositions
        run: php tests/integration/database_ownership_contract.php

      - name: Verify module package web boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '|modules|' .htaccess
          grep -Fq "'modules'" tests/e2e/router.php
          grep -Fq 'privateSegments' tests/e2e/router.php
          grep -Fq "'/core/ModuleRuntimeProvider.php'" core.php
          grep -Fq "'/core/ModuleCapabilityRegistry.php'" core.php
          grep -Fq "'/core/ModuleRuntimeLoader.php'" core.php
          grep -Fq 'ModuleRuntimeLoader::boot' core.php
          grep -Fq 'ModuleRuntimeLoader::getInstance()->registerRoutes' index.php
          grep -Fq 'capabilityRegistry->seal' core/ModuleRuntimeLoader.php
