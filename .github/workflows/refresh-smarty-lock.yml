name: Refresh Smarty lock

on:
  push:
    branches: [audit-hardening]
    paths:
      - '.github/workflows/refresh-smarty-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit-hardening

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Update Smarty to patched release
        run: composer update smarty/smarty --with-dependencies --no-interaction --prefer-dist --no-progress

      - name: Verify dependency audit
        run: composer audit --no-interaction

      - name: Commit refreshed lock file
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock; then
            echo 'composer.lock already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'security: update Smarty to patched release'
          git push origin HEAD:audit-hardening
