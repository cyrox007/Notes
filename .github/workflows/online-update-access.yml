name: Online update license access

on:
  pull_request:
    branches: [dev, master, '1.0']
  push:
    branches: [feat/online-license-updates]

permissions:
  contents: read

jobs:
  online-update-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, openssl, mbstring, pdo_sqlite, zip
          coverage: none
      - name: Online access and existing signed delivery contracts
        run: |
          php -l tools/license-server/LicenseServer.php
          php -l tools/license-server/public/index.php
          php -l tools/license-server/manage.php
          php -l bin/update_activate.php
          php -l bin/update_remote.php
          php -l core/UpdateAccessBootstrap.php
          php -l core/UpdateDownloadCredentials.php
          php tests/integration/automatic_update_bootstrap_contract.php
          php tests/integration/online_update_access_contract.php
          php tests/integration/online_update_http_contract.php
          php tests/integration/updater_remote_delivery_contract.php
          php tests/integration/updater_remote_address_policy_contract.php
          php tests/integration/admin_update_ui_contract.php
          php tests/integration/license_verifier_contract.php
