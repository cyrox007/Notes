name: Browser HTTPS and WSS E2E

on:
  pull_request:
    branches: [master]
  push:
    branches: [browser-wss-e2e]

permissions:
  contents: read

jobs:
  browser-wss-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: notes_browser_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo, gd
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Install browser and TLS proxy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Entrypoint and E2E syntax contract
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          php -l core/config.php
          php -l ws_server/server.php
          php -l tests/e2e/router.php
          node --check tests/e2e/browser-smoke.mjs
          grep -Fq "'/core/routerConfig.php'" index.php
          ! grep -Fq "'/core/RouterConfig.php'" index.php
          ! grep -Fq 'fonts.googleapis.com' index.php
          ! grep -Fq "display_errors', 1" index.php
          grep -Fq 'Workerman\Protocols\Websocket' ws_server/server.php
          grep -Fq "new Worker(sprintf('tcp://%s:%d'" ws_server/server.php
          grep -Fq "getenv('SITEURL')" core/config.php

      - name: Prepare canonical database
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot notes_browser_e2e < database/messenger_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_e2e < database/notes_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_e2e < database/file_manager_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_e2e < database/user_fields_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_e2e < database/tasks_schema.sql

      - name: Seed browser users
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: notes_browser_e2e
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $pdo = new PDO(
              sprintf('mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4', getenv('DBHOST'), getenv('DBPORT'), getenv('DBNAME')),
              getenv('DBUSER'),
              getenv('DBPASS'),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $stmt = $pdo->prepare(
              'INSERT INTO users (uid,username,email,password_hash,firstname,lastname,role,is_active,created_at,updated_at) '
              . 'VALUES (:uid,:username,:email,:password_hash,:firstname,:lastname,888,1,NOW(),NOW())'
          );
          $users = [
              [
                  'uid' => '11111111-1111-4111-8111-111111111111',
                  'username' => 'e2e_alice',
                  'email' => 'alice-e2e@example.test',
                  'password' => 'E2eAlicePass123!',
                  'firstname' => 'Alice',
                  'lastname' => 'E2E',
              ],
              [
                  'uid' => '22222222-2222-4222-8222-222222222222',
                  'username' => 'e2e_bob',
                  'email' => 'bob-e2e@example.test',
                  'password' => 'E2eBobPass123!',
                  'firstname' => 'Bob',
                  'lastname' => 'E2E',
              ],
          ];
          foreach ($users as $user) {
              $stmt->execute([
                  ':uid' => $user['uid'],
                  ':username' => $user['username'],
                  ':email' => $user['email'],
                  ':password_hash' => password_hash($user['password'], PASSWORD_ARGON2ID),
                  ':firstname' => $user['firstname'],
                  ':lastname' => $user['lastname'],
              ]);
          }
          PHP

      - name: Prepare production-like environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/workspace-browser-private
          mkdir -p /tmp/workspace-browser-private/logs
          chmod 700 /tmp/workspace-browser-private /tmp/workspace-browser-private/logs
          mkdir -p compile cache
          cat > .env <<'ENV'
          DBDRIVER=mysql
          DBHOST=127.0.0.1
          DBPORT=3306
          DBUSER=root
          DBPASS=root
          DBNAME=notes_browser_e2e
          UNIQUE_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MSG_SECRET_KEY=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          WS_TICKET_SECRET=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          PRIVATE_STORAGE_PATH=/tmp/workspace-browser-private
          SITEURL=https://127.0.0.1:8443
          BASE_PATH=/
          REGISTRATION_INVITE_CODE=
          WS_HOST=127.0.0.1
          WS_PORT=27800
          WS_PUBLIC_URL=wss://127.0.0.1:8443/ws
          WS_ALLOWED_ORIGINS=https://127.0.0.1:8443
          MAX_LOGIN_ATTEMPTS=20
          AUTH_RATE_LIMIT_WINDOW_SECONDS=60
          UPLOAD_RATE_LIMIT_ATTEMPTS=60
          UPLOAD_RATE_LIMIT_WINDOW_SECONDS=60
          LOG_LEVEL=INFO
          LOG_FILE=/tmp/workspace-browser-private/logs/app.log
          CSRF_ENABLED=true
          ENV
          chmod 600 .env

      - name: Create self-signed TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/workspace-e2e.key \
            -out /tmp/workspace-e2e.crt \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1'

      - name: Start PHP and Workerman
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 tests/e2e/router.php >/tmp/workspace-http.log 2>&1 &
          echo $! >/tmp/workspace-http.pid

          php ws_server/server.php start -d >/tmp/workspace-ws-start.log 2>&1

          HTTP_READY=0
          WS_READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/auth/login >/dev/null 2>&1; then
              HTTP_READY=1
            fi
            if (echo >/dev/tcp/127.0.0.1/27800) >/dev/null 2>&1; then
              WS_READY=1
            fi
            if [[ "$HTTP_READY" == '1' && "$WS_READY" == '1' ]]; then
              exit 0
            fi
            sleep 1
          done

          echo "HTTP_READY=$HTTP_READY WS_READY=$WS_READY"
          cat /tmp/workspace-http.log || true
          cat /tmp/workspace-ws-start.log || true
          cat /tmp/workspace-browser-private/logs/app.log || true
          exit 1

      - name: Start HTTPS/WSS Nginx proxy
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/workspace-e2e-nginx.conf <<'NGINX'
          worker_processes 1;
          pid /tmp/workspace-e2e-nginx.pid;
          error_log /tmp/workspace-e2e-nginx-error.log info;
          events { worker_connections 256; }
          http {
            access_log /tmp/workspace-e2e-nginx-access.log;
            server {
              listen 8443 ssl;
              server_name 127.0.0.1;
              ssl_certificate /tmp/workspace-e2e.crt;
              ssl_certificate_key /tmp/workspace-e2e.key;
              ssl_protocols TLSv1.2 TLSv1.3;

              location /ws {
                proxy_pass http://127.0.0.1:27800;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $http_host;
                proxy_set_header Origin $http_origin;
                proxy_read_timeout 60s;
              }

              location / {
                proxy_pass http://127.0.0.1:8080;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
              }
            }
          }
          NGINX
          sudo nginx -c /tmp/workspace-e2e-nginx.conf
          for i in {1..20}; do
            if curl -kfsS https://127.0.0.1:8443/auth/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/workspace-e2e-nginx-error.log || true
          exit 1

      - name: Run Chromium HTTPS/WSS smoke
        shell: bash
        env:
          E2E_BASE_URL: https://127.0.0.1:8443
          E2E_ALICE_USER: e2e_alice
          E2E_ALICE_PASSWORD: E2eAlicePass123!
          E2E_BOB_USER: e2e_bob
          E2E_BOB_PASSWORD: E2eBobPass123!
          E2E_BOB_UID: 22222222-2222-4222-8222-222222222222
        run: node tests/e2e/browser-smoke.mjs

      - name: Verify realtime database result
        shell: bash
        run: |
          set -euo pipefail
          DIALOGS=$(mysql -N -h 127.0.0.1 -uroot -proot notes_browser_e2e -e "SELECT COUNT(*) FROM dialogs WHERE type='private';")
          MESSAGES=$(mysql -N -h 127.0.0.1 -uroot -proot notes_browser_e2e -e "SELECT COUNT(*) FROM messages WHERE message_type='text' AND is_deleted=0;")
          test "$DIALOGS" -ge 1
          test "$MESSAGES" -ge 1

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- PHP ---'
          cat /tmp/workspace-http.log || true
          echo '--- Workerman start ---'
          cat /tmp/workspace-ws-start.log || true
          echo '--- Application / Workerman log ---'
          cat /tmp/workspace-browser-private/logs/app.log || true
          echo '--- Nginx error ---'
          cat /tmp/workspace-e2e-nginx-error.log || true
          echo '--- Nginx access ---'
          tail -n 100 /tmp/workspace-e2e-nginx-access.log || true

      - name: Stop local processes
        if: always()
        shell: bash
        run: |
          php ws_server/server.php stop >/dev/null 2>&1 || true
          if [[ -f /tmp/workspace-e2e-nginx.conf ]]; then
            sudo nginx -c /tmp/workspace-e2e-nginx.conf -s stop >/dev/null 2>&1 || true
          fi
          if [[ -f /tmp/workspace-http.pid ]]; then
            kill "$(cat /tmp/workspace-http.pid)" >/dev/null 2>&1 || true
          fi
