name: Admin browser lifecycle

on:
  push:
    branches: [usable-baseline-0.12-phase8]
  pull_request:
    branches: [master, usable-baseline-0.12-phase7]

permissions:
  contents: read

jobs:
  admin-browser-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admin_browser_lifecycle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l app/controllers/Admin/AdminController.php
          php -l app/controllers/Admin/SettingsController.php
          php -l app/services/PermissionService.php
          php -l app/services/AdminUserService.php
          php -l app/services/StorageQuotaService.php
          php -l app/middlewares/RequirePermission.php
          php -l app/middlewares/RequireAdminAccess.php
          php -l app/middlewares/RequireAdminUsersManage.php
          php -l app/middlewares/RequireAdminSettingsManage.php
          php -l tests/e2e/router.php
          node --check tests/e2e/admin-lifecycle.mjs
          grep -Fq 'RequireAdminAccess::class' core/routerConfig.php
          grep -Fq 'RequireAdminUsersManage::class' core/routerConfig.php
          grep -Fq 'RequireAdminSettingsManage::class' core/routerConfig.php
          ! grep -Fq 'IsAdmin::class' core/routerConfig.php
          grep -Fq 'src="{$base_url}/assets/js/admin-page.js"' app/views/admin-page/index.tpl
          ! grep -Fq 'src="/assets/js/admin-page.js"' app/views/admin-page/index.tpl

      - name: Prepare canonical database
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot admin_browser_lifecycle < database/messenger_schema.sql
          mysql -h 127.0.0.1 -uroot -proot admin_browser_lifecycle < database/notes_schema.sql
          mysql -h 127.0.0.1 -uroot -proot admin_browser_lifecycle < database/file_manager_schema.sql
          mysql -h 127.0.0.1 -uroot -proot admin_browser_lifecycle < database/user_fields_schema.sql
          mysql -h 127.0.0.1 -uroot -proot admin_browser_lifecycle < database/tasks_schema.sql
          mysql -h 127.0.0.1 -uroot -proot admin_browser_lifecycle < database/access_control_schema.sql
          mysql -h 127.0.0.1 -uroot -proot admin_browser_lifecycle < database/settings_schema.sql
          mysql -h 127.0.0.1 -uroot -proot admin_browser_lifecycle < database/module_lifecycle_schema.sql

      - name: Seed admin, target user and environment
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: admin_browser_lifecycle
        run: |
          set -euo pipefail
          TEST_PASSWORD="$(php -r 'echo bin2hex(random_bytes(18));')"
          APP_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          MESSAGE_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          TICKET_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          echo "::add-mask::$TEST_PASSWORD"
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$MESSAGE_KEY"
          echo "::add-mask::$TICKET_KEY"
          export TEST_PASSWORD

          php <<'PHP'
          <?php
          declare(strict_types=1);
          $pdo = new PDO(
              sprintf('mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4', getenv('DBHOST'), getenv('DBPORT'), getenv('DBNAME')),
              getenv('DBUSER'),
              getenv('DBPASS'),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $stmt = $pdo->prepare(
              'INSERT INTO users (uid,username,email,password_hash,firstname,lastname,role,is_active,created_at,updated_at) '
              . 'VALUES (:uid,:username,:email,:password_hash,:firstname,:lastname,:role,1,NOW(),NOW())'
          );
          $hash = password_hash((string) getenv('TEST_PASSWORD'), PASSWORD_ARGON2ID);
          $stmt->execute([
              ':uid' => 'ba5e0000-0000-4000-8000-000000000018',
              ':username' => 'admin-lifecycle-user',
              ':email' => 'admin-lifecycle@example.test',
              ':password_hash' => $hash,
              ':firstname' => 'Admin',
              ':lastname' => 'Lifecycle',
              ':role' => 111,
          ]);
          $stmt->execute([
              ':uid' => 'ba5e0000-0000-4000-8000-000000000019',
              ':username' => 'admin-target-user',
              ':email' => 'admin-target@example.test',
              ':password_hash' => $hash,
              ':firstname' => 'Target',
              ':lastname' => 'User',
              ':role' => 888,
          ]);
          PHP

          rm -rf /tmp/workspace-admin-browser
          mkdir -p /tmp/workspace-admin-browser/logs compile cache
          chmod 700 /tmp/workspace-admin-browser /tmp/workspace-admin-browser/logs
          rm -f /tmp/workspace-organizer-startup.log

          cat > .env <<ENV
          DBDRIVER=mysql
          DBHOST=127.0.0.1
          DBPORT=3306
          DBUSER=root
          DBPASS=root
          DBNAME=admin_browser_lifecycle
          UNIQUE_KEY=${APP_KEY}
          MSG_SECRET_KEY=${MESSAGE_KEY}
          WS_TICKET_SECRET=${TICKET_KEY}
          PRIVATE_STORAGE_PATH=/tmp/workspace-admin-browser
          RATE_LIMIT_STORAGE_PATH=/tmp/workspace-admin-browser/rate-limit
          SITEURL=http://127.0.0.1:18093
          BASE_PATH=/workspace/
          WS_HOST=127.0.0.1
          WS_PORT=27806
          WS_PUBLIC_URL=ws://127.0.0.1:27806/workspace/ws
          WS_ALLOWED_ORIGINS=http://127.0.0.1:18093
          AUTH_RATE_LIMIT_ATTEMPTS=50
          AUTH_RATE_LIMIT_WINDOW_SECONDS=60
          UPLOAD_RATE_LIMIT_ATTEMPTS=100
          UPLOAD_RATE_LIMIT_WINDOW_SECONDS=60
          LOG_LEVEL=INFO
          LOG_FILE=/tmp/workspace-admin-browser/logs/app.log
          CSRF_ENABLED=true
          ENV
          chmod 600 .env

          printf 'E2E_USER=%s\n' 'admin-lifecycle-user' >> "$GITHUB_ENV"
          printf 'E2E_TARGET_USER=%s\n' 'admin-target-user' >> "$GITHUB_ENV"
          printf 'E2E_PASSWORD=%s\n' "$TEST_PASSWORD" >> "$GITHUB_ENV"

      - name: Start subdirectory application
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/workspace-admin-browser-http.log
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:18093 tests/e2e/router.php >/tmp/workspace-admin-browser-http.log 2>&1 &
          echo $! >/tmp/workspace-admin-browser-http.pid
          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18093/workspace/auth/login/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [[ "$READY" != '1' ]]; then
            cat /tmp/workspace-admin-browser-http.log >&2
            exit 1
          fi

      - name: Run Admin lifecycle in Chromium
        shell: bash
        env:
          E2E_ORIGIN: http://127.0.0.1:18093
          E2E_BASE_PATH: /workspace
        run: node tests/e2e/admin-lifecycle.mjs

      - name: Verify durable Admin lifecycle state
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ID="$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_browser_lifecycle -e "SELECT id FROM users WHERE username='admin-target-user'")"
          test -n "$TARGET_ID"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_browser_lifecycle -e "SELECT CONCAT(role,'|',is_active,'|',account_status) FROM users WHERE id=${TARGET_ID}")" = '888|1|active'
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_browser_lifecycle -e "SELECT quota_bytes FROM user_storage_quotas WHERE user_id=${TARGET_ID}")" = '26214400'
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_browser_lifecycle -e "SELECT CONCAT(role,'|',is_active,'|',account_status) FROM users WHERE username='admin-lifecycle-user'")" = '111|1|active'
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot admin_browser_lifecycle -e "SELECT COUNT(*) FROM user_roles ur JOIN roles r ON r.id=ur.role_id JOIN users u ON u.id=ur.user_id WHERE u.username='admin-lifecycle-user' AND r.code='admin'")" = '1'

      - name: Verify clean PHP runtime log
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'PHP (Warning|Fatal error|Parse error)|Uncaught ' /tmp/workspace-admin-browser-http.log /tmp/workspace-organizer-startup.log 2>/dev/null; then
            echo 'PHP runtime warning/fatal detected during Admin browser lifecycle' >&2
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- PHP server ---'
          cat /tmp/workspace-admin-browser-http.log || true
          echo '--- PHP startup/application errors ---'
          cat /tmp/workspace-organizer-startup.log || true
          echo '--- application log ---'
          cat /tmp/workspace-admin-browser/logs/app.log || true

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/workspace-admin-browser-http.pid ]]; then
            PID="$(cat /tmp/workspace-admin-browser-http.pid)"
            pkill -TERM -P "$PID" >/dev/null 2>&1 || true
            kill "$PID" >/dev/null 2>&1 || true
          fi
