name: Tasks contract

on:
  pull_request:
    branches: ['1.0']
    paths:
      - 'modules/tasks/**'
      - 'database/tasks_schema.sql'
      - 'tests/integration/native_tasks_contract.php'
      - 'tests/integration/tasks_acl_contract.php'
      - '.github/workflows/tasks-contract.yml'
  push:
    branches: ['1.0']
    paths:
      - 'modules/tasks/**'
      - 'database/tasks_schema.sql'
      - 'tests/integration/native_tasks_contract.php'
      - 'tests/integration/tasks_acl_contract.php'

permissions:
  contents: read

jobs:
  tasks-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tasks_contract_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli
          coverage: none

      - name: Prove vendor-free isolated Tasks runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor
          test ! -e vendor
          ! grep -R -Fq 'vendor/autoload.php' modules/tasks tests/integration/tasks_acl_contract.php
          find modules/tasks -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/integration/native_tasks_contract.php
          php -l tests/integration/tasks_acl_contract.php
          php tests/integration/native_tasks_contract.php

      - name: Verify canonical Tasks schema
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot tasks_contract_test < database/messenger_schema.sql
          mysql -h 127.0.0.1 -uroot -proot tasks_contract_test < database/tasks_schema.sql
          TABLES="$(mysql -N -h 127.0.0.1 -uroot -proot tasks_contract_test -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('tasks','subtasks','task_categories','task_category_relations','task_reminders')")"
          test "$TABLES" = '5'
          UID_TYPE="$(mysql -N -h 127.0.0.1 -uroot -proot tasks_contract_test -e \
            "SELECT COLUMN_TYPE FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='tasks' AND column_name='uid'")"
          test "$UID_TYPE" = 'char(32)'
          UNIQUE_REL="$(mysql -N -h 127.0.0.1 -uroot -proot tasks_contract_test -e \
            "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='task_category_relations' AND index_name='uq_task_category_relation' AND non_unique=0")"
          test "$UNIQUE_REL" = '2'

      - name: Verify Tasks ACL and state transitions
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: tasks_contract_test
        run: php tests/integration/tasks_acl_contract.php
