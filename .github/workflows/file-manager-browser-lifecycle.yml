name: File Manager browser lifecycle

on:
  push:
    branches: [usable-baseline-0.12-phase6]
  pull_request:
    branches: [master, usable-baseline-0.12-phase5]

permissions:
  contents: read

jobs:
  file-manager-browser-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: file_manager_browser_lifecycle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l app/controllers/FileController.php
          php -l app/controllers/FileDeleteController.php
          php -l app/controllers/FileQuotaController.php
          php -l tests/e2e/router.php
          node --check assets/js/file-manager-polish.js
          node --check tests/e2e/file-manager-lifecycle.mjs
          node --check tests/e2e/file-manager-ux-contract.mjs
          grep -Fq "route_path name='files_quota'" app/views/file_manager/index.tpl
          grep -Fq 'assets/js/file-manager-polish.js' app/views/core/base.tpl
          ! grep -Fq 'href="/files/' app/views/file_manager/index.tpl
          ! grep -Fq 'src="/assets/' app/views/file_manager/index.tpl

      - name: Prepare canonical database
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle < database/messenger_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle < database/notes_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle < database/file_manager_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle < database/user_fields_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle < database/tasks_schema.sql
          mysql -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle < database/settings_schema.sql

      - name: Seed browser user, quota and environment
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: file_manager_browser_lifecycle
        run: |
          set -euo pipefail
          TEST_PASSWORD="$(php -r 'echo bin2hex(random_bytes(18));')"
          APP_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          MESSAGE_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          TICKET_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          echo "::add-mask::$TEST_PASSWORD"
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$MESSAGE_KEY"
          echo "::add-mask::$TICKET_KEY"
          export TEST_PASSWORD

          php <<'PHP'
          <?php
          declare(strict_types=1);
          $pdo = new PDO(
              sprintf('mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4', getenv('DBHOST'), getenv('DBPORT'), getenv('DBNAME')),
              getenv('DBUSER'),
              getenv('DBPASS'),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $stmt = $pdo->prepare(
              'INSERT INTO users (uid,username,email,password_hash,firstname,lastname,role,is_active,created_at,updated_at) '
              . 'VALUES (:uid,:username,:email,:password_hash,:firstname,:lastname,888,1,NOW(),NOW())'
          );
          $stmt->execute([
              ':uid' => 'ba5e0000-0000-4000-8000-000000000016',
              ':username' => 'file-manager-lifecycle-user',
              ':email' => 'file-manager-lifecycle@example.test',
              ':password_hash' => password_hash((string) getenv('TEST_PASSWORD'), PASSWORD_ARGON2ID),
              ':firstname' => 'File',
              ':lastname' => 'Lifecycle',
          ]);
          $userId = (int) $pdo->lastInsertId();
          $quota = 10485760;
          $filler = $quota - 4096;
          $pdo->prepare('INSERT INTO user_storage_quotas (user_id,quota_bytes) VALUES (?,?)')->execute([$userId, $quota]);
          $pdo->prepare(
              'INSERT INTO user_files (uid,user_id,parent_id,name,type,mime_type,size,path,extension,is_deleted) '
              . 'VALUES (?,?,?,?,?,?,?,?,?,0)'
          )->execute(['fm-browser-quota-filler', $userId, null, 'quota-filler', 'file', 'application/octet-stream', $filler, null, 'bin']);
          PHP

          rm -rf /tmp/workspace-file-manager-browser
          mkdir -p /tmp/workspace-file-manager-browser/logs compile cache
          chmod 700 /tmp/workspace-file-manager-browser /tmp/workspace-file-manager-browser/logs
          rm -f /tmp/workspace-organizer-startup.log

          cat > .env <<ENV
          DBDRIVER=mysql
          DBHOST=127.0.0.1
          DBPORT=3306
          DBUSER=root
          DBPASS=root
          DBNAME=file_manager_browser_lifecycle
          UNIQUE_KEY=${APP_KEY}
          MSG_SECRET_KEY=${MESSAGE_KEY}
          WS_TICKET_SECRET=${TICKET_KEY}
          PRIVATE_STORAGE_PATH=/tmp/workspace-file-manager-browser
          RATE_LIMIT_STORAGE_PATH=/tmp/workspace-file-manager-browser/rate-limit
          SITEURL=http://127.0.0.1:18091
          BASE_PATH=/workspace/
          WS_HOST=127.0.0.1
          WS_PORT=27804
          WS_PUBLIC_URL=ws://127.0.0.1:27804/workspace/ws
          WS_ALLOWED_ORIGINS=http://127.0.0.1:18091
          AUTH_RATE_LIMIT_ATTEMPTS=50
          AUTH_RATE_LIMIT_WINDOW_SECONDS=60
          UPLOAD_RATE_LIMIT_ATTEMPTS=100
          UPLOAD_RATE_LIMIT_WINDOW_SECONDS=60
          MAX_UPLOAD_SIZE=10485760
          LOG_LEVEL=INFO
          LOG_FILE=/tmp/workspace-file-manager-browser/logs/app.log
          CSRF_ENABLED=true
          ENV
          chmod 600 .env

          printf 'E2E_USER=%s\n' 'file-manager-lifecycle-user' >> "$GITHUB_ENV"
          printf 'E2E_PASSWORD=%s\n' "$TEST_PASSWORD" >> "$GITHUB_ENV"

      - name: Start subdirectory application
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/workspace-file-manager-browser-http.log
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:18091 tests/e2e/router.php >/tmp/workspace-file-manager-browser-http.log 2>&1 &
          echo $! >/tmp/workspace-file-manager-browser-http.pid
          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18091/workspace/auth/login/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [[ "$READY" != '1' ]]; then
            cat /tmp/workspace-file-manager-browser-http.log >&2
            exit 1
          fi

      - name: Run File Manager 0.13 UX contract
        shell: bash
        env:
          E2E_ORIGIN: http://127.0.0.1:18091
          E2E_BASE_PATH: /workspace
        run: node tests/e2e/file-manager-ux-contract.mjs

      - name: Run File Manager lifecycle in Chromium
        shell: bash
        env:
          E2E_ORIGIN: http://127.0.0.1:18091
          E2E_BASE_PATH: /workspace
        run: node tests/e2e/file-manager-lifecycle.mjs

      - name: Verify durable File Manager lifecycle state
        shell: bash
        run: |
          set -euo pipefail
          USER_ID="$(mysql -N -B -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle -e "SELECT id FROM users WHERE username='file-manager-lifecycle-user'")"
          test -n "$USER_ID"
          FOLDER_DELETED="$(mysql -N -B -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle -e "SELECT is_deleted FROM user_files WHERE user_id=${USER_ID} AND name LIKE 'FM lifecycle %' AND type='folder' LIMIT 1")"
          test "$FOLDER_DELETED" = '1'
          FILE_ROW="$(mysql -N -B -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle -e "SELECT CONCAT(is_deleted,'|',path) FROM user_files WHERE user_id=${USER_ID} AND name LIKE 'fm-renamed-%' AND extension='txt' LIMIT 1")"
          FILE_DELETED="${FILE_ROW%%|*}"
          FILE_PATH="${FILE_ROW#*|}"
          test "$FILE_DELETED" = '1'
          test -n "$FILE_PATH"
          test ! -f "$FILE_PATH"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle -e "SELECT COUNT(*) FROM user_files WHERE user_id=${USER_ID} AND name LIKE 'fm-overflow-%'")" = '0'
          test "$(mysql -N -B -h 127.0.0.1 -uroot -proot file_manager_browser_lifecycle -e "SELECT COALESCE(SUM(size),0) FROM user_files WHERE user_id=${USER_ID} AND is_deleted=0 AND type <> 'folder'")" = '10481664'

      - name: Verify clean PHP runtime log
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'PHP (Warning|Fatal error|Parse error)|Uncaught ' /tmp/workspace-file-manager-browser-http.log /tmp/workspace-organizer-startup.log 2>/dev/null; then
            echo 'PHP runtime warning/fatal detected during File Manager browser lifecycle' >&2
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- PHP server ---'
          cat /tmp/workspace-file-manager-browser-http.log || true
          echo '--- PHP startup/application errors ---'
          cat /tmp/workspace-organizer-startup.log || true
          echo '--- application log ---'
          cat /tmp/workspace-file-manager-browser/logs/app.log || true

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/workspace-file-manager-browser-http.pid ]]; then
            PID="$(cat /tmp/workspace-file-manager-browser-http.pid)"
            pkill -TERM -P "$PID" >/dev/null 2>&1 || true
            kill "$PID" >/dev/null 2>&1 || true
          fi
