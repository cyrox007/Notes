name: 0.14 beta.4 compatibility baseline

on:
  pull_request:
    branches: [master, '1.0']
  push:
    branches: [0.14-beta4-role-policies-collaboration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta4-compatibility-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint Beta4 compatibility contract
        run: php -l tests/integration/beta_readiness_014.php

      - name: Verify preserved Beta4 upgrade baseline
        run: php tests/integration/beta_readiness_014.php
