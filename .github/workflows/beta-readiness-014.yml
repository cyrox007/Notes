name: 0.14 beta readiness

on:
  push:
    branches: [0.14-beta4-role-policies-collaboration]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  beta-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint beta readiness contract
        run: php -l tests/integration/beta_readiness_014.php

      - name: Verify Workspace 0.14 beta.4 baseline
        run: php tests/integration/beta_readiness_014.php
