name: Apply runtime floor patch

on:
  push:
    branches: [0.14-system-requirements-php81]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-floor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 0.14-system-requirements-php81

      - name: Align runtime requirements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'README.md': [
                  ('- PHP `8.3+`;', '- PHP `8.1+` — технический compatibility floor; для Internet-facing production рекомендуется поддерживаемая ветка PHP, сейчас `8.3+`;'),
                  ('- PHP extensions: `mysqli`, `pdo_mysql`, `mbstring`, `fileinfo`, `sodium`, `gd`;', '- PHP extensions: `mysqli`, `pdo_mysql`, `mbstring`, `fileinfo`, `sodium`, `gd`;\n- для realtime Messenger/Workerman: POSIX-compatible host, PHP CLI, `pcntl`, `posix`, long-running process и WebSocket reverse proxy;'),
                  ('- проверяет PHP 8.3, extensions, Argon2id и наличие production `vendor/`;', '- проверяет PHP 8.1+, extensions, Argon2id и наличие production `vendor/`;'),
              ],
              'docs/HOSTING_INSTALL.md': [
                  ('- PHP 8.3+;', '- PHP 8.1+ как технический минимум; для публичного production рекомендуется поддерживаемая ветка PHP, сейчас 8.3+;'),
                  ('- для realtime Messenger — возможность держать долгоживущий PHP/Workerman process и проксировать `/ws`.', '- для realtime Messenger — POSIX-compatible host, PHP CLI extensions `pcntl` и `posix`, возможность держать долгоживущий PHP/Workerman process и проксировать `/ws`.'),
              ],
              'docs/PRODUCTION.md': [
                  ('- PHP 8.3+;', '- PHP 8.1+ как технический compatibility floor; для Internet-facing production используйте поддерживаемую ветку PHP, сейчас рекомендуется 8.3+;'),
                  ('- WSS reverse proxy;', '- WSS reverse proxy;\n- для Workerman runtime: POSIX-compatible OS, PHP CLI, extensions `pcntl` и `posix`;'),
              ],
              'install.php': [
                  ("'PHP 8.3+' => version_compare(PHP_VERSION, '8.3.0', '>='),", "'PHP 8.1+' => version_compare(PHP_VERSION, '8.1.0', '>='),"),
              ],
              'bin/healthcheck.php': [
                  ("recordHealth($checks, $failed, 'php_version', version_compare(PHP_VERSION, '8.3.0', '>='), PHP_VERSION);", "recordHealth($checks, $failed, 'php_version', version_compare(PHP_VERSION, '8.1.0', '>='), PHP_VERSION . ' (technical floor 8.1; production 8.3+ recommended)');"),
              ],
              '.github/workflows/hosting-installer.yml': [
                  ('- name: Setup PHP 8.3', '- name: Setup PHP 8.1'),
                  ("php-version: '8.3'", "php-version: '8.1'"),
                  ("grep -Fq 'PHP 8.3+' install.php", "grep -Fq 'PHP 8.1+' install.php"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one occurrence of {old!r}, got {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          git rm .github/workflows/apply-runtime-floor-patch.yml

      - name: Commit audited requirement alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/HOSTING_INSTALL.md docs/PRODUCTION.md install.php bin/healthcheck.php .github/workflows/hosting-installer.yml .github/workflows/apply-runtime-floor-patch.yml
          git commit -m '0.14: align minimum runtime to PHP 8.1 [runtime-floor-applied]'
          git push origin HEAD:0.14-system-requirements-php81
