name: One-shot Tasks isolation migration

on:
  push:
    branches: ['1.0-module-tasks-isolation']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0-module-tasks-isolation
          fetch-depth: 0

      - name: Move Tasks behind isolated runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modules/tasks/{controllers,models,services,middlewares,views/elements/task_item,assets}

          git mv app/controllers/TaskController.php modules/tasks/controllers/TaskController.php
          git mv app/controllers/TaskBoardController.php modules/tasks/controllers/TaskBoardController.php
          git mv app/services/TaskBoardService.php modules/tasks/services/TaskBoardService.php
          git mv app/models/TaskModel.php modules/tasks/models/TaskModel.php
          git mv app/models/SubtaskModel.php modules/tasks/models/SubtaskModel.php
          git mv app/models/TaskCategoryModel.php modules/tasks/models/TaskCategoryModel.php
          git mv app/models/TaskCategoryRelationModel.php modules/tasks/models/TaskCategoryRelationModel.php
          git mv app/models/TaskReminderModel.php modules/tasks/models/TaskReminderModel.php
          git mv app/middlewares/RequireTasksUse.php modules/tasks/middlewares/RequireTasksUse.php
          git mv app/middlewares/EnforceTaskCreatePolicy.php modules/tasks/middlewares/EnforceTaskCreatePolicy.php

          git mv app/views/tasks_page/index.php modules/tasks/views/index.php
          git mv app/views/tasks_page/boards.php modules/tasks/views/boards.php
          git mv 'app/views/^elements/task_item/index.php' modules/tasks/views/elements/task_item/index.php
          git mv app/views/tasks_page/style.css modules/tasks/assets/style.css
          git mv app/views/tasks_page/boards.css modules/tasks/assets/boards.css
          git mv app/views/tasks_page/hardening.css modules/tasks/assets/hardening.css
          git mv app/views/tasks_page/kanban.css modules/tasks/assets/kanban.css
          git mv app/views/tasks_page/kanban-handle.css modules/tasks/assets/kanban-handle.css
          git mv assets/js/tasks-page.js modules/tasks/assets/tasks-page.js
          git mv assets/js/tasks-kanban.js modules/tasks/assets/tasks-kanban.js
          git mv assets/js/task-boards.js modules/tasks/assets/task-boards.js
          git mv assets/js/task-boards-nav.js modules/tasks/assets/task-boards-nav.js

          rm -f app/views/tasks_page/index.tpl app/views/tasks_page/boards.tpl 'app/views/^elements/task_item/index.tpl'

          cat > modules/tasks/TasksCapability.php <<'PHP'
          <?php
          declare(strict_types=1);

          namespace Modules\Tasks;

          /**
           * Marker/service exported as `workspace.tasks`.
           * Cross-module consumers resolve this capability instead of reaching
           * into Tasks controllers/models/services directly.
           */
          final class TasksCapability
          {
              public function moduleId(): string
              {
                  return 'tasks';
              }
          }
          PHP

          cat > modules/tasks/TasksRuntimeProvider.php <<'PHP'
          <?php
          declare(strict_types=1);

          namespace Modules\Tasks;

          use App\Controllers\TaskBoardController;
          use App\Controllers\TaskController;
          use App\Middlewares\CSRFMiddleware;
          use App\Middlewares\EnforceTaskCreatePolicy;
          use App\Middlewares\LoginRequared;
          use App\Middlewares\RequireTasksUse;
          use Core\ModuleRuntimeProvider;
          use Core\Router;

          final class TasksRuntimeProvider implements ModuleRuntimeProvider
          {
              private TasksCapability $capability;

              public function __construct()
              {
                  $this->capability = new TasksCapability();
              }

              public function moduleId(): string
              {
                  return 'tasks';
              }

              public function boot(): void
              {
                  // Module-owned classes are loaded explicitly by runtime.php.
              }

              /** @return array<string,object> */
              public function capabilities(): array
              {
                  return ['workspace.tasks' => $this->capability];
              }

              public function registerRoutes(Router $router): void
              {
                  $router->group('/tasks')
                      ->add('GET', '/', [TaskController::class, 'index'], [LoginRequared::class, RequireTasksUse::class], 'tasks')
                      ->add('POST', '/', [TaskController::class, 'create'], [LoginRequared::class, RequireTasksUse::class, EnforceTaskCreatePolicy::class], 'task_create')
                      ->add('GET', '/boards', [TaskBoardController::class, 'index'], [LoginRequared::class, RequireTasksUse::class], 'task_boards')
                      ->add('POST', '/boards', [TaskBoardController::class, 'createBoard'], [LoginRequared::class, RequireTasksUse::class, CSRFMiddleware::class], 'task_board_create')
                      ->add('POST', '/boards/{str:uid}/members', [TaskBoardController::class, 'saveMembers'], [LoginRequared::class, RequireTasksUse::class, CSRFMiddleware::class], 'task_board_members')
                      ->add('POST', '/boards/{str:uid}/tasks', [TaskBoardController::class, 'createTask'], [LoginRequared::class, RequireTasksUse::class, CSRFMiddleware::class], 'task_board_task_create')
                      ->add('POST', '/boards/task/{str:uid}/update', [TaskBoardController::class, 'updateTask'], [LoginRequared::class, RequireTasksUse::class, CSRFMiddleware::class], 'task_board_task_update')
                      ->add('POST', '/boards/task/{str:uid}/delete', [TaskBoardController::class, 'deleteTask'], [LoginRequared::class, RequireTasksUse::class, CSRFMiddleware::class], 'task_board_task_delete')
                      ->add('POST', '/{str:uid}/update', [TaskController::class, 'update'], [LoginRequared::class, RequireTasksUse::class], 'update_task')
                      ->add('POST', '/{str:uid}/delete', [TaskController::class, 'delete'], [LoginRequared::class, RequireTasksUse::class], 'delete_task')
                      ->add('POST', '/{str:taskUid}/subtask', [TaskController::class, 'addSubtask'], [LoginRequared::class, RequireTasksUse::class], 'add_subtask')
                      ->add('POST', '/subtask/{int:subtaskId}/toggle', [TaskController::class, 'toggleSubtask'], [LoginRequared::class, RequireTasksUse::class], 'toggle_subtask')
                      ->add('POST', '/subtask/{int:subtaskId}/delete', [TaskController::class, 'deleteSubtask'], [LoginRequared::class, RequireTasksUse::class], 'delete_subtask')
                      ->add('POST', '/category', [TaskController::class, 'createCategory'], [LoginRequared::class, RequireTasksUse::class], 'create_category')
                      ->add('POST', '/{str:taskUid}/category/{int:categoryId}', [TaskController::class, 'attachCategory'], [LoginRequared::class, RequireTasksUse::class], 'attach_category')
                      ->add('DELETE', '/{str:taskUid}/category/{int:categoryId}', [TaskController::class, 'detachCategory'], [LoginRequared::class, RequireTasksUse::class], 'detach_category')
                      ->endGroup();
              }
          }
          PHP

          cat > modules/tasks/runtime.php <<'PHP'
          <?php
          declare(strict_types=1);

          $root = __DIR__;
          $files = [
              '/models/TaskModel.php',
              '/models/SubtaskModel.php',
              '/models/TaskCategoryModel.php',
              '/models/TaskCategoryRelationModel.php',
              '/models/TaskReminderModel.php',
              '/services/TaskBoardService.php',
              '/middlewares/RequireTasksUse.php',
              '/middlewares/EnforceTaskCreatePolicy.php',
              '/controllers/TaskController.php',
              '/controllers/TaskBoardController.php',
              '/TasksCapability.php',
              '/TasksRuntimeProvider.php',
          ];

          foreach ($files as $file) {
              $path = $root . $file;
              if (!is_file($path) || is_link($path)) {
                  throw new RuntimeException('Tasks runtime file is missing or unsafe: ' . $file);
              }
              require_once $path;
          }

          return new \Modules\Tasks\TasksRuntimeProvider();
          PHP

          python3 <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: marker not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('modules/tasks/controllers/TaskController.php', "render_template('tasks_page/index'", "render_template('@tasks/index'", 'task controller view')
          replace_once('modules/tasks/controllers/TaskBoardController.php', "render_template('tasks_page/boards'", "render_template('@tasks/boards'", 'board controller view')

          index = Path('modules/tasks/views/index.php')
          text = index.read_text(encoding='utf-8')
          text = text.replace("partial('^elements/task_item/index'", "partial('@tasks/elements/task_item/index'", 1)
          text = text.replace("<script src=\"<?= $view->e($baseUrl) ?>/assets/js/tasks-page.js\" defer></script>\n", '')
          marker = "    'socket_url' => $socket_url ?? '',\n], $content);"
          replacement = "    'socket_url' => $socket_url ?? '',\n    'module_styles' => [\n        $view->moduleAsset('tasks', 'style.css'),\n        $view->moduleAsset('tasks', 'hardening.css'),\n        $view->moduleAsset('tasks', 'kanban.css'),\n        $view->moduleAsset('tasks', 'kanban-handle.css'),\n    ],\n    'module_scripts' => [\n        $view->moduleAsset('tasks', 'tasks-page.js'),\n        $view->moduleAsset('tasks', 'tasks-kanban.js'),\n        $view->moduleAsset('tasks', 'task-boards-nav.js'),\n    ],\n], $content);"
          if marker not in text:
              raise SystemExit('Tasks index layout marker not found')
          index.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          boards = Path('modules/tasks/views/boards.php')
          text = boards.read_text(encoding='utf-8')
          start = "$boardsCss = '';\n$cssPath = __DIR__ . '/boards.css';\nif (is_file($cssPath) && is_readable($cssPath)) {\n    $css = file_get_contents($cssPath);\n    if (is_string($css)) $boardsCss = $css;\n}\n\n"
          text = text.replace(start, '')
          text = text.replace("<?php if ($boardsCss !== ''): ?><style><?= $boardsCss ?></style><?php endif; ?>\n", '')
          text = text.replace("<script src=\"<?= $view->e($baseUrl) ?>/assets/js/task-boards.js\" defer></script>\n", '')
          marker = "    'socket_url' => $socket_url ?? '',\n], $content);"
          replacement = "    'socket_url' => $socket_url ?? '',\n    'module_styles' => [\n        $view->moduleAsset('tasks', 'style.css'),\n        $view->moduleAsset('tasks', 'hardening.css'),\n        $view->moduleAsset('tasks', 'boards.css'),\n    ],\n    'module_scripts' => [\n        $view->moduleAsset('tasks', 'task-boards.js'),\n        $view->moduleAsset('tasks', 'task-boards-nav.js'),\n    ],\n], $content);"
          if marker not in text:
              raise SystemExit('Tasks boards layout marker not found')
          boards.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          base = Path('app/views/core/base.php')
          text = base.read_text(encoding='utf-8')
          for line in [
              "    'tasks_page/style.css',\n",
              "    'tasks_page/hardening.css',\n",
              "    'tasks_page/kanban.css',\n",
              "    'tasks_page/kanban-handle.css',\n",
              "    <script src=\"<?= $view->e($baseUrl) ?>/assets/js/tasks-kanban.js\" defer></script>\n",
              "    <script src=\"<?= $view->e($baseUrl) ?>/assets/js/task-boards-nav.js\" defer></script>\n",
          ]:
              if line not in text:
                  raise SystemExit('base Tasks asset marker not found: ' + line.strip())
              text = text.replace(line, '', 1)
          base.write_text(text, encoding='utf-8')

          styles = Path('app/views/styles.css')
          text = styles.read_text(encoding='utf-8')
          for line in [
              '{include file="tasks_page/style.css"}\n',
              '{include file="tasks_page/hardening.css"}\n',
              '{include file="tasks_page/kanban.css"}\n',
              '{include file="tasks_page/kanban-handle.css"}\n',
              '{* Tasks board is intentionally module-specific and loads after shared polish. *}\n',
          ]:
              text = text.replace(line, '')
          styles.write_text(text, encoding='utf-8')

          manifest_path = Path('modules/tasks/module.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['runtime'] = {'mode': 'isolated', 'entrypoint': 'runtime.php'}
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          router = Path('core/routerConfig.php')
          text = router.read_text(encoding='utf-8')
          for use_line in [
              'use App\\Controllers\\TaskController;\n',
              'use App\\Controllers\\TaskBoardController;\n',
              'use App\\Middlewares\\RequireTasksUse;\n',
              'use App\\Middlewares\\EnforceTaskCreatePolicy;\n',
          ]:
              if use_line not in text:
                  raise SystemExit('Tasks router import not found: ' + use_line.strip())
              text = text.replace(use_line, '', 1)
          start = text.find("$router->group('/tasks')")
          end_marker = "    ->endGroup();\n\n$router->group('/profile')"
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Tasks route group not found')
          text = text[:start] + "$router->group('/profile')" + text[end + len(end_marker):]
          router.write_text(text, encoding='utf-8')

          contract = Path('tests/integration/native_tasks_contract.php')
          contract.write_text(r'''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);

          function nativeTasksAssert(bool $condition, string $message): void
          {
              if (!$condition) {
                  fwrite(STDERR, "[FAIL] {$message}\n");
                  exit(1);
              }
          }

          $moduleRoot = $root . '/modules/tasks';
          $views = [
              'modules/tasks/views/index.php',
              'modules/tasks/views/boards.php',
              'modules/tasks/views/elements/task_item/index.php',
          ];
          foreach ($views as $relative) {
              $path = $root . '/' . $relative;
              nativeTasksAssert(is_file($path), "missing isolated Tasks view: {$relative}");
              $source = (string) file_get_contents($path);
              nativeTasksAssert(!str_contains($source, '{extends'), "{$relative} still contains Smarty syntax");
              nativeTasksAssert(!str_contains($source, '$smarty'), "{$relative} still depends on Smarty runtime state");
          }

          foreach ([
              'app/controllers/TaskController.php',
              'app/controllers/TaskBoardController.php',
              'app/services/TaskBoardService.php',
              'app/middlewares/RequireTasksUse.php',
              'app/middlewares/EnforceTaskCreatePolicy.php',
              'app/views/tasks_page/index.php',
              'app/views/tasks_page/index.tpl',
              'app/views/tasks_page/boards.php',
              'app/views/tasks_page/boards.tpl',
              'app/views/^elements/task_item/index.php',
              'app/views/^elements/task_item/index.tpl',
              'assets/js/tasks-page.js',
              'assets/js/tasks-kanban.js',
              'assets/js/task-boards.js',
              'assets/js/task-boards-nav.js',
          ] as $legacy) {
              nativeTasksAssert(!file_exists($root . '/' . $legacy), "legacy Tasks runtime artifact remains: {$legacy}");
          }

          $manifest = json_decode((string) file_get_contents($moduleRoot . '/module.json'), true, 32, JSON_THROW_ON_ERROR);
          nativeTasksAssert(($manifest['runtime']['mode'] ?? '') === 'isolated', 'Tasks manifest is not isolated');
          nativeTasksAssert(($manifest['runtime']['entrypoint'] ?? '') === 'runtime.php', 'Tasks runtime entrypoint is missing');
          nativeTasksAssert(is_file($moduleRoot . '/runtime.php'), 'Tasks runtime.php is missing');
          nativeTasksAssert(is_file($moduleRoot . '/TasksRuntimeProvider.php'), 'Tasks provider is missing');
          nativeTasksAssert(is_file($moduleRoot . '/TasksCapability.php'), 'Tasks capability service is missing');

          $provider = (string) file_get_contents($moduleRoot . '/TasksRuntimeProvider.php');
          nativeTasksAssert(str_contains($provider, "return 'tasks';"), 'Tasks provider id drifted');
          nativeTasksAssert(str_contains($provider, "'workspace.tasks' =>"), 'Tasks runtime capability export missing');
          nativeTasksAssert(str_contains($provider, "group('/tasks')"), 'Tasks routes are not module-owned');
          foreach (['tasks', 'task_boards', 'task_board_task_update', 'create_category'] as $route) {
              nativeTasksAssert(str_contains($provider, "'{$route}'"), "Tasks provider route {$route} is missing");
          }

          $coreRoutes = (string) file_get_contents($root . '/core/routerConfig.php');
          nativeTasksAssert(!str_contains($coreRoutes, "group('/tasks')"), 'core router still owns Tasks routes');
          nativeTasksAssert(!str_contains($coreRoutes, 'TaskController'), 'core router still imports TaskController');

          $index = (string) file_get_contents($moduleRoot . '/views/index.php');
          nativeTasksAssert(str_contains($index, "$view->layout('core/base'"), 'Tasks page does not use native shell');
          nativeTasksAssert(str_contains($index, "partial('@tasks/elements/task_item/index'"), 'isolated task item partial is not used');
          nativeTasksAssert(str_contains($index, "moduleAsset('tasks', 'tasks-page.js')"), 'Tasks page JS is not module-owned');
          nativeTasksAssert(str_contains($index, "moduleAsset('tasks', 'style.css')"), 'Tasks page CSS is not module-owned');
          foreach (['task_create', 'create_category', 'task_boards'] as $route) {
              nativeTasksAssert(str_contains($index, "route('{$route}'"), "Tasks page route {$route} is missing");
          }
          nativeTasksAssert(str_contains($index, '$view->csrfInput()'), 'Tasks forms lost CSRF inputs');
          nativeTasksAssert(str_contains($index, 'data-shared-task-boards-link'), 'shared boards navigation hook is missing');

          $item = (string) file_get_contents($moduleRoot . '/views/elements/task_item/index.php');
          foreach (['delete_task', 'update_task'] as $route) {
              nativeTasksAssert(str_contains($item, "route('{$route}'"), "task item route {$route} is missing");
          }
          foreach (['task-status-toggle','task-complete-toggle','task-category-select','attach-category-btn','subtask-toggle','data-task-edit-panel'] as $hook) {
              nativeTasksAssert(str_contains($item, $hook), "task item DOM hook {$hook} is missing");
          }

          $boards = (string) file_get_contents($moduleRoot . '/views/boards.php');
          nativeTasksAssert(str_contains($boards, "moduleAsset('tasks', 'boards.css')"), 'shared boards CSS is not module-owned');
          nativeTasksAssert(str_contains($boards, "moduleAsset('tasks', 'task-boards.js')"), 'shared boards JS is not module-owned');
          foreach (['task_board_create', 'task_board_members', 'task_board_task_create', 'task_board_task_update', 'task_board_task_delete'] as $route) {
              nativeTasksAssert(str_contains($boards, "route('{$route}'"), "shared boards route {$route} is missing");
          }

          foreach (['tasks-page.js','tasks-kanban.js','task-boards.js','task-boards-nav.js','style.css','boards.css','hardening.css','kanban.css','kanban-handle.css'] as $asset) {
              nativeTasksAssert(is_file($moduleRoot . '/assets/' . $asset), "missing isolated Tasks asset: {$asset}");
          }
          $tasksJs = (string) file_get_contents($moduleRoot . '/assets/tasks-page.js');
          nativeTasksAssert(str_contains($tasksJs, 'window.wspace?.path'), 'Tasks API paths are not BASE_PATH-aware');
          nativeTasksAssert(str_contains($tasksJs, 'syncSubtaskProgress'), 'subtask progress synchronization is missing');
          $kanban = (string) file_get_contents($moduleRoot . '/assets/tasks-kanban.js');
          nativeTasksAssert(str_contains($kanban, 'shiftStats'), 'live Tasks stats synchronization is missing');

          $boardController = (string) file_get_contents($moduleRoot . '/controllers/TaskBoardController.php');
          nativeTasksAssert(str_contains($boardController, "render_template('@tasks/boards'"), 'board controller is not using isolated view namespace');
          nativeTasksAssert(str_contains($boardController, 'TaskBoardService'), 'shared boards service boundary is missing');
          $taskController = (string) file_get_contents($moduleRoot . '/controllers/TaskController.php');
          nativeTasksAssert(str_contains($taskController, "render_template('@tasks/index'"), 'Task controller is not using isolated view namespace');
          nativeTasksAssert(str_contains($taskController, 't.user_id = :user_id'), 'personal Tasks ownership query boundary is missing');

          $base = (string) file_get_contents($root . '/app/views/core/base.php');
          nativeTasksAssert(!str_contains($base, 'tasks_page/'), 'shared shell still inlines Tasks styles');
          nativeTasksAssert(!str_contains($base, '/assets/js/tasks-kanban.js'), 'shared shell still loads Tasks kanban globally');
          nativeTasksAssert(!str_contains($base, '/assets/js/task-boards-nav.js'), 'shared shell still loads Tasks navigation globally');

          echo "[OK] isolated Tasks runtime contract\n";
          ''', encoding='utf-8')
          PY

          php -l modules/tasks/runtime.php
          php -l modules/tasks/TasksCapability.php
          php -l modules/tasks/TasksRuntimeProvider.php
          php -l modules/tasks/controllers/TaskController.php
          php -l modules/tasks/controllers/TaskBoardController.php
          php -l modules/tasks/services/TaskBoardService.php
          php -l modules/tasks/views/index.php
          php -l modules/tasks/views/boards.php
          php -l modules/tasks/views/elements/task_item/index.php
          php -l tests/integration/native_tasks_contract.php
          php tests/integration/native_tasks_contract.php

      - name: Commit atomic migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo 'Tasks isolation already migrated.'
            exit 0
          fi
          git commit -m 'refactor: isolate Tasks module runtime'
          git push origin HEAD:1.0-module-tasks-isolation
