name: 1.0 module isolation gate

on:
  pull_request:
    branches: ['1.0']
    paths:
      - 'core/**'
      - 'core.php'
      - 'index.php'
      - 'modules/**'
      - 'app/**'
      - 'ws_server/**'
      - 'tests/integration/native_*_contract.php'
      - 'tests/integration/module_registry_contract.php'
      - '.github/workflows/module-isolation-release-gate.yml'
  push:
    branches: ['1.0']
    paths:
      - 'core/**'
      - 'core.php'
      - 'index.php'
      - 'modules/**'
      - 'app/**'
      - 'ws_server/**'
      - 'tests/integration/native_*_contract.php'
      - 'tests/integration/module_registry_contract.php'

permissions:
  contents: read

jobs:
  runtime-boundary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint module runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          php -l core/ModuleManifest.php
          php -l core/ModuleRuntimeProvider.php
          php -l core/ModuleCapabilityRegistry.php
          php -l core/ModuleRuntimeLoader.php
          php -l core/ModuleRegistry.php
          php -l core/routerConfig.php
          php -l core.php
          php -l index.php
          php -l tests/integration/module_registry_contract.php
          find modules/notes modules/tasks modules/files modules/profile modules/admin modules/messenger -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify registry contract
        run: php tests/integration/module_registry_contract.php
      - name: Verify route declaration and dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq -- '->dispatch();' core/routerConfig.php
          test "$(grep -Fc -- '->dispatch();' index.php)" -eq 1
          python3 <<'PY'
          from pathlib import Path
          source = Path('index.php').read_text(encoding='utf-8')
          markers = [
              "require_once SITEPATH . '/core/routerConfig.php';",
              r"\Core\ModuleRuntimeLoader::getInstance()->registerRoutes($router);",
              '$router->dispatch();',
          ]
          positions = [source.find(marker) for marker in markers]
          if any(position < 0 for position in positions) or positions != sorted(positions):
              raise SystemExit('route registration must be core -> isolated modules -> single dispatch')
          PY
      - name: Require complete bundled-module isolation
        shell: bash
        run: |
          set -euo pipefail
          for module in notes tasks files profile admin messenger; do
            mode="$(php -r '$j=json_decode(file_get_contents($argv[1]), true, 32, JSON_THROW_ON_ERROR); echo $j["runtime"]["mode"] ?? "";' "modules/${module}/module.json")"
            test "$mode" = 'isolated'
            entry="$(php -r '$j=json_decode(file_get_contents($argv[1]), true, 32, JSON_THROW_ON_ERROR); echo $j["runtime"]["entrypoint"] ?? "";' "modules/${module}/module.json")"
            test -n "$entry"
            test -f "modules/${module}/${entry}"
          done
          for manifest in modules/*/module.json; do
            mode="$(php -r '$j=json_decode(file_get_contents($argv[1]), true, 32, JSON_THROW_ON_ERROR); echo $j["runtime"]["mode"] ?? "";' "$manifest")"
            test "$mode" != 'legacy'
          done
          ! grep -Fq 'MessengerController' core/routerConfig.php
          ! grep -Fq 'MessagerController' core/routerConfig.php
