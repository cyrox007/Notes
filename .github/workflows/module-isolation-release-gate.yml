name: 1.0 module isolation gate

on:
  pull_request:
    branches: ['1.0']
    paths:
      - 'core/ModuleManifest.php'
      - 'core/ModuleRegistry.php'
      - 'core/ModuleRuntimeProvider.php'
      - 'core/ModuleCapabilityRegistry.php'
      - 'core/ModuleRuntimeLoader.php'
      - 'core/routerConfig.php'
      - 'core.php'
      - 'index.php'
      - 'modules/**'
      - 'tests/integration/module_registry_contract.php'
      - '.github/workflows/module-isolation-release-gate.yml'
  push:
    branches: ['1.0']
    paths:
      - 'core/ModuleManifest.php'
      - 'core/ModuleRegistry.php'
      - 'core/ModuleRuntimeProvider.php'
      - 'core/ModuleCapabilityRegistry.php'
      - 'core/ModuleRuntimeLoader.php'
      - 'core/routerConfig.php'
      - 'core.php'
      - 'index.php'
      - 'modules/**'

permissions:
  contents: read

jobs:
  runtime-boundary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint module runtime boundary
        run: |
          php -l core/ModuleManifest.php
          php -l core/ModuleRuntimeProvider.php
          php -l core/ModuleCapabilityRegistry.php
          php -l core/ModuleRuntimeLoader.php
          php -l core/ModuleRegistry.php
          php -l core/routerConfig.php
          php -l core.php
          php -l index.php
          php -l tests/integration/module_registry_contract.php
      - name: Verify isolated runtime and capability contract
        run: php tests/integration/module_registry_contract.php
      - name: Verify route declaration and dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq -- '->dispatch();' core/routerConfig.php
          test "$(grep -Fc -- '->dispatch();' index.php)" -eq 1
          python3 <<'PY'
          from pathlib import Path
          source = Path('index.php').read_text(encoding='utf-8')
          core_routes = "require_once SITEPATH . '/core/routerConfig.php';"
          module_routes = r"\Core\ModuleRuntimeLoader::getInstance()->registerRoutes($router);"
          dispatch = '$router->dispatch();'
          positions = [source.find(core_routes), source.find(module_routes), source.find(dispatch)]
          if any(position < 0 for position in positions) or positions != sorted(positions):
              raise SystemExit('route registration must be core -> isolated modules -> single dispatch')
          PY
      - name: Track remaining legacy bundled modules
        shell: bash
        run: |
          set -euo pipefail
          mode="$(php -r '$j=json_decode(file_get_contents("modules/notes/module.json"), true, 32, JSON_THROW_ON_ERROR); echo $j["runtime"]["mode"] ?? "";')"
          test "$mode" = 'isolated'
          legacy=0
          for manifest in modules/*/module.json; do
            mode="$(php -r '$j=json_decode(file_get_contents($argv[1]), true, 32, JSON_THROW_ON_ERROR); echo $j["runtime"]["mode"] ?? "";' "$manifest")"
            if [[ "$mode" == 'legacy' ]]; then
              echo "LEGACY: $manifest"
              legacy=$((legacy + 1))
            fi
          done
          # Notes is isolated. Tighten this ceiling with every remaining module
          # migration until it reaches zero before the final 1.0 release tag.
          test "$legacy" -le 5
