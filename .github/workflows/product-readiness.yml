name: Product readiness

on:
  pull_request:
    branches: [master]
  push:
    branches: [product-ui-production-refresh]

permissions:
  contents: read

jobs:
  product-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: readiness_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli, sodium, fileinfo, gd
          coverage: none

      - name: Targeted PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            core.php \
            bin/healthcheck.php \
            app/controllers/AuthController.php \
            app/services/RequestRateLimiter.php \
            app/middlewares/AuthRateLimit.php \
            app/middlewares/UploadRateLimit.php \
            core/routerConfig.php
          do
            php -l "$source"
          done

      - name: Browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/reg-script.js
          node --check assets/js/file_manager/script.js

      - name: UI and accessibility contract
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '{include file="core/theme-refresh.css"}' app/views/styles.css
          grep -Fq '{include file="core/accessibility.css"}' app/views/styles.css
          ! grep -R -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' app/views/core assets/css/auth_page

          grep -Fq "backdrop.className = 'sidebar-backdrop'" app/views/core/common.js
          grep -Fq "setAttribute('aria-current', 'page')" app/views/core/common.js
          grep -Fq 'aria-live="polite"' app/views/^shared/header/index.tpl
          grep -Fq 'class="skip-link"' app/views/core/base.tpl
          grep -Fq 'autocomplete="username"' app/views/login_page/login_view.tpl
          grep -Fq 'autocomplete="current-password"' app/views/login_page/login_view.tpl
          grep -Fq 'minlength="10"' app/views/login_page/register_view.tpl
          ! grep -Fq 'name="userphoto"' app/views/login_page/register_view.tpl

          grep -Fq 'text-preview-modal' app/views/file_manager/index.tpl
          grep -Fq 'read-only' assets/js/file_manager/script.js
          ! grep -Fq 'cdnjs.cloudflare.com' app/views/file_manager/index.tpl
          ! grep -Fq 'runCodeInSandbox' assets/js/file_manager/script.js
          ! grep -Fq 'btn-run-code' app/views/file_manager/index.tpl

      - name: Linux bootstrap path contract
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            core/config.php \
            core/Version.php \
            core/DatabaseControll.php \
            core/DatabaseManager.php \
            core/ORM.php \
            core/model.php \
            core/view.php \
            core/request.php \
            core/controller.php \
            core/helper.php \
            core/images.php
          do
            test -f "$path"
            grep -Fq "/$path" core.php
          done

      - name: Security header contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Permissions-Policy' .htaccess
          grep -Fq 'Cross-Origin-Opener-Policy' .htaccess
          grep -Fq "object-src 'none'" .htaccess
          ! grep -Fq "'unsafe-eval'" .htaccess
          ! grep -Fq 'cdnjs.cloudflare.com' .htaccess
          ! grep -Fq 'notes.loc' .htaccess

      - name: Rate limiter runtime contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/workspace-rate-limit
          mkdir -m 700 /tmp/workspace-rate-limit
          PRIVATE_STORAGE_PATH=/tmp/workspace-rate-limit php <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__ . '/app/services/RequestRateLimiter.php';

          use App\Services\RequestRateLimiter;

          $first = RequestRateLimiter::consume('ci-auth', '127.0.0.1|/auth/login', 2, 60);
          $second = RequestRateLimiter::consume('ci-auth', '127.0.0.1|/auth/login', 2, 60);
          $third = RequestRateLimiter::consume('ci-auth', '127.0.0.1|/auth/login', 2, 60);

          if (!$first['allowed'] || !$second['allowed'] || $third['allowed']) {
              throw new RuntimeException('Rate limit threshold contract failed');
          }
          if ($third['remaining'] !== 0 || $third['retry_after'] < 1) {
              throw new RuntimeException('Rate limit metadata contract failed');
          }

          $directory = '/tmp/workspace-rate-limit/rate-limit';
          $files = glob($directory . '/*.json') ?: [];
          if (count($files) !== 1) {
              throw new RuntimeException('Expected one persisted limiter state file');
          }
          $dirMode = substr(sprintf('%o', fileperms($directory)), -4);
          $fileMode = substr(sprintf('%o', fileperms($files[0])), -4);
          if ($dirMode !== '0700' || $fileMode !== '0600') {
              throw new RuntimeException("Unsafe limiter permissions: {$dirMode}/{$fileMode}");
          }
          echo "Rate limiter contract OK\n";
          PHP

          grep -Fq 'AuthRateLimit::class' core/routerConfig.php
          grep -Fq 'UploadRateLimit::class' core/routerConfig.php

      - name: Current schema and healthcheck
        shell: bash
        env:
          DBDRIVER: mysql
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: readiness_test
          UNIQUE_KEY: ci-note-secret-0123456789abcdef0123456789abcdef
          MSG_SECRET_KEY: ci-message-secret-0123456789abcdef0123456789abcdef
          WS_TICKET_SECRET: ci-ticket-secret-0123456789abcdef0123456789abcdef
          PRIVATE_STORAGE_PATH: /tmp/workspace-private
          SITEURL: https://workspace.example.test
          WS_PUBLIC_URL: wss://workspace.example.test/ws
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$PRIVATE_STORAGE_PATH"
          mysql -h 127.0.0.1 -uroot -proot readiness_test < database/messenger_schema.sql
          mysql -h 127.0.0.1 -uroot -proot readiness_test < database/notes_schema.sql
          mysql -h 127.0.0.1 -uroot -proot readiness_test < database/file_manager_schema.sql
          mysql -h 127.0.0.1 -uroot -proot readiness_test < database/user_fields_schema.sql
          mysql -h 127.0.0.1 -uroot -proot readiness_test < database/tasks_schema.sql

          php bin/healthcheck.php | tee /tmp/healthcheck.txt
          grep -Fq 'Healthcheck: OK' /tmp/healthcheck.txt

      - name: Documentation freshness contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'database/tasks_schema.sql' README.md
          grep -Fq 'php bin/migrate.php' README.md
          grep -Fq 'php bin/migrate_crypto.php' README.md
          grep -Fq 'Saved Messages' README.md
          grep -Fq 'docs/PRODUCTION.md' README.md
          grep -Fq 'File Manager code execution удалён' README.md
          test -s docs/PRODUCTION.md
