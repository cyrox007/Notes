name: 0.14 RBAC runtime enforcement

on:
  pull_request:
    branches: [master]
  push:
    branches: [0.14-phase4-rbac-enforcement]

permissions:
  contents: read

jobs:
  rbac-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo, gd
          coverage: none

      - name: Lint RBAC enforcement runtime
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            app/controllers/AuthController.php \
            app/middlewares/LoginRequared.php \
            app/middlewares/IsAdmin.php \
            app/middlewares/RequirePermission.php \
            app/middlewares/RequireAdminAccess.php \
            app/middlewares/RequireAdminUsersManage.php \
            app/middlewares/RequireAdminSettingsManage.php \
            app/services/PermissionService.php \
            app/services/AdminUserService.php \
            app/services/StorageQuotaService.php \
            core/routerConfig.php \
            ws_server/server.php \
            tests/integration/rbac_enforcement_runtime.php
          do
            php -l "$source"
          done

      - name: Verify MySQL and runtime enforcement contract
        run: bash tests/integration/rbac_enforcement_mysql.sh
