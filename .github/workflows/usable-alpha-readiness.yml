name: 0.12 usable-alpha readiness

on:
  push:
    branches: [0.12-release-alpha]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  usable-alpha-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint readiness contract
        run: php -l tests/integration/usable_alpha_readiness.php

      - name: Verify Workspace 0.12 Definition of Done
        run: php tests/integration/usable_alpha_readiness.php
