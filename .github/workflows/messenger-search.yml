name: Messenger encrypted search

on:
  pull_request:
    branches: [master, '1.0']
  push:
    branches: [messenger-groups]

permissions:
  contents: read

jobs:
  encrypted-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: notes_search_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli, sodium, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Search syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l modules/messenger/services/MessengerSearchService.php
          php -l modules/messenger/socket/SearchSocket.php
          sed '/^{literal}$/d;/^{\/literal}$/d' modules/messenger/views/search.js > /tmp/messenger-search.js
          node --check /tmp/messenger-search.js

      - name: Prepare schema
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot notes_search_test < database/messenger_schema.sql

      - name: Encrypted search integration
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          if (!defined('SITEPATH')) {
              define('SITEPATH', getcwd());
          }
          $_SERVER['HTTP_HOST'] = 'localhost';
          putenv('DBDRIVER=mysql');
          putenv('DBHOST=127.0.0.1');
          putenv('DBPORT=3306');
          putenv('DBUSER=root');
          putenv('DBPASS=root');
          putenv('DBNAME=notes_search_test');
          putenv('MSG_SECRET_KEY=ci-message-secret-0123456789abcdef0123456789abcdef');
          putenv('MESSENGER_SEARCH_SCAN_LIMIT=500');

          require __DIR__ . '/core/config.php';
          require __DIR__ . '/core/DatabaseManager.php';
          require __DIR__ . '/app/handlers/UUID.php';
          require __DIR__ . '/modules/messenger/handlers/MessengerCrypto.php';
          require __DIR__ . '/modules/messenger/services/MessengerService.php';
          require __DIR__ . '/modules/messenger/services/MessengerSearchService.php';

          $db = \Core\DatabaseManager::getInstance();
          $now = date('Y-m-d H:i:s');
          $password = password_hash('ci-password', PASSWORD_ARGON2ID);
          $alice = '50000000-0000-4000-8000-000000000001';
          $bob = '50000000-0000-4000-8000-000000000002';
          $charlie = '50000000-0000-4000-8000-000000000003';
          $dave = '50000000-0000-4000-8000-000000000004';

          foreach ([
              [$alice, 'alice-search', 'Alice', 'Search'],
              [$bob, 'bob-search', 'Bob', 'Search'],
              [$charlie, 'charlie-search', 'Charlie', 'Secret'],
              [$dave, 'dave-search', 'Dave', 'Secret'],
          ] as [$uid, $username, $firstname, $lastname]) {
              $db->execute(
                  'INSERT INTO users (uid,username,email,password_hash,firstname,lastname,role,is_active,created_at,updated_at)
                   VALUES (:uid,:username,:email,:password_hash,:firstname,:lastname,888,1,:created_at,:updated_at)',
                  [
                      ':uid' => $uid,
                      ':username' => $username,
                      ':email' => $username . '@example.test',
                      ':password_hash' => $password,
                      ':firstname' => $firstname,
                      ':lastname' => $lastname,
                      ':created_at' => $now,
                      ':updated_at' => $now,
                  ]
              );
          }

          $messenger = new \App\Services\MessengerService($db);
          $search = new \App\Services\MessengerSearchService($db, $messenger);

          $aliceBob = $messenger->createDialog($alice, 'private', [$bob]);
          $charlieDave = $messenger->createDialog($charlie, 'private', [$dave]);

          $phoenix = $messenger->sendMessage($alice, $aliceBob['uid'], 'Project Phoenix roadmap and milestones');
          $messenger->sendMessage($bob, $aliceBob['uid'], 'Routine status update');
          $messenger->sendMessage($charlie, $charlieDave['uid'], 'Project Phoenix confidential acquisition');

          $aliceResults = $search->messages($alice, 'Phoenix');
          if (count($aliceResults) !== 1 || ($aliceResults[0]['uid'] ?? null) !== $phoenix['uid']) {
              throw new RuntimeException('Search leaked inaccessible message or missed authorized encrypted message');
          }
          if (str_contains((string) ($aliceResults[0]['preview'] ?? ''), 'confidential acquisition')) {
              throw new RuntimeException('Search leaked plaintext from another dialog');
          }

          $bobResults = $search->messages($bob, 'Phoenix', $aliceBob['uid']);
          if (count($bobResults) !== 1 || ($bobResults[0]['uid'] ?? null) !== $phoenix['uid']) {
              throw new RuntimeException('Authorized participant cannot search encrypted message');
          }

          $messenger->deleteMessage($bob, $phoenix['uid'], false);
          if ($search->messages($bob, 'Phoenix', $aliceBob['uid']) !== []) {
              throw new RuntimeException('Delete-for-me message remains searchable for deleting user');
          }
          $aliceStillSees = $search->messages($alice, 'Phoenix', $aliceBob['uid']);
          if (count($aliceStillSees) !== 1 || ($aliceStillSees[0]['uid'] ?? null) !== $phoenix['uid']) {
              throw new RuntimeException('Delete-for-me incorrectly removed search result for other participant');
          }

          $dialogId = (int) $db->fetchValue(
              'SELECT id FROM dialogs WHERE uid = :uid',
              [':uid' => $aliceBob['uid']]
          );
          $aliceId = (int) $db->fetchValue(
              'SELECT id FROM users WHERE uid = :uid',
              [':uid' => $alice]
          );
          $mediaUid = '50000000-0000-4000-8000-000000000010';
          $db->execute(
              'INSERT INTO messages (
                  uid,dialog_id,from_user_id,message,message_type,meta_data,message_status,is_deleted,created_at,updated_at
               ) VALUES (
                  :uid,:dialog_id,:from_user_id,:message,:message_type,:meta_data,:message_status,0,:created_at,:updated_at
               )',
              [
                  ':uid' => $mediaUid,
                  ':dialog_id' => $dialogId,
                  ':from_user_id' => $aliceId,
                  ':message' => \App\Helpers\MessengerCrypto::encrypt('', $mediaUid),
                  ':message_type' => 'file',
                  ':meta_data' => json_encode(['name' => 'invoice-aurora.pdf'], JSON_THROW_ON_ERROR),
                  ':message_status' => 'sent',
                  ':created_at' => $now,
                  ':updated_at' => $now,
              ]
          );

          $fileResults = $search->messages($alice, 'aurora', $aliceBob['uid']);
          if (count($fileResults) !== 1 || ($fileResults[0]['uid'] ?? null) !== $mediaUid) {
              throw new RuntimeException('Search does not match encrypted media metadata filename');
          }

          $dialogs = $search->dialogs($alice, 'Bob');
          if (count($dialogs) !== 1 || ($dialogs[0]['uid'] ?? null) !== $aliceBob['uid']) {
              throw new RuntimeException('Dialog search did not match private partner');
          }

          $validationBlocked = false;
          try {
              $search->messages($alice, 'x');
          } catch (InvalidArgumentException) {
              $validationBlocked = true;
          }
          if (!$validationBlocked) {
              throw new RuntimeException('One-character search query was accepted');
          }

          echo "encrypted messenger search integration passed\n";
          PHP
