name: Публикация проверенного релиза после master gate

on:
  workflow_run:
    workflows: ["Master release gate"]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  release-publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Получить проверенную ревизию master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Создать неизменяемый тег и запустить сборку релиза
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(php -r "require 'core/Version.php'; echo Core\\Version::VERSION;")"
          TAG="v$VERSION"
          NOTES="docs/releases/$TAG.md"

          test -s "$NOTES"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n1 "$TAG")"
            if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
              echo "Тег $TAG уже указывает на другую ревизию $TAG_SHA; опубликованный тег не перемещается." >&2
              exit 1
            fi
            echo "Тег $TAG уже существует на проверенной ревизии $RELEASE_SHA."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$RELEASE_SHA" -m "Workspace Organizer $VERSION"
            git push origin "refs/tags/$TAG"
            echo "Опубликован тег $TAG на проверенной ревизии $RELEASE_SHA."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG уже существует; повторная сборка не требуется."
            exit 0
          fi

          # Push через GITHUB_TOKEN не запускает следующий push-workflow автоматически,
          # поэтому сборка явно запускается на уже созданном неизменяемом теге.
          gh workflow run hosting-package.yml --ref "$TAG" -f version="$TAG"
          echo "Запущена сборка и публикация GitHub Release $TAG."
