name: Публикация проверенного релиза после master gate

on:
  workflow_run:
    workflows: ["Stable release gate"]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  release-publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Получить проверенную ревизию master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Проверить готовность версии к публичному выпуску
        id: readiness
        shell: bash
        run: |
          php -r '
            require "core/Version.php";
            $policy = json_decode(file_get_contents(".github/release-readiness.json"), true, 32, JSON_THROW_ON_ERROR);
            $ready = ($policy["version"] ?? null) === Core\Version::VERSION && ($policy["ready"] ?? false) === true;
            file_put_contents(getenv("GITHUB_OUTPUT"), "ready=" . ($ready ? "true" : "false") . PHP_EOL, FILE_APPEND);
            if (!$ready) {
              echo "Публичная публикация приостановлена: " . implode("; ", $policy["blockers"] ?? []) . PHP_EOL;
            }
          '

      - name: Создать неизменяемый тег и запустить сборку релиза
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(php -r "require 'core/Version.php'; echo Core\\Version::VERSION;")"
          TAG="v$VERSION"
          NOTES="docs/releases/$TAG.md"

          test -s "$NOTES"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          RELEASE_EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n1 "$TAG")"

            if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
              if [[ "$RELEASE_EXISTS" == "true" ]]; then
                gh release edit "$TAG" \
                  --title "Workspace Organizer $VERSION" \
                  --notes-file "$NOTES"
                echo "Тег $TAG остаётся на опубликованной ревизии $TAG_SHA; обновлено только описание GitHub Release."
                exit 0
              fi

              echo "Тег $TAG уже указывает на другую ревизию $TAG_SHA, а GitHub Release отсутствует; опубликованный тег не перемещается." >&2
              exit 1
            fi

            echo "Тег $TAG уже существует на проверенной ревизии $RELEASE_SHA."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$RELEASE_SHA" -m "Workspace Organizer $VERSION"
            git push origin "refs/tags/$TAG"
            echo "Опубликован тег $TAG на проверенной ревизии $RELEASE_SHA."
          fi

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release edit "$TAG" \
              --title "Workspace Organizer $VERSION" \
              --notes-file "$NOTES"
            echo "GitHub Release $TAG уже существует; описание синхронизировано с финальной документацией."
            exit 0
          fi

          # Push через GITHUB_TOKEN не запускает следующий push-workflow автоматически,
          # поэтому сборка явно запускается на уже созданном неизменяемом теге.
          gh workflow run hosting-package.yml --ref "$TAG" -f version="$TAG"
          echo "Запущена сборка и публикация GitHub Release $TAG."
