name: 1.2 — исходный релиз и восстановление базы

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'database/migrations/**'
      - 'core/MigrationBaseline.php'
      - 'tests/integration/upgrade_11000_historical_integrity.php'
      - '.github/workflows/upgrade-11000-backup-restore.yml'
  push:
    branches: ['1.2']
    paths:
      - 'database/migrations/**'
      - 'core/MigrationBaseline.php'
      - 'tests/integration/upgrade_11000_historical_integrity.php'
      - '.github/workflows/upgrade-11000-backup-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-migrations:
    name: Побайтовая история v1.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить проверяемую ветку
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Получить опубликованный тег
        uses: actions/checkout@v4
        with:
          ref: v1.1.0
          path: published
          persist-credentials: false
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Проверить исторические миграции
        run: |
          set -euo pipefail
          php -l candidate/tests/integration/upgrade_11000_historical_integrity.php
          php candidate/tests/integration/upgrade_11000_historical_integrity.php "$GITHUB_WORKSPACE/published"

  backup-restore:
    name: Резервная копия и восстановление MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: workspace_upgrade_restore_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Получить версию 1.2
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Получить опубликованную 1.1.0
        uses: actions/checkout@v4
        with:
          ref: v1.1.0
          path: published
          persist-credentials: false
      - name: Подготовить MySQL-клиент
        run: sudo apt-get update -qq && sudo apt-get install -y default-mysql-client
      - name: Проверить восстановление настоящей схемы 1.1 после миграции 1.2
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          DB=workspace_upgrade_restore_test
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -uroot)
          # Исходная таблица взята непосредственно из опубликованного тега 1.1.0.
          "${MYSQL[@]}" "$DB" < published/database/core_identity_schema.sql
          "${MYSQL[@]}" "$DB" <<'SQL'
          INSERT INTO users (uid,username,email,password_hash,firstname,lastname)
          VALUES ('00000000-0000-4000-8000-000000000111','upgrade_test_one','upgrade-one@example.test','hash-fixture','Иван','До обновления'),
                 ('00000000-0000-4000-8000-000000000112','upgrade_test_two','upgrade-two@example.test','hash-fixture','Мария','До обновления');
          SQL
          mysqldump --protocol=tcp -h127.0.0.1 -uroot --single-transaction --quick "$DB" > /tmp/notes-upgrade-original.sql
          test -s /tmp/notes-upgrade-original.sql
          # Миграция 1.2 — реальный SQL общей платформенной таблицы команд.
          "${MYSQL[@]}" "$DB" < candidate/database/migrations/20261017_mutation_commands.sql
          "${MYSQL[@]}" "$DB" -e "INSERT INTO mutation_commands (actor_key,command_id,scope,action,entity_type,entity_uid,request_hash,operation_token) VALUES ('test','failed-attempt','tasks','complete','task','fixture',REPEAT('a',64),REPEAT('b',32))"
          "${MYSQL[@]}" "$DB" -e "UPDATE users SET lastname='Повреждено' WHERE username='upgrade_test_one'"
          "${MYSQL[@]}" -e "DROP DATABASE \\`$DB\\`; CREATE DATABASE \\`$DB\\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          "${MYSQL[@]}" "$DB" < /tmp/notes-upgrade-original.sql
          count=$("${MYSQL[@]}" -N "$DB" -e 'SELECT COUNT(*) FROM users')
          test "$count" = '2'
          lastname=$("${MYSQL[@]}" -N "$DB" -e "SELECT lastname FROM users WHERE username='upgrade_test_one'")
          test "$lastname" = 'До обновления'
          migrated=$("${MYSQL[@]}" -N information_schema -e "SELECT COUNT(*) FROM TABLES WHERE TABLE_SCHEMA='$DB' AND TABLE_NAME='mutation_commands'")
          test "$migrated" = '0'
          echo 'Проверено восстановление пользователей опубликованной 1.1.0 после изменения реальной миграцией 1.2'
