name: Sync Composer lock PHP 8.1

on:
  push:
    branches: [0.14-system-requirements-php81]

permissions:
  contents: write

jobs:
  sync-lock:
    if: ${{ !contains(github.event.head_commit.message, '[composer-lock-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.14-system-requirements-php81
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - name: Refresh lock metadata without changing package versions
        run: composer update --lock --no-install --no-interaction --no-progress
      - name: Commit lock metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '0.14: sync Composer PHP floor [composer-lock-synced]'
          git push origin HEAD:0.14-system-requirements-php81
