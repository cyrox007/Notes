name: Temporary beta3 registration policy hardening

on:
  push:
    branches: [0.14-beta3-registration-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.14-beta3-registration-policy
      - name: Serialize invite storage initialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/services/RegistrationPolicyService.php')
          text = path.read_text(encoding='utf-8')
          old = "        $this->db->beginTransaction();\n        try {\n            $invites = $this->readInvitesForUpdate();\n            if (count($invites) >= self::MAX_INVITES) {"
          new = "        $this->db->beginTransaction();\n        try {\n            $this->ensureInviteStorageRow();\n            $invites = $this->readInvitesForUpdate();\n            if (count($invites) >= self::MAX_INVITES) {"
          if old not in text:
              raise SystemExit('createInvite transaction marker missing')
          text = text.replace(old, new, 1)

          old = "        $this->db->beginTransaction();\n        try {\n            $invites = $this->readInvitesForUpdate();\n            $found = false;"
          new = "        $this->db->beginTransaction();\n        try {\n            $this->ensureInviteStorageRow();\n            $invites = $this->readInvitesForUpdate();\n            $found = false;"
          if old not in text:
              raise SystemExit('revokeInvite transaction marker missing')
          text = text.replace(old, new, 1)

          old = "                if (!$legacyAccepted) {\n                    $invites = $this->readInvitesForUpdate();"
          new = "                if (!$legacyAccepted) {\n                    $this->ensureInviteStorageRow();\n                    $invites = $this->readInvitesForUpdate();"
          if old not in text:
              raise SystemExit('register invite marker missing')
          text = text.replace(old, new, 1)

          marker = "    /** @return list<array<string,mixed>> */\n    private function readInvitesForUpdate(): array\n"
          helper = "    private function ensureInviteStorageRow(): void\n    {\n        // Create the singleton JSON row before SELECT ... FOR UPDATE. Without\n        // this, two first-time invite writers could both lock no row and then\n        // overwrite each other's JSON list. INSERT IGNORE is safe under the\n        // unique setting_key constraint and the following SELECT locks it.\n        $this->db->execute(\n            'INSERT IGNORE INTO system_settings (setting_key,setting_value,setting_type,category,description,is_editable) ' .\n            'VALUES (:setting_key,\'[]\',\'json\',\'registration\',\'Hashed managed registration invitations\',1)',\n            [':setting_key' => self::INVITES_SETTING]\n        );\n    }\n\n"
          if marker not in text:
              raise SystemExit('readInvitesForUpdate marker missing')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          php -l app/services/RegistrationPolicyService.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/RegistrationPolicyService.php
          git commit -m 'Harden concurrent registration invite state'
          git push origin HEAD:0.14-beta3-registration-policy
