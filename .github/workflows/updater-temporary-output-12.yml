name: 1.2 — бюджет временного вывода обновлятора

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'core/UpdateProcessRunner.php'
      - 'tests/integration/update_process_temporary_output_12.php'
      - '.github/workflows/updater-temporary-output-12.yml'
  push:
    branches: ['1.2']
    paths:
      - 'core/UpdateProcessRunner.php'
      - 'tests/integration/update_process_temporary_output_12.php'
      - '.github/workflows/updater-temporary-output-12.yml'
  workflow_dispatch:

jobs:
  temporary-output:
    name: Проверка временных файлов (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Проверить синтаксис и бюджет временного вывода
        run: |
          php -l core/UpdateProcessRunner.php
          php -l tests/integration/update_process_temporary_output_12.php
          php tests/integration/update_process_temporary_output_12.php
