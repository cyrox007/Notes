name: One-shot Tasks isolation contract sync

on:
  push:
    branches: ['1.0-module-tasks-isolation']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0-module-tasks-isolation
          fetch-depth: 0
      - name: Synchronize module registry contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/integration/module_registry_contract.php')
          s = p.read_text(encoding='utf-8')
          old = """    if ($id === 'notes') {
        assertModuleContract($manifest->runtimeMode() === 'isolated', 'Notes must be the first physically isolated bundled module');
        assertModuleContract($manifest->runtimeEntrypoint() === 'runtime.php', 'Notes isolated entrypoint drifted');
    } else {
        assertModuleContract($manifest->runtimeMode() === 'legacy', \"{$id} remains legacy until its dedicated migration\");
        assertModuleContract($manifest->runtimeEntrypoint() === null, \"legacy {$id} must not expose an isolated entrypoint\");
    }
"""
          new = """    if (in_array($id, ['notes', 'tasks'], true)) {
        assertModuleContract($manifest->runtimeMode() === 'isolated', \"{$id} must remain physically isolated\");
        assertModuleContract($manifest->runtimeEntrypoint() === 'runtime.php', \"{$id} isolated entrypoint drifted\");
    } else {
        assertModuleContract($manifest->runtimeMode() === 'legacy', \"{$id} remains legacy until its dedicated migration\");
        assertModuleContract($manifest->runtimeEntrypoint() === null, \"legacy {$id} must not expose an isolated entrypoint\");
    }
"""
          if old not in s:
              raise SystemExit('module registry isolation marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          php -l tests/integration/module_registry_contract.php
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/integration/module_registry_contract.php
          git diff --cached --quiet && exit 0
          git commit -m 'test: track Tasks as isolated module'
          git push origin HEAD:1.0-module-tasks-isolation
