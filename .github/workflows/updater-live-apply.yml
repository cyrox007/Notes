name: 1.0 updater live apply rollback

on:
  pull_request:
    branches: [master, '1.0', dev]
  push:
    branches: ['1.0-data-only-migration-preflight']

permissions:
  contents: read

jobs:
  live-apply-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, sodium, zlib, pcntl
          coverage: none

      - name: Lint live apply boundary
        shell: bash
        run: |
          set -euo pipefail
          php -l core/MigrationManifest.php
          php -l core/UpdateMigrationPreflight.php
          php -l core/UpdateTransactionStateMachine.php
          php -l core/UpdatePath.php
          php -l core/PrivateStorageResolver.php
          php -l core/UpdateExternalRuntime.php
          php -l core/UpdateCandidateVerifier.php
          php -l core/UpdateCodeSwitcher.php
          php -l core/UpdateDatabaseRestorer.php
          php -l core/UpdateLiveApplier.php
          php -l core/UpdateApplyOperationLock.php
          php -l core/UpdateRollbackCodeRestorer.php
          php -l core/UpdateApplyCommand.php
          php -l core/UpdateReadiness.php
          php -l core/UpdateArtifactCleaner.php
          php -l bin/update_apply.php
          php -l bin/update_external_apply.php
          php -l bin/update_run.php
          php -l bin/update_doctor.php
          php -l bin/update_retention.php
          php -l tests/integration/external_update_runtime_contract.php
          php -l tests/integration/updater_operator_flow_contract.php
          php -l tests/integration/updater_readiness_contract.php
          php -l tests/integration/updater_artifact_retention_contract.php
          php -l tests/integration/updater_migration_preflight_contract.php
          php -l tests/integration/updater_live_apply_contract.php
          php -l tests/integration/updater_live_permissions_contract.php
          php -l tests/integration/updater_recovery_invariants_contract.php
          php -r '$m=json_decode(file_get_contents("database/migrations/manifest.json"),true,32,JSON_THROW_ON_ERROR); if (($m["schema"]??null)!==1 || ($m["product"]??null)!=="workspace-organizer") exit(1);'

      - name: Проверить внешний updater runtime
        shell: bash
        run: php tests/integration/external_update_runtime_contract.php

      - name: Prepare updater database fixtures
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS updater_live_apply_test; CREATE DATABASE updater_live_apply_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS updater_migration_preflight_test; CREATE DATABASE updater_migration_preflight_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot -proot updater_live_apply_test <<'SQL'
          CREATE TABLE items (
            id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
            title VARCHAR(190) NOT NULL,
            metadata JSON NULL
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          CREATE TABLE audit (
            id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
            item_id BIGINT UNSIGNED NOT NULL,
            event_name VARCHAR(50) NOT NULL
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          DELIMITER $$
          CREATE TRIGGER items_after_insert AFTER INSERT ON items
          FOR EACH ROW BEGIN
            INSERT INTO audit (item_id, event_name) VALUES (NEW.id, 'insert');
          END$$
          DELIMITER ;
          INSERT INTO items (title, metadata) VALUES
            ('rollback source', JSON_OBJECT('kind', 'source', 'attempt', 1)),
            ('second row', JSON_OBJECT('kind', 'second', 'enabled', TRUE));
          SQL

      - name: Verify data-only migration preflight
        env:
          DBHOST: 127.0.0.1
          DBPORT: '3306'
          DBUSER: root
          DBPASS: root
          MIGRATION_PREFLIGHT_DBNAME: updater_migration_preflight_test
        run: php tests/integration/updater_migration_preflight_contract.php

      - name: Verify controlled switch, rollback state graph and MySQL restore
        env:
          DBHOST: 127.0.0.1
          DBPORT: '3306'
          DBUSER: root
          DBPASS: root
          DBNAME: updater_live_apply_test
          LIVE_APPLY_CONTRACT_TAG: php-${{ matrix.php }}
        run: |
          php tests/integration/updater_live_apply_contract.php
          php tests/integration/updater_file_rollback_contract.php
          php tests/integration/updater_live_permissions_contract.php
          php tests/integration/updater_recovery_invariants_contract.php
          php tests/integration/updater_operator_flow_contract.php
          php tests/integration/updater_readiness_contract.php
          php tests/integration/updater_artifact_retention_contract.php

      - name: Проверить CLI и границу изменения рабочих файлов
        shell: bash
        run: |
          set -euo pipefail
          HELP_OUTPUT="$(php bin/update_apply.php --help)"
          grep -Fq 'transactional live updater' <<<"$HELP_OUTPUT"
          RUN_HELP_OUTPUT="$(php bin/update_run.php --help)"
          grep -Fq 'сквозной сценарий установки подписанного обновления' <<<"$RUN_HELP_OUTPUT"
          grep -Fq -- '--yes' <<<"$RUN_HELP_OUTPUT"
          RETENTION_HELP_OUTPUT="$(php bin/update_retention.php --help)"
          grep -Fq 'updater retention cleanup' <<<"$RETENTION_HELP_OUTPUT"
          grep -Fq -- '--apply --yes' <<<"$RETENTION_HELP_OUTPUT"
          grep -Fq 'UpdateArtifactCleaner' bin/update_retention.php
          grep -Fq "['committed', 'rollback_verified']" core/UpdateArtifactCleaner.php
          ! grep -Fq 'stage_dir' <<<"$(grep -n 'deleteDirectory' core/UpdateArtifactCleaner.php || true)"
          grep -Fq 'UpdateApplyCommand' bin/update_apply.php
          grep -Fq 'UpdateApplyOperationLock' core/UpdateApplyCommand.php
          grep -Fq 'operation_busy' core/UpdateApplyCommand.php
          grep -Fq 'UpdateRollbackCodeRestorer' core/UpdateApplyCommand.php
          grep -Fq "'candidate_required' => false" core/UpdateRollbackCodeRestorer.php
          grep -Fq 'UpdateMigrationPreflight' core/UpdateApplyCommand.php
          grep -Fq 'migration_preflight_sha256' core/UpdateApplyCommand.php
          grep -Fq 'markLiveMutationStarted' core/UpdateApplyCommand.php
          grep -Fq 'markRollbackFailed' core/UpdateApplyCommand.php
          grep -Fq "state === 'code_restored'" core/UpdateApplyCommand.php
          grep -Fq "state !== 'database_restored'" core/UpdateApplyCommand.php
          grep -Fq 'maintenance_release_failed' core/UpdateApplyCommand.php
          grep -Fq -- "'--status'" core/UpdateApplyCommand.php
          ! grep -Fq -- "candidateRoot . '/bin/migrate.php'" core/UpdateApplyCommand.php
          grep -Fq "'restart', '-d'" core/UpdateApplyCommand.php
          grep -Fq 'PRESERVED_ROOTS' core/UpdateLiveApplier.php
          grep -Fq 'UpdateCandidateVerifier' core/UpdateLiveApplier.php
          grep -Fq 'UpdateCodeSwitcher' core/UpdateLiveApplier.php
          grep -Fq 'UpdateDatabaseRestorer' core/UpdateLiveApplier.php
          grep -Fq 'mkdir($path, 0755, true)' core/UpdateCodeSwitcher.php
          grep -Fq 'DROP TABLE IF EXISTS' core/UpdateDatabaseRestorer.php
          grep -Fq 'rollback_failed' core/UpdateTransactionStateMachine.php
          ! grep -Fq 'verifyCandidateTree($artifacts' core/UpdateApplyCommand.php
          ! grep -Fq 'unzip ' bin/update_apply.php
          ! grep -Fq 'unzip ' core/UpdateApplyCommand.php
