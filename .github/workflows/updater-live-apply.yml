name: 1.0 updater live apply rollback

on:
  pull_request:
    branches: [master, '1.0']
  push:
    branches: ['1.0-updater-live-apply-rollback']

permissions:
  contents: read

jobs:
  live-apply-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, sodium, zlib, pcntl
          coverage: none

      - name: Lint live apply boundary
        shell: bash
        run: |
          set -euo pipefail
          php -l core/UpdateTransactionStateMachine.php
          php -l core/UpdateLiveApplier.php
          php -l bin/update_apply.php
          php -l tests/integration/updater_live_apply_contract.php

      - name: Prepare rollback database fixture
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS updater_live_apply_test; CREATE DATABASE updater_live_apply_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot -proot updater_live_apply_test <<'SQL'
          CREATE TABLE items (
            id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
            title VARCHAR(190) NOT NULL
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          CREATE TABLE audit (
            id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
            item_id BIGINT UNSIGNED NOT NULL,
            event_name VARCHAR(50) NOT NULL
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          DELIMITER $$
          CREATE TRIGGER items_after_insert AFTER INSERT ON items
          FOR EACH ROW BEGIN
            INSERT INTO audit (item_id, event_name) VALUES (NEW.id, 'insert');
          END$$
          DELIMITER ;
          INSERT INTO items (title) VALUES ('rollback source'), ('second row');
          SQL

      - name: Verify controlled switch, rollback state graph and MySQL restore
        env:
          DBHOST: 127.0.0.1
          DBPORT: '3306'
          DBUSER: root
          DBPASS: root
          DBNAME: updater_live_apply_test
          LIVE_APPLY_CONTRACT_TAG: php-${{ matrix.php }}
        run: php tests/integration/updater_live_apply_contract.php

      - name: Verify CLI and destructive-boundary invariants
        shell: bash
        run: |
          set -euo pipefail
          php bin/update_apply.php --help | grep -Fq 'transactional live updater'
          grep -Fq "markLiveMutationStarted" bin/update_apply.php
          grep -Fq "markRollbackFailed" bin/update_apply.php
          grep -Fq "maintenance->leave" bin/update_apply.php
          grep -Fq "--dry-run" bin/update_apply.php
          grep -Fq "--status" bin/update_apply.php
          grep -Fq "restart', '-d'" bin/update_apply.php
          grep -Fq "PRESERVED_ROOTS" core/UpdateLiveApplier.php
          grep -Fq "DROP TABLE IF EXISTS" core/UpdateLiveApplier.php
          grep -Fq "rollback_failed" core/UpdateTransactionStateMachine.php
          ! grep -Fq 'unzip ' bin/update_apply.php
