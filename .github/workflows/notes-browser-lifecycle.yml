name: Notes browser lifecycle

on:
  pull_request:
    branches: [master, '1.0', 0.13-ux-foundation]

permissions:
  contents: read

jobs:
  notes-browser-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: notes_browser_lifecycle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, sodium, fileinfo, gd
          coverage: none

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify vendor-free isolated Notes runtime
        shell: bash
        run: |
          set -euo pipefail
          test ! -e vendor
          find modules/notes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/e2e/router.php
          php tests/integration/native_notes_contract.php
          for source in modules/notes/assets/*.js; do
            node --check "$source"
          done
          node --check tests/e2e/notes-lifecycle.mjs
          node --check tests/e2e/notes-voice-contract.mjs
          test ! -e app/controllers/NoteController.php
          test ! -e app/views/notes_page/editor-013.tpl

      - name: Prepare canonical database
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/messenger_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/notes_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/file_manager_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/user_fields_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/tasks_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/settings_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/module_lifecycle_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/access_control_schema.sql
          mysql -h 127.0.0.1 -uroot -proot notes_browser_lifecycle < database/audit_schema.sql

      - name: Seed browser user and environment
        shell: bash
        env:
          DBHOST: 127.0.0.1
          DBPORT: 3306
          DBUSER: root
          DBPASS: root
          DBNAME: notes_browser_lifecycle
        run: |
          set -euo pipefail
          TEST_PASSWORD="$(php -r 'echo bin2hex(random_bytes(18));')"
          APP_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          MESSAGE_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          TICKET_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          echo "::add-mask::$TEST_PASSWORD"
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$MESSAGE_KEY"
          echo "::add-mask::$TICKET_KEY"
          export TEST_PASSWORD

          php <<'PHP'
          <?php
          declare(strict_types=1);
          $pdo = new PDO(
              sprintf('mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4', getenv('DBHOST'), getenv('DBPORT'), getenv('DBNAME')),
              getenv('DBUSER'),
              getenv('DBPASS'),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );
          $stmt = $pdo->prepare(
              'INSERT INTO users (uid,username,email,password_hash,firstname,lastname,role,is_active,created_at,updated_at) '
              . 'VALUES (:uid,:username,:email,:password_hash,:firstname,:lastname,888,1,NOW(),NOW())'
          );
          $stmt->execute([
              ':uid' => 'ba5e0000-0000-4000-8000-000000000014',
              ':username' => 'notes-lifecycle-user',
              ':email' => 'notes-lifecycle@example.test',
              ':password_hash' => password_hash((string) getenv('TEST_PASSWORD'), PASSWORD_ARGON2ID),
              ':firstname' => 'Notes',
              ':lastname' => 'Lifecycle',
          ]);
          PHP

          rm -rf /tmp/workspace-notes-lifecycle
          mkdir -p /tmp/workspace-notes-lifecycle/logs compile cache
          chmod 700 /tmp/workspace-notes-lifecycle /tmp/workspace-notes-lifecycle/logs
          rm -f /tmp/workspace-organizer-startup.log

          cat > .env <<ENV
          DBDRIVER=mysql
          DBHOST=127.0.0.1
          DBPORT=3306
          DBUSER=root
          DBPASS=root
          DBNAME=notes_browser_lifecycle
          UNIQUE_KEY=${APP_KEY}
          MSG_SECRET_KEY=${MESSAGE_KEY}
          WS_TICKET_SECRET=${TICKET_KEY}
          PRIVATE_STORAGE_PATH=/tmp/workspace-notes-lifecycle
          SITEURL=http://127.0.0.1:18089
          BASE_PATH=/workspace/
          REGISTRATION_INVITE_CODE=
          WS_HOST=127.0.0.1
          WS_PORT=27802
          WS_PUBLIC_URL=ws://127.0.0.1:27802/workspace/ws
          WS_ALLOWED_ORIGINS=http://127.0.0.1:18089
          AUTH_RATE_LIMIT_ATTEMPTS=50
          AUTH_RATE_LIMIT_WINDOW_SECONDS=60
          UPLOAD_RATE_LIMIT_ATTEMPTS=100
          UPLOAD_RATE_LIMIT_WINDOW_SECONDS=60
          NOTES_MAX_UPLOAD_SIZE=10485760
          MAX_NOTE_ATTACHMENTS=10
          LOG_LEVEL=INFO
          LOG_FILE=/tmp/workspace-notes-lifecycle/logs/app.log
          CSRF_ENABLED=true
          ENV
          chmod 600 .env

          printf 'E2E_USER=%s\n' 'notes-lifecycle-user' >> "$GITHUB_ENV"
          printf 'E2E_PASSWORD=%s\n' "$TEST_PASSWORD" >> "$GITHUB_ENV"

      - name: Activate ephemeral CI license
        shell: bash
        run: |
          set -euo pipefail
          php tests/support/ci_license_fixture.php

      - name: Start subdirectory application
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/workspace-notes-lifecycle-http.log
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:18089 tests/e2e/router.php >/tmp/workspace-notes-lifecycle-http.log 2>&1 &
          echo $! >/tmp/workspace-notes-lifecycle-http.pid
          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18089/workspace/auth/login/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [[ "$READY" != '1' ]]; then
            cat /tmp/workspace-notes-lifecycle-http.log >&2
            exit 1
          fi

      - name: Run Notes lifecycle in Chromium
        shell: bash
        env:
          E2E_ORIGIN: http://127.0.0.1:18089
          E2E_BASE_PATH: /workspace
        run: |
          set -euo pipefail
          node tests/e2e/notes-lifecycle.mjs
          node tests/e2e/notes-voice-contract.mjs

      - name: Verify durable Notes lifecycle state
        shell: bash
        run: |
          set -euo pipefail
          DELETED_NOTES="$(mysql -N -h 127.0.0.1 -uroot -proot notes_browser_lifecycle -e "SELECT COUNT(*) FROM notes WHERE notename LIKE 'Notes lifecycle % updated' AND is_deleted=1")"
          ACTIVE_SHARES="$(mysql -N -h 127.0.0.1 -uroot -proot notes_browser_lifecycle -e "SELECT COUNT(*) FROM shared_notes s INNER JOIN notes n ON n.id=s.note_id WHERE n.notename LIKE 'Notes lifecycle % updated' AND s.is_active=1")"
          ATTACHMENTS="$(mysql -N -h 127.0.0.1 -uroot -proot notes_browser_lifecycle -e "SELECT COUNT(*) FROM note_attachments a INNER JOIN notes n ON n.id=a.note_id WHERE n.notename LIKE 'Notes lifecycle % updated'")"
          ACTIVE_ATTACHMENTS="$(mysql -N -h 127.0.0.1 -uroot -proot notes_browser_lifecycle -e "SELECT COUNT(*) FROM note_attachments a INNER JOIN notes n ON n.id=a.note_id WHERE n.notename LIKE 'Notes lifecycle % updated' AND a.is_deleted=0")"
          ATTACHMENT_PATH="$(mysql -N -h 127.0.0.1 -uroot -proot notes_browser_lifecycle -e "SELECT a.file_path FROM note_attachments a INNER JOIN notes n ON n.id=a.note_id WHERE n.notename LIKE 'Notes lifecycle % updated' LIMIT 1")"
          VOICE_ROW="$(mysql -N -B -h 127.0.0.1 -uroot -proot notes_browser_lifecycle -e "SELECT CONCAT(a.file_type,':',IFNULL(a.duration,0),':',a.is_deleted) FROM note_attachments a INNER JOIN notes n ON n.id=a.note_id WHERE n.notename LIKE 'Voice contract %' LIMIT 1")"
          test "$DELETED_NOTES" = '1'
          test "$ACTIVE_SHARES" = '0'
          test "$ATTACHMENTS" = '1'
          test "$ACTIVE_ATTACHMENTS" = '0'
          test -n "$ATTACHMENT_PATH"
          test -f "$ATTACHMENT_PATH"
          test "$VOICE_ROW" = 'voice:2:0'

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- PHP server ---'
          cat /tmp/workspace-notes-lifecycle-http.log || true
          echo '--- PHP startup/application errors ---'
          cat /tmp/workspace-organizer-startup.log || true
          echo '--- application log ---'
          cat /tmp/workspace-notes-lifecycle/logs/app.log || true

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/workspace-notes-lifecycle-http.pid ]]; then
            PID="$(cat /tmp/workspace-notes-lifecycle-http.pid)"
            pkill -TERM -P "$PID" >/dev/null 2>&1 || true
            kill "$PID" >/dev/null 2>&1 || true
          fi