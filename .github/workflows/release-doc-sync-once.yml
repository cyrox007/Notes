name: One-shot 1.0 stable documentation sync

on:
  push:
    branches: ['1.0-stable-release-prep']

permissions:
  contents: write

jobs:
  sync-release-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: 1.0-stable-release-prep

      - name: Patch README and CHANGELOG exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          already_stable = '**Версия:** `1.0.0`' in text

          if not already_stable:
              old = """**Версия:** `0.14.0-beta.4`  
          **Актуально на:** 15 сентября 2026  
          **Статус:** beta.4 / role policies and shared task boards; следующая основная цель — `1.0.0` stable

          Workspace Organizer — внутреннее PHP-приложение для корпоративной работы: заметки, личные и общие задачи, файлы, профиль, администрирование и real-time Messenger.

          Версия `0.14.0-beta.4` добавляет полноценное управление ролями поверх persisted RBAC, отдельный слой типизированных ограничений модулей и совместные task boards для выбранных пользователей или всех активных аккаунтов. Ограничения применяются server-side в Notes, Tasks, File Manager и Messenger, а навигация отражает эффективные разрешения текущего пользователя. Сохраняются managed registration beta.3, WebSocket deployment fixes beta.2 и совместимость PHP 8.1+. Следующая основная цель — `1.0.0` stable: vendor-free runtime, signed updater/recovery, installation-wide licensing и остальные stable blockers.
          """
              new = """**Версия:** `1.0.0`  
          **Актуально на:** 16 сентября 2026  
          **Статус:** stable

          Workspace Organizer — self-hosted PHP-приложение для корпоративной работы: заметки, личные и общие задачи, файлы, профиль, администрирование и real-time Messenger.

          `1.0.0` фиксирует stable platform contract: vendor-free PHP runtime, native view/WebSocket infrastructure, persisted RBAC и module policies, installation-bound offline Ed25519 licensing, signed remote updater с external staging, transactional code+MySQL rollback и проверенный upgrade path с `0.14.0-beta.4`.
          """
              if old not in text:
                  raise SystemExit('README stable identity source block not found')
              text = text.replace(old, new, 1)

              replacements = {
                  '- для realtime Messenger/Workerman: POSIX-compatible host, PHP CLI, `pcntl`, `posix`, long-running process и WebSocket reverse proxy;': '- для realtime Messenger/native WebSocket runtime: POSIX-compatible host, PHP CLI, `pcntl`, long-running process и WebSocket reverse proxy;',
                  '**Composer на конечном shared hosting не обязателен**, если используется готовый hosting bundle из GitHub Release. Composer нужен при установке непосредственно из source tree и для development/CI.': '**Composer не является runtime-зависимостью 1.0.** Готовый hosting bundle и source tree запускаются без `vendor/`; Composer может использоваться только как development/tooling utility, но production package не зависит от него.',
                  '- проверяет PHP 8.1+, extensions, Argon2id и наличие production `vendor/`;': '- проверяет PHP 8.1+, необходимые extensions и Argon2id; production runtime не требует `vendor/`;',
                  'На production hosting маршрут `/ws` должен проксироваться на локальный Workerman process. Это единственная часть, которую невозможно универсально стартовать web-installer\'ом на каждом типе shared hosting: тариф должен поддерживать long-running PHP process/WebSocket proxy.': 'На production hosting маршрут `/ws` должен проксироваться на локальный native WebSocket process. Это единственная часть, которую невозможно универсально стартовать web-installer\'ом на каждом типе shared hosting: тариф должен поддерживать long-running PHP process/WebSocket proxy.',
                  'Production: запускайте Workerman через hosting background-process manager, systemd/supervisor/container orchestration и публикуйте браузеру только через WSS reverse proxy. Полный runbook: [`docs/MESSENGER_SERVER.md`](docs/MESSENGER_SERVER.md).': 'Production: запускайте native WebSocket server через hosting background-process manager, systemd/supervisor/container orchestration и публикуйте браузеру только через WSS reverse proxy. Полный runbook: [`docs/MESSENGER_SERVER.md`](docs/MESSENGER_SERVER.md).',
              }
              for source, target in replacements.items():
                  if source not in text:
                      raise SystemExit(f'README marker not found: {source[:60]}')
                  text = text.replace(source, target, 1)

              source_install = """### Установка из исходников

          Для development, VPS или собственного build pipeline:

          ```bash
          composer install --no-dev --optimize-autoloader
          ```

          После этого также можно использовать `/install.php`; вручную копировать `default.env` и импортировать SQL для **fresh install** не требуется.
          """
              target_install = """### Установка из исходников

          Исходный tree 1.0 является vendor-free и не требует `composer install` для запуска. После checkout/deploy можно использовать `/install.php`; вручную копировать `default.env` и импортировать SQL для **fresh install** не требуется.
          """
              if source_install not in text:
                  raise SystemExit('README source-install block not found')
              text = text.replace(source_install, target_install, 1)
              readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## 1.0.0 — 2026-09-16' not in text:
              intro = 'Формат основан на принципах Keep a Changelog. Начиная с 0.14 проект находится в beta: совместимость upgrade-path и пользовательских данных является частью release contract; до 1.0 внутренние platform contracts ещё могут меняться через явные compatibility migrations. Canonical `*_schema.sql` остаются источником текущей схемы fresh install.'
              intro_new = 'Формат основан на принципах Keep a Changelog. Начиная с `1.0.0` проект имеет stable platform contract: совместимость upgrade-path и пользовательских данных является release contract, а изменения схемы выполняются через явные compatibility migrations. Canonical `*_schema.sql` остаются источником текущей схемы fresh install.'
              if intro not in text:
                  raise SystemExit('CHANGELOG intro marker not found')
              text = text.replace(intro, intro_new, 1)

              unreleased = """## Unreleased

          Основная цель после первого beta — `1.0.0` stable. Крупный пользовательский feature scope остаётся заморожен; приоритеты: отказ от сторонних runtime-библиотек, полная runtime-изоляция модулей, package compositions, signed updater/recovery, installation-wide licensing, observability, upgrade/load/soak/cross-browser evidence, key re-encryption и CSP hardening.
          """
              stable = """## Unreleased

          После stable `1.0.0` изменения ведутся как отдельный maintenance/feature cycle без ретроактивного изменения опубликованных migration и trust contracts.

          ## 1.0.0 — 2026-09-16

          ### Stable runtime / security boundary
          - Runtime полностью отвязан от Composer `vendor/`: собственный Environment loader, native PHP view renderer и native RFC6455 WebSocket server работают из release bundle без сторонних PHP runtime packages.
          - Request/Router boundary получил bounded strict JSON parsing, duplicate-route validation, fail-closed malformed requests, корректный 405 и типизированные route params.
          - Hosting package исключает `.env`, `vendor/`, vendor signing tools и private signing material.

          ### Installation-bound licensing
          - Добавлены стабильный `installation_id`, offline Ed25519 license, admin activation и recovery-safe read-only enforcement.
          - License trust registry содержит только public keys; private license signing key существует только в offline vendor domain.

          ### Signed updater / rollback
          - Реализован независимый update-signing trust domain, signed manifest, SHA-256/compatibility verification, hardened public HTTPS delivery и immutable external staging.
          - ZIP audit выполняется до extraction; release candidate распаковывается вне live tree и проверяется по CRC, size и SHA-256 tree manifest.
          - Перед live mutation создаются и повторно проверяются code + consistent MySQL rollback backups и durable external transaction journal.
          - Migration preflight до destructive boundary является data-only: current updater читает candidate JSON/SQL и DB ledger без исполнения candidate PHP.
          - Controlled live switch, migrations, post-health/version/schema verification и WebSocket restart входят в одну recovery story; ошибка после boundary автоматически восстанавливает code + MySQL.
          - Crash recovery продолжает rollback по durable journal; при непроверенном rollback installation остаётся в maintenance с `rollback_failed`.

          ### Delivery / release evidence
          - Admin UI умеет проверить signed feed и подготовить verified staged package, не открывая browser one-click destructive apply.
          - Trusted external `bin/update_bootstrap.php` закрывает первый переход с опубликованной `0.14.0-beta.4`, которая предшествует updater runtime.
          - CI drill устанавливает точную Beta4 через HTTP installer, доказывает signed upgrade до 1.0 и отдельно принудительный post-switch failure с automatic code + DB rollback до здоровой Beta4.
          - Завершён residual branch audit: два полезных security/updater хвоста перенесены адаптированно, устаревшие ветки не мержились целиком.
          """
              if unreleased not in text:
                  raise SystemExit('CHANGELOG Unreleased source block not found')
              text = text.replace(unreleased, stable, 1)
              changelog.write_text(text, encoding='utf-8')
          PY

      - name: Commit synchronized docs when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Stable documentation already synchronized.'
            exit 0
          fi
          git commit -m 'release: synchronize 1.0 stable documentation'
          git push origin HEAD:1.0-stable-release-prep
