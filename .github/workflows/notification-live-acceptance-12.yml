name: Отчёт приёмки реальной доставки

on:
  pull_request:
    branches: ['1.2']
    paths:
      - 'app/services/notifications/NotificationLiveAcceptanceReport.php'
      - 'bin/notifications_acceptance_report.php'
      - 'tests/integration/notification_live_acceptance_report_mysql_12.php'
      - '.github/workflows/notification-live-acceptance-12.yml'
  push:
    branches: ['1.2']
    paths:
      - 'app/services/notifications/NotificationLiveAcceptanceReport.php'
      - 'bin/notifications_acceptance_report.php'
      - 'tests/integration/notification_live_acceptance_report_mysql_12.php'

permissions:
  contents: read

jobs:
  report:
    name: Отчёт о доставке (${{ matrix.db.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db:
          - {name: MySQL-8.4, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'}
          - {name: MariaDB-11.4, image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_DATABASE: workspace_live_acceptance_test
          MYSQL_USER: workspace
          MYSQL_PASSWORD: workspace
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Испытать отчёт
        env:
          TEST_DB_NAME: workspace_live_acceptance_test
          TEST_DB_USER: workspace
          TEST_DB_PASS: workspace
        run: |
          php -l bin/notifications_acceptance_report.php
          php -l app/services/notifications/NotificationLiveAcceptanceReport.php
          php tests/integration/notification_live_acceptance_report_mysql_12.php
