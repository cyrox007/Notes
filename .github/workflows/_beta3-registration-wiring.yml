name: Temporary beta3 registration wiring

on:
  push:
    branches: [0.14-beta3-registration-policy]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.14-beta3-registration-policy
          fetch-depth: 0

      - name: Wire registration routes and deployment docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          router = Path('core/routerConfig.php')
          text = router.read_text(encoding='utf-8')

          old = "use App\\Controllers\\Admin\\SettingsController;\n"
          new = old + "use App\\Controllers\\Admin\\RegistrationSettingsController;\nuse App\\Controllers\\Admin\\UserProvisioningController;\n"
          if old not in text:
              raise SystemExit('admin controller use marker missing')
          text = text.replace(old, new, 1)

          old = "    ->add('GET', '/registration/{str:invite_code}', [AuthController::class, 'registration'], [], 'registration')\n"
          new = "    ->add('GET', '/registration', [AuthController::class, 'registration'], [], 'registration')\n    ->add('GET', '/registration/{str:invite_code}', [AuthController::class, 'registration'], [], 'registration_invite')\n"
          if old not in text:
              raise SystemExit('registration route marker missing')
          text = text.replace(old, new, 1)

          old = "   ->add('POST', '/users/toggle-status', [AdminController::class, 'toggleUserStatus'], [LoginRequared::class, RequireAdminUsersManage::class], 'admin_toggle_user')\n"
          new = "   ->add('POST', '/users/create', [UserProvisioningController::class, 'create'], [LoginRequared::class, RequireAdminUsersManage::class], 'admin_create_user')\n" + old
          if old not in text:
              raise SystemExit('admin user route marker missing')
          text = text.replace(old, new, 1)

          old = "   ->add('GET', '/settings', [SettingsController::class, 'index'], [LoginRequared::class, RequireAdminSettingsManage::class], 'admin_settings')\n"
          new = (
              "   ->add('GET', '/registration', [RegistrationSettingsController::class, 'index'], [LoginRequared::class, RequireAdminSettingsManage::class], 'admin_registration')\n"
              "   ->add('POST', '/registration/mode', [RegistrationSettingsController::class, 'saveMode'], [LoginRequared::class, RequireAdminSettingsManage::class], 'admin_registration_mode')\n"
              "   ->add('POST', '/registration/invites/create', [RegistrationSettingsController::class, 'createInvite'], [LoginRequared::class, RequireAdminSettingsManage::class], 'admin_registration_invite_create')\n"
              "   ->add('POST', '/registration/invites/revoke', [RegistrationSettingsController::class, 'revokeInvite'], [LoginRequared::class, RequireAdminSettingsManage::class], 'admin_registration_invite_revoke')\n"
              + old
          )
          if old not in text:
              raise SystemExit('admin settings route marker missing')
          text = text.replace(old, new, 1)
          router.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = "- HTTPS + WSS для production Messenger.\n"
          addition = marker + "\nПодробная матрица Open Server 6+, legacy-compatible Open Server 5.4.x, shared hosting и VPS/VDS: [`docs/DEPLOYMENT_COMPATIBILITY.md`](docs/DEPLOYMENT_COMPATIBILITY.md).\n"
          if marker not in text:
              raise SystemExit('README deployment marker missing')
          text = text.replace(marker, addition, 1)
          readme.write_text(text, encoding='utf-8')

          messenger = Path('docs/MESSENGER_SERVER.md')
          text = messenger.read_text(encoding='utf-8')
          marker = "Workspace Organizer использует отдельный долгоживущий **Workerman**-процесс для realtime Messenger."
          replacement = marker + " Матрица совместимости Open Server 5.4/6+, shared hosting и VPS вынесена в `docs/DEPLOYMENT_COMPATIBILITY.md`."
          if marker not in text:
              raise SystemExit('Messenger runbook marker missing')
          text = text.replace(marker, replacement, 1)
          messenger.write_text(text, encoding='utf-8')
          PY

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/routerConfig.php README.md docs/MESSENGER_SERVER.md
          git commit -m 'Wire registration policy routes and deployment docs'
          git push origin HEAD:0.14-beta3-registration-policy
