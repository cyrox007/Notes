name: Profile publication contract

on:
  pull_request:
    branches: [master, '1.0']
  push:
    branches: [0.13-public-profile-content]

permissions:
  contents: read

jobs:
  profile-publication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify publication schema and upgrade manifest
        shell: bash
        run: |
          set -euo pipefail
          php -l bin/migrate.php
          php -l modules/profile/services/ProfilePublicationService.php
          php -l modules/profile/controllers/ProfileController.php
          php -l modules/profile/controllers/PublicProfileController.php
          grep -Fq "20260914_profile_publication.sql" database/migrations/manifest.json
          grep -Fq "database/migrations/20260914_profile_publication.sql" core/DatabaseOwnership.php
          php tests/integration/native_profile_contract.php
          grep -Fq 'is_profile_public' database/notes_schema.sql
          grep -Fq 'is_profile_public' database/tasks_schema.sql
          grep -Fq 'is_profile_public' database/file_manager_schema.sql
          grep -Fq 'workspace_add_profile_publication' database/migrations/20260914_profile_publication.sql

      - name: Verify privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ProfileContentProvider' modules/profile/services/ProfilePublicationService.php
          grep -Fq 'workspace.notes' modules/profile/services/ProfilePublicationService.php
          grep -Fq 'workspace.tasks' modules/profile/services/ProfilePublicationService.php
          grep -Fq 'workspace.files' modules/profile/services/ProfilePublicationService.php
          ! grep -Fq 'share_token' modules/profile/services/ProfilePublicationService.php
          ! grep -Fq 'file_path' modules/profile/views/public.php
          ! grep -Fq 'share_token' modules/profile/views/public.php
